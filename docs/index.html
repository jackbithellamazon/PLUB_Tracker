/* First load of v1.00: copy PLUB's saved data exactly as the previous version left it, before anything on this page
   (the shared core, or either app as it loads) can bring it up to date. Memory only — the shared browser storage is too
   full for a second copy — and it rides along inside "Export everything" as before_update. Same key list as PD_KEYS. */
window.__plubPre=(function(){ try{
  if(localStorage.getItem('plub_build_seen')==='1.00') return null;
  var list=['plub_v1','plub_who','plub_mode','plub_outbox_v1','ubpl_shell_tab','plub_rail_min','plub_ov_view','plub_ov_filter',
    'ub_tracker_v1','ub_sb_min','ub_last_report','ub_last_backup','pl_sourcing_v1','pls_theme','pls_draft','pl_sb_min'];
  var o={}, n=0;
  for(var i=0;i<localStorage.length;i++){ var k=localStorage.key(i); if(k&&(list.indexOf(k)>=0||/^(ub_tracker_v1__|pl_sourcing_v1_quarantine_)/.test(k))){ o[k]=localStorage.getItem(k); n++; } }
  try{ localStorage.setItem('plub_build_seen','1.00'); }catch(e){}
  return n?{captured_at:new Date().toISOString(),keys:o}:null;
}catch(e){ return null; } })();

<style>

<!-- plub-core --><script>
/* ══════════════════════════════════════════════════════════════════════
   PLUB CORE — identity, activity, sessions, tasks, work types, settings.
   One copy, byte-identical in index.html, ub.html and pl.html.

   THIS WEEKEND: everything lives in localStorage under club_v1 (shared by
   the shell and both frames — same origin). Cross-frame changes arrive via
   the `storage` event, so a task sent from PL shows in UB without a reload.

   MONDAY: CLUB.sync.enable(supabaseClient) pulls the seven tables, then
   every write also upserts. The local store stays as the cache. Same rows,
   same shape as the SQL in  CLUB - 1 - Supabase setup.sql.
   ══════════════════════════════════════════════════════════════════════ */
window.CLUB = (function(){
  var KEY='plub_v1', WHO='plub_who', MODE='plub_mode', OUTBOX='plub_outbox_v1';
  var COLS=['users','activity','sessions','tasks','task_notes','work_types'];
  var DEF_USERS=[
    {id:'jack',  display_name:'Jack',  role:'owner', active:true},
    {id:'becki', display_name:'Becki', role:'staff', active:true}];
  /* The five session types (UK staff spec, 9 Sept 2026). Sourcing Hours is the time spent
     finding AND building a new product — discovery, research, suppliers and getting the
     listing ready. Growth & Optimisation is deliberately outside it: by then the product is
     launched and proven, so that time is improving an existing product, not building a new one.
     It is still timed and reported, just not against the KPI. */
  var WT_VERSION=2;
  var DEF_WT=[
    {key:'fresh',     label:'Fresh sourcing',         sort:10, active:true, counts_as_sourcing:true,
     hint:'New product ideas and opportunities \u2014 market research, competitor discovery, browsing'},
    {key:'research',  label:'Research & validation',  sort:20, active:true, counts_as_sourcing:true,
     hint:'Is this idea worth progressing \u2014 demand, competitors, pricing, margin, differentiation'},
    {key:'suppliers', label:'Suppliers & purchasing', sort:30, active:true, counts_as_sourcing:true,
     hint:'Finding and contacting suppliers, quotes, trade pricing, MOQs, samples, freight, purchasing'},
    {key:'listing',   label:'Listing & creative',     sort:40, active:true, counts_as_sourcing:true,
     hint:'Keyword and competitor listing research, images, A+ content, building the listing'},
    {key:'growth',    label:'Growth & optimisation',  sort:50, active:true, counts_as_sourcing:false,
     hint:'Improving a product that is already live \u2014 PPC, SEO, conversion, pricing tests'}];
  /* Every key either app has ever written maps onto the five, so no logged hour is lost and
     no session history reads as blank. */
  var LEGACY={ ideas:'fresh', working:'research', validate:'research',
    supplier:'suppliers', contact:'suppliers', pricing:'suppliers',
    images:'listing', pipeline:'research', ppc:'growth', optimise:'growth' };

  var S=null;
  function load(){
    var raw=null; try{ raw=localStorage.getItem(KEY); }catch(e){}
    try{ S=raw?JSON.parse(raw):null; }catch(e){ S=null; }
    if(!S||typeof S!=='object') S={schema:1};
    COLS.forEach(function(c){ if(!Array.isArray(S[c])) S[c]=[]; });
    if(!S.settings||typeof S.settings!=='object') S.settings={};
    if(!S.users.length) S.users=DEF_USERS.map(function(u){return Object.assign({},u);});
    // upgrade an older stored list in place — a saved copy of the previous eight would
    // otherwise keep the old options on screen for ever
    if(!S.work_types.length || (S.wt_version||1) < WT_VERSION){
      S.work_types=DEF_WT.map(function(w){return Object.assign({},w);}); S.wt_version=WT_VERSION;
    }
  }
  load();
  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} notify(); }
  function uuid(){ try{ if(crypto&&crypto.randomUUID) return crypto.randomUUID(); }catch(e){}
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,function(c){var r=Math.random()*16|0;return (c==='x'?r:(r&3|8)).toString(16);}); }
  function now(){ return new Date().toISOString(); }
  function mode(){ try{ return localStorage.getItem(MODE)||'local'; }catch(e){ return 'local'; } }

  /* ── identity ─────────────────────────────────────────────────────── */
  function whoId(){ try{ return localStorage.getItem(WHO)||''; }catch(e){ return ''; } }
  function user(){ var id=whoId(); return S.users.filter(function(u){return u.id===id;})[0]||null; }
  function users(){ return S.users.filter(function(u){return u.active!==false;}); }
  function setWho(id){ try{ localStorage.setItem(WHO,id); }catch(e){} notify(); }
  function signOut(){ try{ localStorage.removeItem(WHO); }catch(e){} notify(); }
  function byId(id){ return S.users.filter(function(u){return u.id===id;})[0]||null; }
  function nameOf(id){ var u=byId(id); return u?u.display_name:(id||'?'); }

  /* ── generic rows ─────────────────────────────────────────────────── */
  function add(col,row){ row.id=row.id||uuid(); row.created_at=row.created_at||now(); S[col].push(row); save(); push(col,row); return row; }
  function update(col,id,patch){ var r=S[col].filter(function(x){return x.id===id;})[0]; if(!r) return null;
    Object.keys(patch).forEach(function(k){ r[k]=patch[k]; }); r.updated_at=now(); save(); push(col,r); return r; }
  function all(col){ return S[col].slice(); }

  /* ── activity: the audit log ──────────────────────────────────────── */
  function log(kind,o){
    o=o||{}; var u=user();
    var row={ id:uuid(), at:now(), actor_id:u?u.id:null, actor_name:u?u.display_name:(whoId()||'?'),
      app:o.app||'club', kind:kind,
      entity_kind:o.entity_kind||null, entity_ref:(o.entity_ref!=null?String(o.entity_ref):null),
      entity_name:o.entity_name||null, from_val:o.from!=null?String(o.from):null, to_val:o.to!=null?String(o.to):null,
      mins:(typeof o.mins==='number')?Math.round(o.mins):null, session_id:o.session_id||null, detail:o.detail||{} };
    S.activity.push(row);
    if(S.activity.length>6000) S.activity=S.activity.slice(-5000);   // local cap; the DB keeps everything
    save(); push('activity',row); return row;
  }

  /* ── sessions: time by type of work ───────────────────────────────── */
  function workTypes(activeOnly){ var w=S.work_types.slice().sort(function(a,b){return (a.sort||0)-(b.sort||0);});
    return activeOnly===false? w : w.filter(function(x){return x.active!==false;}); }
  function wtKey(k){ k=k||'fresh'; return LEGACY[k]||k; }
  function wtLabel(k){ k=wtKey(k); var w=S.work_types.filter(function(x){return x.key===k;})[0]; return w?w.label:k; }
  function wtHint(k){ k=wtKey(k); var w=S.work_types.filter(function(x){return x.key===k;})[0]; return (w&&w.hint)||''; }
  // does this type count toward the Sourcing Hours KPI? unknown keys count, so nothing is lost silently
  function wtCounts(k){ k=wtKey(k); var w=S.work_types.filter(function(x){return x.key===k;})[0]; return w? w.counts_as_sourcing!==false : true; }
  function saveWorkTypes(list){ S.work_types=list; save(); }
  function sessionStart(app,work_type,note){
    var u=user(); var row=add('sessions',{ user_id:u?u.id:null, app:app, work_type:wtKey(work_type), started_at:now(), ended_at:null, mins:null, note:note||'', entity_refs:[] });
    log('session_start',{app:app, entity_kind:'session', entity_ref:row.id, to:wtLabel(work_type), session_id:row.id});
    return row;
  }
  function sessionEnd(id,o){ o=o||{}; var r=S.sessions.filter(function(x){return x.id===id;})[0]; if(!r) return null;
    r.ended_at=now(); r.mins=(typeof o.mins==='number')?Math.max(0,Math.round(o.mins)):Math.max(0,Math.round((Date.now()-new Date(r.started_at).getTime())/60000));
    if(o.note) r.note=o.note; if(o.entity_refs) r.entity_refs=o.entity_refs; save(); push('sessions',r);
    log('session_end',{app:r.app, entity_kind:'session', entity_ref:r.id, to:wtLabel(r.work_type), mins:r.mins, session_id:r.id}); return r; }
  function sessionQuick(app,work_type,mins,note){
    var u=user(); var t=now();
    var row=add('sessions',{ user_id:u?u.id:null, app:app, work_type:wtKey(work_type), started_at:t, ended_at:t, mins:Math.max(0,Math.round(mins)), note:note||'', entity_refs:[] });
    log('session_logged',{app:app, entity_kind:'session', entity_ref:row.id, to:wtLabel(work_type), mins:row.mins, session_id:row.id}); return row; }
  function sessionsFor(userId,sinceMs,untilMs){ return S.sessions.filter(function(s){ var t=new Date(s.started_at).getTime();
    return (!userId||s.user_id===userId) && (sinceMs==null||t>=sinceMs) && (untilMs==null||t<untilMs); }); }

  /* ── tasks between people ─────────────────────────────────────────── */
  function taskAdd(o){
    var u=user(); var row=add('tasks',{ title:o.title, type:o.type||'general', url:o.url||null, brief:o.brief||null,
      priority:o.priority||'normal', status:'not_started', created_by:u?u.id:null, assigned_to:o.assigned_to||(u?u.id:null),
      due:o.due||null, related_app:o.related_app||null, related_ref:o.related_ref!=null?String(o.related_ref):null,
      related_name:o.related_name||null, completed_at:null, completed_by:null, updated_at:now() });
    log('task_assigned',{app:o.related_app||'club', entity_kind:'task', entity_ref:row.id, entity_name:row.title, to:nameOf(row.assigned_to),
      detail:{related_ref:row.related_ref, related_name:row.related_name}});
    return row; }
  function taskStatus(id,status){ var u=user(); var r=update('tasks',id,{ status:status,
      completed_at:status==='done'?now():null, completed_by:status==='done'?(u?u.id:null):null });
    if(r) log(status==='done'?'task_done':'task_status',{app:r.related_app||'club', entity_kind:'task', entity_ref:r.id, entity_name:r.title, to:status});
    return r; }
  function taskNote(id,text){ var u=user(); var r=S.tasks.filter(function(x){return x.id===id;})[0]; if(!r) return null;
    var n=add('task_notes',{ task_id:id, who_id:u?u.id:null, who_name:u?u.display_name:'?', text:text, at:now() });
    log('task_note',{app:r.related_app||'club', entity_kind:'task', entity_ref:id, entity_name:r.title}); return n; }
  function tasksFor(userId,o){ o=o||{}; return S.tasks.filter(function(t){
    return !t.deleted_at && (!userId||t.assigned_to===userId) && (o.all||t.status!=='done'); })
    .sort(function(a,b){ var P={urgent:0,high:1,normal:2,low:3}; return (P[a.priority]-P[b.priority])||(a.due||'9').localeCompare(b.due||'9'); }); }
  function taskNotes(id){ return S.task_notes.filter(function(n){return n.task_id===id;}); }

  /* ── shared settings ──────────────────────────────────────────────── */
  function setting(key,val){ if(val===undefined) return S.settings[key]; S.settings[key]=val; save(); push('settings',{key:key,value:val}); return val; }

  /* ── "what happened?" ─────────────────────────────────────────────── */
  function activityBetween(sinceMs,untilMs,userId){ return S.activity.filter(function(a){ var t=new Date(a.at).getTime();
    return t>=sinceMs && (untilMs==null||t<untilMs) && (!userId||a.actor_id===userId); }); }
  function summarise(sinceMs,untilMs){
    var out={};
    users().forEach(function(u){
      var acts=activityBetween(sinceMs,untilMs,u.id), sess=sessionsFor(u.id,sinceMs,untilMs).filter(function(s){return s.mins!=null;});
      var byType={}; sess.forEach(function(s){ byType[s.work_type]=(byType[s.work_type]||0)+(s.mins||0); });
      var count=function(k){ return acts.filter(function(a){return a.kind===k;}).length; };
      out[u.id]={ user:u, sessions:sess.length, mins:sess.reduce(function(a,s){return a+(s.mins||0);},0), byType:byType,
        ideas_added:count('idea_added'), ideas_updated:count('idea_updated'), moved:count('stage'), entered:count('entered_pipeline'),
        launched:count('launched'), dropped:count('dropped'), suppliers:count('supplier_added')+count('supplier_contacted'),
        samples:count('sample_added')+count('sample_ordered')+count('sample_received'), tasks_done:count('task_done'),
        tasks_assigned:count('task_assigned'), opened:count('product_opened'), notes:count('note'), acts:acts };
    });
    return out;
  }

  /* ── cross-frame + subscribers ────────────────────────────────────── */
  var subs=[]; function on(fn){ subs.push(fn); } function notify(){ subs.forEach(function(f){ try{ f(); }catch(e){} }); }
  try{ window.addEventListener('storage',function(e){ if(e.key===KEY||e.key===WHO||e.key===MODE){ load(); notify(); } }); }catch(e){}

  /* ── Supabase sync (Monday). Dormant until enable() is called. ───── */
  var sb=null, outbox=[];
  try{ outbox=JSON.parse(localStorage.getItem(OUTBOX)||'[]'); }catch(e){ outbox=[]; }
  var TABLE={users:'bdl_plub_users',activity:'bdl_plub_activity',sessions:'bdl_plub_sessions',tasks:'bdl_plub_tasks',
             task_notes:'bdl_plub_task_notes',work_types:'bdl_plub_work_types',settings:'bdl_plub_settings'};
  function push(col,row){ if(mode()!=='supabase') return; outbox.push({col:col,row:row,at:Date.now()});
    try{ localStorage.setItem(OUTBOX,JSON.stringify(outbox.slice(-2000))); }catch(e){} flush(); }
  var flushing=false;
  function flush(){ if(!sb||flushing||!outbox.length) return; flushing=true;
    var item=outbox[0]; var t=TABLE[item.col]; var row=Object.assign({},item.row);
    if(item.col==='activity'){ delete row.id; }            // identity column server-side
    var q= item.col==='settings' ? sb.from(t).upsert({key:row.key,value:row.value},{onConflict:'key'})
         : item.col==='work_types' ? sb.from(t).upsert(row,{onConflict:'key'})
         : sb.from(t).upsert(row,{onConflict:'id'});
    q.then(function(res){ if(res&&res.error){ console.warn('club sync',res.error); flushing=false; return; }
      outbox.shift(); try{ localStorage.setItem(OUTBOX,JSON.stringify(outbox)); }catch(e){} flushing=false; flush(); })
     .catch(function(err){ console.warn('club sync',err); flushing=false; });
  }
  function enable(client){ sb=client; try{ localStorage.setItem(MODE,'supabase'); }catch(e){}
    // initial pull: server rows merge over local by id; local-only rows are then pushed
    var cols=Object.keys(TABLE);
    return Promise.all(cols.map(function(c){ return sb.from(TABLE[c]).select('*').then(function(res){ return {c:c,rows:(res&&res.data)||[]}; }); }))
      .then(function(parts){
        parts.forEach(function(p){
          if(p.c==='settings'){ p.rows.forEach(function(r){ S.settings[r.key]=r.value; }); return; }
          var byId={}; S[p.c].forEach(function(r){ byId[r.id||r.key]=r; });
          p.rows.forEach(function(r){ byId[r.id||r.key]=r; });
          S[p.c]=Object.keys(byId).map(function(k){return byId[k];});
        });
        save(); flush();
      });
  }
  function disable(){ sb=null; try{ localStorage.setItem(MODE,'local'); }catch(e){} }

  /* ── this month, both sides: read straight from the two trackers' stores (same origin) ── */
  function monthBoth(){
    var now=new Date(), ws=new Date(now.getFullYear(),now.getMonth(),1).getTime(), me=new Date(now.getFullYear(),now.getMonth()+1,1).getTime();
    var inM=function(t){ t=(typeof t==='number')?t:(t?new Date(t).getTime():0); return isFinite(t)&&t>=ws&&t<me; };
    var out={ub:null,pl:null};
    try{ var ub=JSON.parse(localStorage.getItem('ub_tracker_v1')||'null'); if(ub){
      var mins=(ub.sessionLog||[]).filter(function(x){return inM(x.date) && wtCounts(x.type);}).reduce(function(a,x){return a+(x.mins||0);},0);
      if(ub.session&&ub.session.start>=ws) mins+=Math.max(0,Math.round((Date.now()-ub.session.start)/60000));
      var kh=((ub.settings&&ub.settings.kpis)||[]).filter(function(k){return k.id==='hours';})[0]; var ev=ub.events||[];
      out.ub={hrs:mins/60, tgt:(kh&&kh.target)||32, active:(ub.pipeline||[]).length,
        moved:ev.filter(function(e){return e.type==='stage'&&inM(e.at);}).length,
        launched:ev.filter(function(e){return e.type==='launches'&&inM(e.at);}).length}; } }catch(e){}
    try{ var pl=JSON.parse(localStorage.getItem('pl_sourcing_v1')||'null'); if(pl){
      var B=(pl.brand_state&&pl.brand_state[0]&&pl.brand_state[0].data)||{};
      var m2=(B.plSess||[]).filter(function(x){return inM(x.at) && wtCounts(x.kind);}).reduce(function(a,x){return a+(x.mins||0);},0);
      if(B.plRun&&B.plRun.start>=ws) m2+=Math.max(0,Math.round((Date.now()-B.plRun.start)/60000));
      var moved=0,launched=0,active=0;
      (pl.ideas||[]).forEach(function(r){ var i=r.data||{}, p=i.pipeline||{}; if(p.launchedAt&&inM(p.launchedAt)) launched++;
        if(!i.inPipeline||p.status==='rejected'||p.status==='launched') return; active++;
        if((p.history||[]).some(function(x){return inM(x.ts)&&(x.type==='advance'||x.type==='launch');})) moved++; });
      out.pl={hrs:m2/60, tgt:(typeof B.plMonthlyHours==='number'?B.plMonthlyHours:(typeof B.plWeeklyHours==='number'?Math.round(B.plWeeklyHours*52/12):87)), active:active, moved:moved, launched:launched}; } }catch(e){}
    return out;
  }
  function railMonthHtml(){
    var m=monthBoth(); var fh=function(h){ return h>=10?Math.round(h)+'h':(Math.round(h*10)/10)+'h'; };
    var row=function(d,who,app,col){
      if(!d) return '<div class="snm-row off"><i style="--av:'+col+'">'+who[0]+'</i><b>'+who+'</b><span>'+app+'</span><em>not opened</em></div>';
      var pct=d.tgt>0?Math.min(100,Math.round(d.hrs/d.tgt*100)):0;
      return '<div class="snm-row"><i style="--av:'+col+'">'+who[0]+'</i><b>'+who+'</b><span>'+app+'</span><em>'+fh(d.hrs)+' <u>/ '+fh(d.tgt)+'</u></em></div><div class="snm-bar" style="--c:'+col+'"><s style="width:'+pct+'%"></s></div>'; };
    var n=function(k){ return ((m.ub&&m.ub[k])||0)+((m.pl&&m.pl[k])||0); };
    return '<div class="snm-h">This month<span>both sides</span></div>'+row(m.ub,'Becki','UB','#00E5A0')+row(m.pl,'Jack','PL','#A78BFF')
      +'<div class="snm-foot"><b>'+n('active')+'</b> active · <b>'+n('moved')+'</b> moved · <b>'+n('launched')+'</b> launched</div>';
  }

  return { mode:mode, user:user, users:users, setWho:setWho, signOut:signOut, nameOf:nameOf, byId:byId,
    log:log, activityBetween:activityBetween, summarise:summarise,
    workTypes:workTypes, wtKey:wtKey, wtLabel:wtLabel, wtHint:wtHint, wtCounts:wtCounts, saveWorkTypes:saveWorkTypes,
    sessionStart:sessionStart, sessionEnd:sessionEnd, sessionQuick:sessionQuick, sessionsFor:sessionsFor,
    taskAdd:taskAdd, taskStatus:taskStatus, taskNote:taskNote, tasksFor:tasksFor, taskNotes:taskNotes,
    setting:setting, all:all, add:add, update:update, on:on, reload:function(){ load(); notify(); },
    sync:{ enable:enable, disable:disable, flush:flush, pending:function(){ return outbox.length; } },
    monthBoth:monthBoth, railMonthHtml:railMonthHtml,
    _dump:function(){ return JSON.parse(JSON.stringify(S)); } };
})();

</script>
<script>
// BUILD is the version people see — moves by 0.05 a release; STAMP is what actually busts the cache. Bump STAMP every push.
var BUILD = '1.00';
var STAMP = '2026-10-23a';
document.getElementById('buildChip').textContent = 'v' + BUILD;

var FRAMES = { ub: document.getElementById('f_ub'), pl: document.getElementById('f_pl') };
var SRC = { ub: 'ub.html', pl: 'pl.html' };
var TAB_KEY = 'ubpl_shell_tab';

function ensureLoaded(app){
  var f = FRAMES[app]; if(!f) return;
  if (!f.getAttribute('src')){ f.onload=function(){ try{ stampVersion(f.contentDocument); f.contentDocument.body.classList.add('plub-embed'); chromeSync(true); }catch(e){} }; f.src = SRC[app] + '?v=' + encodeURIComponent(BUILD + '-' + STAMP); }
}
// the two apps carry a hard-coded version string in their own bar and rail — the shell is the only thing that knows the real build
function stampVersion(doc){ try{ doc.querySelectorAll('[data-ver]').forEach(function(e){ e.textContent='v'+BUILD; }); }catch(e){} }
var _onScreen=null;
function show(app){
  if (app!=='pipe' && !FRAMES[app]) app = 'ub';
  if (app!=='pipe') ensureLoaded(app);
  var pipeEl=document.getElementById('pipe');
  var target = app==='pipe' ? pipeEl : FRAMES[app];
  Object.keys(FRAMES).forEach(function(k){ FRAMES[k].classList.toggle('show', k === app); FRAMES[k].classList.remove('leaving'); });
  pipeEl.classList.toggle('show', app==='pipe'); pipeEl.classList.remove('leaving');
  _onScreen = target;
  document.body.classList.toggle('nobar', app!=='pipe');
  try{ chromeSync(true); }catch(e){}
  // keep the in-app pills' active state honest
  Object.keys(FRAMES).forEach(function(k){ try{
    var xd=FRAMES[k].contentDocument, btns=xd?xd.querySelectorAll('#xtabs .xt'):[];
    if(btns.length===3){ btns[0].classList.toggle('on',app==='ub'); btns[1].classList.toggle('on',app==='pl'); btns[2].classList.toggle('on',app==='pipe'); }
    stampVersion(xd);
  }catch(e){} });
  document.querySelectorAll('.tab').forEach(function(t){ t.classList.toggle('on', t.dataset.app === app); });
  try { localStorage.setItem(TAB_KEY, app); } catch(e){}
  if (app==='pipe') renderPipe();
  else setTimeout(function(){ try { FRAMES[app].contentWindow.focus(); } catch(e){} }, 60);
}
document.getElementById('tabs').addEventListener('click', function(e){ var b = e.target.closest('.tab'); if (b) show(b.dataset.app); });

/* ══════════ merged pipeline: both apps' stores → one board ══════════ */
var COLS = [
  {key:'sourcing',   name:'Sourcing'},
  {key:'validating', name:'Validating'},
  {key:'samples',    name:'Samples'},
  {key:'ordered',    name:'Ordered / stock'},

        +'<circle cx="32" cy="32" r="'+R+'" fill="none" stroke="'+col+'" stroke-width="7" stroke-linecap="round" stroke-dasharray="'+C.toFixed(1)+'" stroke-dashoffset="'+(C*(1-pL)).toFixed(1)+'" transform="rotate(-90 32 32)"/>'

function ovNext(c){
  if(c.over)  return {p:'HIGH',  t:'Past its '+c.stage+' target — '+c.days+' days in', b:'Work now'};
  if(c.waitExpired) return {p:'HIGH', t:'Waiting date has passed — chase it', b:'Chase it'};
  if(c.wait)  return {p:'LOW',  t:'Waiting on somebody else — nothing to do', b:'View'};

}

    .map(function(c){ var n=ovNext(c); return {c:c,n:n}; })
    .sort(function(a,b){ return rank[a.n.p]-rank[b.n.p] || (b.c.days||0)-(a.c.days||0); });

function renderOverview(ub, pl, m, cards){

  var hrs=sides.reduce(function(a,d){return a+d.hrs;},0);

  var exp=tgt*weekFrac();

  else { tone='ok'; head= sides.length>1 ? 'Both belts are moving.' : 'The belt is moving.';

  /* four quiet stats with small icon tiles — not six glowing rainbow cards */

  /* targets, both sides, one card */

      +'<u style="left:'+(monthPace()*100).toFixed(0)+'%"></u></div>'

      +bar('Sourcing hours', Math.round(hrs*10)/10, Math.round(tgt*10)/10, '#A78BFF')

      +bar('Moved forward', moved+launched, 0, '#00E5A0')
      +bar('Launched', launched, m.lTgt||3, '#22D3EE')

  /* the ranked queue — what to actually do next, across both belts */
  var rows=q.slice(0,8).map(function(x){
    var c=x.c, n=x.n;
    return '<tr onclick="ovOpen(\''+c.app+'\','+JSON.stringify(String(c.id||'')).replace(/"/g,'&quot;')+')">'
      +'<td><span class="ov-p '+n.p.toLowerCase()+'">'+n.p+'</span></td>'
      +'<td><span class="ov-prod">'+ovAvatar(c.title,'sm')
        +'<b>'+esc(c.title)+'</b><span class="ov-app '+c.app+'">'+(c.app==='ub'?'UB':'PL')+'</span></span></td>'
      +'<td><span class="ov-stage">'+esc(c.stage)+'</span></td>'
      +'<td class="ov-na">'+esc(n.t)+'</td>'
      +'<td class="ov-age">'+(c.days!=null?c.days+'d':'—')+'</td>'
      +'<td><button class="ov-go">'+n.b+' →</button></td></tr>';
  }).join('');
  var queue='<section class="ov-card"><div class="ov-card-h"><h3>Priority queue</h3>'
    +'<span class="ov-card-s">'+q.length+' active across both belts · worst first</span></div>'
    +(rows?'<div class="ov-tw"><table class="ov-tbl"><thead><tr><th>Priority</th><th>Product</th><th>Stage</th><th>Next action</th><th>Age</th><th></th></tr></thead><tbody>'
      +rows+'</tbody></table></div>'
      +(q.length>8?'<div class="ov-more">'+(q.length-8)+' more not shown</div>':'')
      :'<div class="ov-blank">Nothing in either pipeline yet.</div>')

      +'<div class="ov-lane-h"><span class="ov-app '+d.app+'">'+(d.app==='ub'?'UB':'PL')+'</span>'
        +'<b>'+d.label+'</b><span class="ov-lane-s">'+d.who+' · '+d.active+' active</span>'

function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }

function paintPipeN(){ var n=document.getElementById('pipeN'); if(!n) return; var a=activeCount(); n.textContent=a; n.classList.toggle('show',a>0); }

  var ubN = cards.filter(function(c){return c.app==='ub' && c.col!=='launched';}).length, plN = cards.filter(function(c){return c.app==='pl' && c.col!=='launched';}).length;

  var oldest = function(rows){ var d=rows.map(function(r){return r.days||0;}); return d.length?Math.max.apply(null,d):0; };
  var template = COLS.map(function(c){ return byCol[c.key].length ? 'minmax(210px,1fr)' : '46px'; }).join(' ');

<script id="plub-data">
/* ═══════ EXPORT / IMPORT EVERYTHING ═══════
   One file holds every PLUB key on this laptop, byte for byte: both trackers, shared tasks/sessions, settings, drafts.
   Format 'plub-full-export' v1 — the online version imports this same file, so a key's raw value must never be
   reshaped on the way out. Other BDL apps share this browser storage; only PLUB's own keys are ever read or written. */
var PD_KEYS=['plub_v1','plub_who','plub_mode','plub_outbox_v1','ubpl_shell_tab','plub_rail_min','plub_ov_view','plub_ov_filter',
  'ub_tracker_v1','ub_sb_min','ub_last_report','ub_last_backup','pl_sourcing_v1','pls_theme','pls_draft','pl_sb_min'];
var PD_DYNAMIC=/^(ub_tracker_v1__|pl_sourcing_v1_quarantine_)/;   // UB's undo/pre-import copies, PL's quarantined stores
var PD_KEEP=['plub_who'];                                           // who is using this laptop is not data — an import never changes it
var PD_LAST='plub_last_full_export';
var _pdPending=null;

function pdKeys(){
  var out=PD_KEYS.slice();
  try{ for(var i=0;i<localStorage.length;i++){ var k=localStorage.key(i); if(k&&PD_DYNAMIC.test(k)&&out.indexOf(k)<0) out.push(k); } }catch(e){}
  return out;
}
function pdOwns(k){ return PD_KEYS.indexOf(k)>=0 || PD_DYNAMIC.test(k); }
function pdRead(){ var o={}; pdKeys().forEach(function(k){ try{ var v=localStorage.getItem(k); if(v!=null) o[k]=v; }catch(e){} }); return o; }
function pdParse(s){ try{ return JSON.parse(s); }catch(e){ return null; } }
var _pdLastMem=null;   // if the shared browser storage is full the note can't be written — the page must still know the export happened
function pdLast(){ var r=null; try{ r=pdParse(localStorage.getItem(PD_LAST)||'null'); }catch(e){} return r||_pdLastMem; }
function pdCounts(keys){
  var ub=pdParse(keys.ub_tracker_v1||'null')||{}, pl=pdParse(keys.pl_sourcing_v1||'null')||{}, sh=pdParse(keys.plub_v1||'null')||{};
  var bs=((pl.brand_state||[])[0]||{}).data||{};
  function n(a){ return Array.isArray(a)?a.length:0; }
  var pli=Array.isArray(pl.ideas)?pl.ideas:[];
  return {
    ub_ideas:n(ub.ideas), ub_pipeline:n(ub.pipeline), ub_tasks:n(ub.tasks), ub_inbox:n(ub.inbox), ub_vendors:n(ub.vendors),
    ub_storefronts:n(ub.storefronts), ub_sessions:n(ub.sessionLog), ub_archive:n(ub.archive),
    pl_ideas:pli.length, pl_pipeline:pli.filter(function(r){ return r&&r.in_pipeline; }).length, pl_vendors:n(bs.vendors),
    pl_sessions:n(bs.plSess), pl_week_tasks:n(bs.weekTasks),
    sh_tasks:n(sh.tasks), sh_sessions:n(sh.sessions), sh_notes:n(sh.task_notes), sh_activity:n(sh.activity)

}
var PD_ROWS=[
  ['Unique Bundles',[['ub_ideas','Ideas'],['ub_pipeline','In the pipeline'],['ub_tasks','Tasks'],['ub_inbox','Review queue'],['ub_vendors','Suppliers'],['ub_storefronts','Storefronts'],['ub_sessions','Sessions'],['ub_archive','Archived']]],
  ['Private Label',[['pl_ideas','Ideas'],['pl_pipeline','In the pipeline'],['pl_vendors','Suppliers'],['pl_sessions','Sessions'],['pl_week_tasks','Week plan tasks']]],
  ['Shared',[['sh_tasks','Tasks'],['sh_notes','Task notes'],['sh_sessions','Sessions'],['sh_activity','Activity log']]]
];
function pdHash(keys){
  var s=Object.keys(keys).sort().map(function(k){ return k+'\u0000'+keys[k]; }).join('\u0001');
  try{ if(window.crypto&&crypto.subtle&&window.TextEncoder) return crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)).then(function(b){
    return Array.prototype.map.call(new Uint8Array(b),function(x){ return ('0'+x.toString(16)).slice(-2); }).join(''); }); }catch(e){}
  return Promise.resolve('');
}
function pdFlush(){
  // both apps save on a short timer — push anything still waiting into storage before it is read
  try{ var w=frameWin('ub'); if(w) new w.Function('try{flushSave()}catch(e){}')(); }catch(e){}
  try{ var p=frameWin('pl'); if(p) new p.Function('try{_flushPendingSave()}catch(e){}')(); }catch(e){}
}
function pdP(n){ return (n<10?'0':'')+n; }
function pdStamp(d){ return d.getFullYear()+'-'+pdP(d.getMonth()+1)+'-'+pdP(d.getDate())+' '+pdP(d.getHours())+'.'+pdP(d.getMinutes()); }
function pdWhen(iso){
  var d=new Date(iso); if(isNaN(d)) return '';
  var t=pdP(d.getHours())+':'+pdP(d.getMinutes()), today=new Date(); today.setHours(0,0,0,0);
  var day=new Date(d); day.setHours(0,0,0,0); var diff=Math.round((today-day)/864e5);
  if(diff===0) return 'today '+t; if(diff===1) return 'yesterday '+t;

}
function pdSize(n){ return n>1048576?(n/1048576).toFixed(1)+' MB':Math.max(1,Math.round(n/1024))+' KB'; }
function pdFileObj(keys,h,extra){
  var u=CLUB.user();

    exported_by:u?u.display_name:'?',exported_by_id:u?u.id:'',key_count:Object.keys(keys).length,counts:pdCounts(keys),sha256:h,keys:keys};
  if(extra) Object.keys(extra).forEach(function(k){ f[k]=extra[k]; });

  if(window.__plubPre&&!f.safety_copy) f.before_update={note:'Every PLUB key exactly as the previous version left it, captured on the first load of v'+BUILD+' before anything updated it',

function pdExport(quiet){

        if(quiet){ pdClose(); golRender(); return; }
        pdSet(pdHead('Exported ✓')
          +'<div class="pd-ok"><b>'+esc(name)+'</b><span>'+pdSize(text.length)+' · in your Downloads folder</span></div>'
          +'<ul class="pd-checks"><li>Read straight back and checked — every byte matches this laptop</li><li>'+file.key_count+' saved parts from both apps</li>'+(file.before_update?'<li>Also holds an untouched copy from before this update</li>':'')+'</ul>'
          +'<div class="pd-lab">What is in the file</div>'+pdCountsHtml(file.counts)
          +'<p class="pd-tip">Keep it safe: drag a copy into Google Drive, or email it to yourself. If anything ever goes wrong, <b>Import everything</b> puts it all back.</p>'
          +'<div class="pd-foot"><button class="pd-btn pd-ghost" onclick="pdPick()">Import a file instead…</button><span style="flex:1"></span><button class="pd-btn pd-pri" onclick="pdClose()">Done</button></div>');
      });
    }).catch(function(e){ pdShowError('The export did not finish ('+esc(String(e&&e.message||e))+'). Nothing was changed — try again.'); });
  },700);
}

/* ── import ── */
function pdPick(){ pdBox(); var i=document.getElementById('pdFile'); i.value=''; i.click(); }
function pdFileChosen(inp){
  var f=inp.files&&inp.files[0]; if(!f) return;
  pdBusy('Checking the file…');
  var r=new FileReader();
  r.onload=function(){ pdCheckFile(String(r.result||''),f.name); };
  r.onerror=function(){ pdShowError('That file could not be opened.'); };
  r.readAsText(f);
}
function pdCheckFile(text,fname){
  var file=pdParse(text);
  if(!file||typeof file!=='object') return pdShowError('<b>'+esc(fname)+'</b> is not a PLUB export — it could not be read.');
  if(file.app==='bdl-ub') return pdShowError('<b>'+esc(fname)+'</b> is a Unique Bundles-only backup. Put it back from Unique Bundles → Settings → Import backup.');
  if(file.format!=='plub-full-export'||!file.keys||typeof file.keys!=='object') return pdShowError('<b>'+esc(fname)+'</b> is not an “Export everything” file from PLUB.');
  if((file.format_version||1)>1) return pdShowError('This file was made by a newer PLUB (v'+esc(file.build)+'). Reload this page to update it first.');
  pdHash(file.keys).then(function(h){
    if(file.sha256&&h&&h!==file.sha256) return pdShowError('<b>'+esc(fname)+'</b> has been changed or damaged since it was exported, so it was not used.');
    _pdPending=file; pdCompare(file,fname);
  });
}
function pdCompare(file,fname){
  pdFlush();
  var now=pdCounts(pdRead()), fc=pdCounts(file.keys), u=CLUB.user(), lose=0;
  var rows=PD_ROWS.map(function(g){
    var shown=g[1].filter(function(r){ return fc[r[0]]||now[r[0]]; });   // a row that is 0 on both sides says nothing
    return '<tr class="pd-tg"><td colspan="3">'+g[0]+'</td></tr>'+(shown.length?shown.map(function(r){
      var a=fc[r[0]], b=now[r[0]], cls=a<b?' class="pd-less"':'';
      if(a<b&&r[0]!=='sh_activity') lose++;
      return '<tr'+cls+'><td>'+r[1]+'</td><td>'+a+'</td><td>'+b+(a<b?' <em>−'+(b-a)+'</em>':a>b?' <u>+'+(a-b)+' back</u>':'')+'</td></tr>';
    }).join(''):'<tr><td colspan="3" class="pd-nil">Nothing on either side</td></tr>');
  }).join('');
  var warn='', other=!!(u&&file.exported_by_id&&file.exported_by_id!==u.id);
  if(other) warn+='<div class="pd-warn">This file is <b>'+esc(file.exported_by)+'’s</b>. Importing it <b>replaces</b> everything <b>'+esc(u.display_name)+'</b> has on this laptop — it does not add to it. To combine two people’s work, wait for the online version.</div>';
  if(lose) warn+='<div class="pd-warn">This laptop has more in '+lose+' place'+(lose>1?'s':'')+' than the file (marked below). Those would be replaced — the safety copy keeps them.</div>';
  pdSet(pdHead('Import everything?','<b>'+esc(fname)+'</b><br>Exported '+esc(pdWhen(file.exported_at))+' by '+esc(file.exported_by)+' · PLUB v'+esc(file.build)+' · checked, undamaged')
    +warn
    +'<table class="pd-tbl"><thead><tr><th></th><th>In the file</th><th>On this laptop now</th></tr></thead><tbody>'+rows+'</tbody></table>'
    +'<ol class="pd-steps"><li>A safety copy of this laptop downloads first</li><li>Everything is replaced with the file, exactly as it was</li><li>The page reloads and every count is checked against the file</li></ol>'
    +'<p class="pd-tip">Close PLUB in any other tab first, or that tab can save its old copy back over this.</p>'
    +'<div class="pd-foot"><button class="pd-btn" onclick="pdOpen()">Cancel</button><button class="pd-btn pd-pri'+(other?' pd-danger':'')+'" onclick="pdReplace()">'+(other?'Replace '+esc(u.display_name)+'’s data with '+esc(file.exported_by)+'’s':'Replace everything with this file')+'</button></div>');
}
function pdPark(){
  // empty both app frames first: each saves on its way out, and that save must land BEFORE the file is written, never after
  return new Promise(function(done){
    var n=0, fin=false; function end(){ if(!fin){ fin=true; done(); } }
    ['ub','pl'].forEach(function(a){ var f=FRAMES[a]; if(f&&f.getAttribute('src')){ n++; f.onload=function(){ if(--n<=0) end(); }; f.src='about:blank'; } });
    if(!n) end(); setTimeout(end,3000);
  });
}
function pdWrite(keys,before){
  var put=Object.keys(keys).filter(function(k){ return pdOwns(k)&&PD_KEEP.indexOf(k)<0; });
  try{
    // clear PLUB's own keys first so the space the old copies held is free for the file's
    pdKeys().forEach(function(k){ if(PD_KEEP.indexOf(k)<0) localStorage.removeItem(k); });
    put.forEach(function(k){ localStorage.setItem(k,keys[k]); });
    var bad=put.filter(function(k){ return localStorage.getItem(k)!==keys[k]; });
    if(bad.length) throw new Error('did not read back: '+bad.join(', '));
    return {ok:true,n:put.length};
  }catch(e){
    // put the laptop back exactly as it was before — each key on its own, so one failure can't stop the rest
    var stuck=[];
    pdKeys().forEach(function(k){ if(PD_KEEP.indexOf(k)<0){ try{ localStorage.removeItem(k); }catch(_e){} } });
    Object.keys(before).forEach(function(k){ if(PD_KEEP.indexOf(k)<0){ try{ localStorage.setItem(k,before[k]); }catch(_e){ stuck.push(k); } } });
    return {ok:false,err:e,stuck:stuck};
  }
}
function pdReplace(){
  var file=_pdPending; if(!file) return;
  pdBusy('Saving a safety copy of this laptop first…');
  pdFlush();
  setTimeout(function(){
    var before=pdRead(), has=!!(before.ub_tracker_v1||before.pl_sourcing_v1||before.plub_v1);
    (has?pdHash(before).then(function(h){
      pdDownload(JSON.stringify(pdFileObj(before,h,{safety_copy:true})),'PLUB safety copy before import - '+pdStamp(new Date())+'.json');
    }):Promise.resolve()).then(function(){
      pdBusy('Putting everything back…');
      return pdPark();
    }).then(function(){
      before=pdRead();   // re-read after the apps' last saves, so a failed write rolls back to the truth
      var res=pdWrite(file.keys,before);
      if(!res.ok){
        var full=/quota/i.test(String(res.err&&res.err.name||''))||/quota/i.test(String(res.err&&res.err.message||''));
        ensureLoaded('ub'); ensureLoaded('pl');
        var tail=res.stuck&&res.stuck.length?' This laptop could not be put fully back — choose <b>Import everything</b> again and pick the <b>safety copy</b> that just downloaded.':' This laptop is exactly as it was.';
        return pdShowError((full?'This browser’s storage is full (every BDL web app shares it), so the file did not fit.':'The import did not finish ('+esc(String(res.err&&res.err.message||res.err))+').')+tail);
      }
      try{ sessionStorage.setItem('plub_import_check',JSON.stringify({counts:pdCounts(file.keys),who:file.exported_by,at:file.exported_at,n:res.n})); }catch(e){}
      location.reload();
    });
  },700);
}
(function pdAfterImport(){
  var chk=null; try{ chk=pdParse(sessionStorage.getItem('plub_import_check')||'null'); sessionStorage.removeItem('plub_import_check'); }catch(e){}
  if(!chk) return;
  setTimeout(function(){
    var now=pdCounts(pdRead());
    var off=[]; PD_ROWS.forEach(function(g){ g[1].forEach(function(r){ if(r[0]!=='sh_activity'&&chk.counts[r[0]]!==now[r[0]]) off.push(g[0]+' '+r[1].toLowerCase()+': file '+chk.counts[r[0]]+', now '+now[r[0]]); }); });
    pdSet(pdHead(off.length?'Imported — please check':'Imported ✓')
      +(off.length?'<div class="pd-warn">These counts are different from the file:<br>'+off.map(esc).join('<br>')+'</div>'
        :'<div class="pd-ok"><b>Everything is back</b><span>'+esc(chk.who)+'’s file from '+esc(pdWhen(chk.at))+' · '+chk.n+' saved parts · every count matches</span></div>')
      +'<div class="pd-lab">On this laptop now</div>'+pdCountsHtml(now)
      +'<div class="pd-foot"><button class="pd-btn pd-pri" onclick="pdClose()">Done</button></div>');
  },2500);
})();

/* ═══════ BEFORE WE GO ONLINE — the to-do page v1.00 opens on ═══════
   Each laptop is walked through: export everything → send it to Jack / keep it safe → carry on.
   Its own key, never exported or imported: it describes this laptop, not the business. */
var GOL_KEY='plub_golive_v1';
var _golMem=null;
function golState(){ var st=null; try{ st=pdParse(localStorage.getItem(GOL_KEY)||'null'); }catch(e){} return st||_golMem||{}; }
function golSave(st){ _golMem=st; try{ localStorage.setItem(GOL_KEY,JSON.stringify(st)); }catch(e){} }
function golTotal(c){ c=c||{}; return ['ub_ideas','ub_pipeline','ub_tasks','ub_inbox','ub_vendors','pl_ideas','pl_vendors','pl_week_tasks','sh_tasks'].reduce(function(a,k){ return a+(c[k]||0); },0); }
function golIsJack(){ var u=CLUB.user(); return !!(u&&u.role==='owner'); }
function golRail(){ pdExport(); }   // one click from anywhere — the to-do page still opens by itself until it's finished
function golOpen(){
  var g=document.getElementById('golive');
  if(!g){ g=document.createElement('div'); g.id='golive'; g.className='gol'; document.body.appendChild(g); }
  g.classList.add('show'); golRender();
}
function golClose(later){ var g=document.getElementById('golive'); if(g) g.classList.remove('show'); if(later){ try{ sessionStorage.setItem('plub_golive_later','1'); }catch(e){} } }
function golSent(){ var st=golState(); st.sent=new Date().toISOString(); golSave(st); golRender(); }
function golFinish(){ var st=golState(); st.done=new Date().toISOString(); golSave(st); golClose(); chromeSync(true); }
function golCopy(name){
  var ok=function(){ var b=document.getElementById('golCopyBtn'); if(b){ b.textContent='Copied ✓'; setTimeout(function(){ if(b) b.textContent='Copy the file name'; },1800); } };
  try{ navigator.clipboard.writeText(name).then(ok,function(){}); }catch(e){}
}
function golRender(){
  var g=document.getElementById('golive'); if(!g||!g.classList.contains('show')) return;
  var u=CLUB.user(), nm=u?u.display_name:'', jack=golIsJack(), st=golState(), r=pdLast();
  var exported=!!r, sent=!!st.sent, all=exported&&sent;
  function step(n,state,title,body){
    return '<div class="gol-step '+state+'"><div class="gol-n">'+(state==='done'?'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 8.5l3 3 6-7"/></svg>':n)+'</div>'
      +'<div class="gol-sb"><h4>'+title+'</h4>'+body+'</div></div>';
  }
  var s1 = exported
    ? '<div class="gol-file"><b>'+esc(r.name||'PLUB everything')+'</b><span>'+pdSize(r.bytes||0)+' · saved '+esc(pdWhen(r.at))+' · in your <b>Downloads</b> folder</span></div>'
      +'<p class="gol-ok">✓ Checked — it reads back perfectly and holds everything on this laptop'+(r.pre?'<br>✓ Also holds an untouched copy from before this update':'')+'</p>'
      +(r.counts?(golTotal(r.counts)
        ?'<div class="gol-in"><div class="gol-in-h">What’s in the file — does this look like your work?</div>'+pdCountsHtml(r.counts)+'</div>'
        :'<div class="gol-empty"><b>This file is empty</b> — PLUB on this laptop has nothing saved. Tell Jack before going any further.</div>'):'')
      +'<button class="gol-link" onclick="pdExport(true)">Export again</button>'
    : '<p>One file with every idea, product, task, supplier and session from <b>both</b> Unique Bundles and Private Label. Nothing on this laptop changes.</p>'
      +'<button class="gol-big" onclick="pdExport(true)"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3.5v9M6 9l4 4 4-4"/><path d="M3.5 14v2.5h13V14"/></svg>Export everything</button>';
  var s2 = jack
    ? (sent?'<p class="gol-ok">✓ Done</p>'
        :'<p>Drag the file into Google Drive, or email it to yourself, so it lives somewhere other than this laptop. Becki will send you hers — <b>keep it, don’t import it</b>: importing replaces your own data. Both files get combined when we go online.</p>'
         +(exported?'<div class="gol-row">'+(r&&r.name?'<button class="gol-sec" id="golCopyBtn" onclick="golCopy('+esc(JSON.stringify(r.name))+')">Copy the file name</button>':'')+'<button class="gol-go" onclick="golSent()">✓ It’s saved somewhere safe</button></div>':''))
    : (sent?'<p class="gol-ok">✓ Sent to Jack</p>'
        :'<p>Open your <b>Downloads</b> folder, find the file above and send it to <b>Jack</b> on WhatsApp or email.</p>'
         +(exported?'<div class="gol-row">'+(r&&r.name?'<button class="gol-sec" id="golCopyBtn" onclick="golCopy('+esc(JSON.stringify(r.name))+')">Copy the file name</button>':'')+'<button class="gol-go" onclick="golSent()">✓ I’ve sent it to Jack</button></div>':''));
  var s3 = '<p>Keep using PLUB exactly as normal until '+(jack?'the online version is switched on':'Jack says the online version is ready')+'. Don’t import anything unless '+(jack?'you mean to':'Jack asks you to')+'.</p>'
    +(all?'<button class="gol-big" onclick="golFinish()">All done — open PLUB</button>':'');
  g.innerHTML='<div class="gol-wrap">'
    +'<div class="gol-top"><div class="gol-mark">P</div><b>PLUB</b><span>v'+BUILD+'</span></div>'
    +'<div class="gol-tag">'+(all?'All done':'One job · about 1 minute')+'</div>'
    +(all?'<h2>Thanks'+(nm?' '+esc(nm):'')+' — all done</h2><p class="gol-lead">Everything on this laptop is saved in a file'+(jack?' and kept safe':' and Jack has it')+'. Carry on exactly as normal — nothing else to do until the online version is switched on.</p>'
      :'<h2>'+(nm?esc(nm)+', before we':'Before we')+' go online</h2>'
      +'<p class="gol-lead">PLUB is moving to the cloud so '+(jack?'you and Becki':'you and Jack')+' see the same pipeline, live. First, save a copy of everything on this laptop so nothing can be lost on the way.</p>')
    +'<div class="gol-steps">'
    +step(1,exported?'done':'now','Export everything',s1)
    +step(2,sent?'done':(exported?'now':'wait'),jack?'Keep the file safe':'Send the file to Jack',s2)
    +step(3,all?'now':'wait','Carry on as normal',s3)
    +'</div>'
    +'<div class="gol-foot">'+(all?'':'<button class="gol-later" onclick="golClose(true)">Not now — remind me next time</button>')
    +'<button class="gol-later" onclick="golClose();pdOpen()">Need to put a file back? Import…</button></div>'
    +'</div>';
}
function golMaybe(){
  var later=null; try{ later=sessionStorage.getItem('plub_golive_later'); }catch(e){}
  if(CLUB.user() && !golState().done && !later) golOpen();
}
// open on the to-do page: straight away if someone is already picked, or right after the who-are-you screen
(function(){ var cb=clubBoot; clubBoot=function(){ cb.apply(this,arguments); setTimeout(golMaybe,300); }; if(CLUB.user()) setTimeout(golMaybe,300); })();

<!-- plub-design-system --><style>
/* ══════════════════════════════════════════════════════════════════════
   PLUB DESIGN SYSTEM — one copy, byte-identical in ub.html, pl.html and
   index.html. If a value needs to change it changes HERE, in all three.
   ══════════════════════════════════════════════════════════════════════ */
:root,[data-theme="dark"],[data-theme="light"]{
  /* ground + surfaces */
  --bg:#030304!important; --surface:#0A0A0C!important;
  --s1:#0A0A0C!important; --s2:#0F0F12!important; --s3:#17171B!important; --s4:#1E1E24!important;
  --sidebar:#050507!important;
  /* lines */
  --b1:#1E1E24!important; --b2:#2A2A31!important; --b3:#3A3A43!important;
  /* type — t4 is the quiet one; PL used to run it 12% brighter than UB */
  --t1:#F5F5F8!important; --t2:#C6C7D0!important; --t3:#9698A4!important; --t4:#787A87!important;
  /* accents */
  --brand:#A78BFF!important; --brand-d:#171425!important; --brand-t:#C4B2FF!important;
  --brand-b:rgba(167,139,255,.45)!important; --brand-h:#B9A3FF!important;
  --accent:#A78BFF!important; --accent2:#22D3EE!important;
  --green:#00E5A0!important; --gd:rgba(0,229,160,.14)!important; --gt:#5FFFC8!important; --gb:rgba(0,229,160,.45)!important;
  --amber:#FFC53D!important; --ad:rgba(255,197,61,.14)!important; --at:#FFDC85!important; --ab:rgba(255,197,61,.45)!important;
  --red:#FF5470!important;   --rd:rgba(255,84,112,.14)!important; --rt:#FF8FA3!important; --rb:rgba(255,84,112,.46)!important;
  --blue:#3B9EFF!important;  --bd:rgba(59,158,255,.14)!important; --bt:#8CC8FF!important; --bb:rgba(59,158,255,.45)!important;
  --purple:#A78BFF!important;--pd:rgba(167,139,255,.14)!important;--pt:#C4B2FF!important;--pb:rgba(167,139,255,.45)!important;
  --cyan:#22D3EE!important;  --cd:rgba(34,211,238,.14)!important; --cb:rgba(34,211,238,.45)!important;
  --orange:#FF8A3D!important;--od:rgba(255,138,61,.14)!important; --ob:rgba(255,138,61,.45)!important;
  --pink:#FF5CC8!important;  --pkd:rgba(255,92,200,.14)!important;--pkb:rgba(255,92,200,.45)!important;
  /* type stack */
  --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif!important;
  --mono:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif!important;
  /* ONE radius scale */
  --r-sm:10px!important; --r-md:12px!important; --r-lg:14px!important; --r-xl:16px!important;
  /* ONE depth scale — PL had none, so its cards sat flat against the page */
  --sh-card:0 8px 24px rgba(0,0,0,.24)!important;
  --sh-hover:0 14px 32px rgba(0,0,0,.40)!important;
  --glow:0 0 0 3px rgba(124,92,255,.18)!important;
  /* motion */
  --ease:cubic-bezier(.4,0,.2,1);
}
html{font-size:13px}

/* ── CHROME: same bar, same rail, in both apps ───────────────────────── */
.topbar,#appTopbar{height:44px!important;min-height:44px!important;padding:0 16px!important;
  background:rgba(3,3,4,.92)!important;border-bottom:1px solid var(--b1)!important;
  display:flex!important;align-items:center!important;gap:8px!important;backdrop-filter:blur(14px)!important}
.sidebar.sb2{width:236px!important;background:var(--sidebar)!important;border-right:1px solid var(--b1)!important}
body.sb-min .sidebar.sb2{width:64px!important}

/* ── THE RAIL, IDENTICAL IN BOTH APPS ─────────────────────────────────
   UB dressed every icon in its own tinted tile; PL did too, in different
   hues. Six competing colours read as noise before they read as navigation.
   Colour now marks the ACTIVE item only, in both apps. */
.sb2 .sn-sec{padding:13px 8px 4px!important;font-size:9px!important;font-weight:800!important;
  letter-spacing:1.5px!important;text-transform:uppercase!important;color:#5E5E6C!important}
.sb2 .sn-sec::after{background:rgba(255,255,255,.06)!important}

  color:#9A9AA8!important;font-size:13px!important;font-weight:650!important}

.sb2 .sn-ic{width:24px!important;height:24px!important;border-radius:7px!important;
  background:transparent!important;color:#75757F!important}

  background:linear-gradient(90deg,color-mix(in srgb,var(--c) 20%,transparent),color-mix(in srgb,var(--c) 5%,transparent) 72%,transparent)!important}
.sb2 .nav-item.active .sn-ic{background:color-mix(in srgb,var(--c) 20%,transparent)!important;color:var(--c)!important}

  box-shadow:0 0 12px color-mix(in srgb,var(--c) 65%,transparent)}
.sb2 .nav-badge{font-size:9.5px!important;padding:2px 6px!important;background:rgba(255,255,255,.05)!important;
  border-color:rgba(255,255,255,.09)!important;color:#8C8C99!important}
.sb2 .nav-item.active .nav-badge{background:color-mix(in srgb,var(--c) 17%,transparent)!important;

/* ── PRIMITIVES ──────────────────────────────────────────────────────── */
.btn,.pl-action-btn,.ac2-btn,.tk-type{height:30px;padding:0 12px;border-radius:var(--r-sm)!important;
  font:700 12px var(--sans)!important;background:var(--s3)!important;border:1px solid var(--b2)!important;
  color:var(--t1)!important;cursor:pointer;transition:all .14s var(--ease)}
.btn:hover,.pl-action-btn:hover,.ac2-btn:hover{border-color:var(--b3)!important;background:var(--s4)!important}
/* ONE primary button. PL used a purple->cyan gradient with black text; UB used solid
   purple with white. Two different products in one glance — now they are the same. */
.btn.primary,.btn-primary,.btn.pri,.btn-pri,.imp-btn.primary,.tb-add,.pl-action-btn.primary,
.pl-task-save,.pl-footer-advance,.prod-advance,.ac2-btn.pri{
  background:linear-gradient(180deg,#7C5CFF,#6742F5)!important;
  border:1px solid rgba(167,139,255,.55)!important;color:#FFFFFF!important;
  font-weight:850!important;border-radius:var(--r-sm)!important;
  box-shadow:0 3px 14px rgba(124,92,255,.34)!important;text-shadow:none!important}

.pl-task-save:hover,.pl-footer-advance:hover,.prod-advance:hover{filter:brightness(1.12)}
.btn.sm,.btn-sm{height:26px!important;padding:0 9px!important;font-size:11px!important}
/* Destructive and positive variants. The .btn rule above uses !important, which
   flattened .btn.danger to the same grey as Cancel — so "Yes, delete it" and
   "Cancel" looked identical in every confirm dialog. These restore the meaning. */
.btn.danger,.btn-danger,.prod-reject,.pl-action-btn.danger,.tsk-danger{
  background:rgba(255,84,112,.11)!important;border:1px solid rgba(255,84,112,.42)!important;
  color:#FF93A6!important;font-weight:800!important}
.btn.danger:hover,.btn-danger:hover,.prod-reject:hover,.pl-action-btn.danger:hover{
  background:rgba(255,84,112,.24)!important;border-color:rgba(255,84,112,.65)!important;color:#fff!important}
.btn.success,.btn-success,.pl-action-btn.success{
  background:rgba(0,229,160,.11)!important;border:1px solid rgba(0,229,160,.42)!important;
  color:#5CE6B0!important;font-weight:800!important}
.btn.success:hover,.btn-success:hover{background:rgba(0,229,160,.24)!important;color:#fff!important}
.btn.warn,.btn-warn,.pl-action-btn.warn{
  background:rgba(255,197,61,.11)!important;border:1px solid rgba(255,197,61,.42)!important;

.btn.warn:hover,.btn-warn:hover{background:rgba(255,197,61,.24)!important;color:#fff!important}
.btn.ghost,.btn-ghost{background:transparent!important;border:1px solid var(--b2)!important;color:var(--t3)!important}

/* eyebrows: flat muted caps in both apps. PL's gradient-clipped text was the single
   most obvious "different app" tell on every page header. */
.eyebrow,.page-eyebrow,.pl-eyebrow,.ac2-eyebrow,.p-eyebrow{
  font:850 9.5px var(--sans)!important;letter-spacing:1.6px!important;text-transform:uppercase!important;

.ov-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:9px;margin-bottom:11px}
