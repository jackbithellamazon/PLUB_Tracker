<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#030304;--s1:#0A0A0C;--s2:#0F0F12;--s3:#17171B;--b1:#1E1E24;--b2:#2A2A31;--b3:#3A3A43;--t1:#F5F5F8;--t2:#C6C7D0;--t3:#9698A4;--t4:#787A87;
 --cyan:#22D3EE;--violet:#A78BFF;--green:#00E5A0;--amber:#FFC53D;--red:#FF5470;--pink:#FF5CC8;--blue:#3B9EFF;--orange:#FF8A3D}
html,body{height:100%;background:var(--bg);color:var(--t1);font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;overflow:hidden;font-size:13px}
/* ── bar ── */
.bar{position:fixed;inset:0 0 auto 0;height:40px;display:flex;align-items:center;gap:10px;padding:0 12px;background:var(--bg);border-bottom:1px solid #15151A;z-index:10}
.mark{display:flex;align-items:center;gap:8px;user-select:none;padding-right:4px}
.mark .tile{width:24px;height:24px;border-radius:7px;flex:none;background:linear-gradient(135deg,var(--violet),var(--cyan));display:flex;align-items:center;justify-content:center}
.mark .tile svg{width:15px;height:15px}
.mark b{font-size:13.5px;font-weight:800;letter-spacing:-.4px;white-space:nowrap;background:linear-gradient(90deg,#C4B2FF,#7FE9F5);-webkit-background-clip:text;background-clip:text;color:transparent}
.mark span{font-size:10.5px;color:var(--t4);white-space:nowrap;margin-left:2px}
.tabs{display:flex;gap:2px;background:#0B0B0E;border:1px solid #1A1A20;border-radius:10px;padding:2px}
.tab{appearance:none;border:none;background:none;cursor:pointer;color:#9A9AA6;font:600 12px/1 'Inter',sans-serif;padding:7px 12px;border-radius:8px;display:flex;align-items:center;gap:7px;transition:color .15s cubic-bezier(.4,0,.2,1),background .15s cubic-bezier(.4,0,.2,1),transform .1s cubic-bezier(.4,0,.2,1)}
.tab:active{transform:scale(.96)}
.tab i{width:7px;height:7px;border-radius:50%;font-style:normal;flex:none;background:#34343D;transition:background .15s}
.tab.on{color:#fff;background:#17171E}
.tab.on.ub i{background:var(--cyan)} .tab.on.pl i{background:var(--violet)} .tab.on.pipe i{background:var(--green)}
.tab .n{font-size:9.5px;font-weight:800;padding:1px 5px;border-radius:999px;background:#1E1E26;color:var(--t3);display:none} .tab .n.show{display:inline-block}
.right{margin-left:auto;display:flex;align-items:center;gap:8px}
.chip{font:600 10.5px/1 'Inter',sans-serif;color:#8A8A96;background:#0B0B0E;border:1px solid #1A1A20;border-radius:7px;padding:5px 8px;white-space:nowrap;font-variant-numeric:tabular-nums}
.chip b{color:var(--cyan);font-weight:800}
/* ── stage ── */
.stage{position:fixed;inset:40px 0 0 0}
/* instant cut between apps: both frames stay painted underneath, only the z-order changes — no crossfade, no repaint, nothing to blink */
iframe{position:absolute;inset:0;width:100%;height:100%;border:none;background:var(--bg);display:block;pointer-events:none;z-index:1}
iframe.show{pointer-events:auto;z-index:3}
iframe.leaving{z-index:1}
#pipe{position:absolute;inset:0;display:none;overflow:auto;padding:18px 22px 40px;background:var(--bg);z-index:2}
#pipe.show{z-index:3}
#pipe.leaving{display:none}
#pipe.show{display:block}
.p-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:12px}
.p-eyebrow{font-size:9.5px;font-weight:800;letter-spacing:1.6px;text-transform:uppercase;background:linear-gradient(135deg,var(--violet),var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:3px}
.p-title{font-size:21px;font-weight:800;letter-spacing:-.6px;line-height:1.1}
.p-sub{font-size:12px;color:var(--t3);margin-top:3px}
.p-summary{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.p-pill{font-size:11px;font-weight:700;padding:5px 10px;border-radius:999px;border:1px solid var(--b2);background:var(--s2);color:var(--t2);display:flex;gap:6px;align-items:center}
.p-pill i{width:7px;height:7px;border-radius:50%;font-style:normal} .p-pill.ub i{background:var(--cyan)} .p-pill.pl i{background:var(--violet)} .p-pill.stuck{color:#FF8FA3;border-color:rgba(255,84,112,.45);background:rgba(255,84,112,.12)} .p-pill.wait{color:#FFDC85;border-color:rgba(255,197,61,.45);background:rgba(255,197,61,.12)}
.p-wrap{overflow-x:auto;padding-bottom:8px}
.p-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px;margin-bottom:10px}
.p-kpi{display:flex;align-items:center;gap:11px;background:linear-gradient(180deg,color-mix(in srgb,var(--c) 8%,var(--s1)),var(--s1) 70%);border:1px solid color-mix(in srgb,var(--c) 30%,var(--b1));border-top:2px solid var(--c);border-radius:12px;padding:10px 13px}
.p-kpi-ring{position:relative;width:42px;height:42px;flex:none}
.p-kpi-ring svg{width:42px;height:42px}
.p-kpi-ring span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:850;color:var(--t1);font-variant-numeric:tabular-nums}
.p-kpi-ring span i{font-size:6.5px;font-style:normal;color:var(--t3);margin-left:1px}
.p-kpi-t{min-width:0;flex:1}
.p-kpi-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.p-kpi-top b{font-size:10px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--t2)}
.p-kpi-b{font-size:8px;font-weight:850;letter-spacing:.5px;padding:1px 6px;border-radius:99px;border:1px solid}
.p-kpi-b.ok{color:#4ADE80;border-color:rgba(0,229,160,.4);background:rgba(0,229,160,.1)}
.p-kpi-b.bad{color:#FF7A90;border-color:rgba(255,84,112,.4);background:rgba(255,84,112,.1)}
.p-kpi-v{font-size:18px;font-weight:850;letter-spacing:-.7px;line-height:1.1;color:var(--t1);font-variant-numeric:tabular-nums}
.p-kpi-v i{font-size:11px;font-style:normal;font-weight:700;color:var(--t3)}
.p-kpi-s{font-size:9.5px;color:var(--t4);margin-top:2px}

/* ════ SCALING OVERVIEW — the one page that answers "are we scaling?" ════ */
.ov{margin:0 0 14px}
.ov-hero{border-radius:16px;padding:16px 20px;border:1px solid;display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.ov-hero.ok{background:linear-gradient(180deg,rgba(0,229,160,.10),rgba(0,229,160,.02));border-color:rgba(0,229,160,.34)}
.ov-hero.warn{background:linear-gradient(180deg,rgba(255,197,61,.10),rgba(255,197,61,.02));border-color:rgba(255,197,61,.36)}
.ov-hero.bad{background:linear-gradient(180deg,rgba(255,84,112,.10),rgba(255,84,112,.02));border-color:rgba(255,84,112,.4)}
.ov-q{font-size:9.5px;font-weight:900;letter-spacing:1.4px;text-transform:uppercase;color:var(--t4);margin-bottom:5px}
.ov-a{font-size:21px;font-weight:850;letter-spacing:-.5px;line-height:1.25}
.ov-hero.ok .ov-a{color:#4ADE80} .ov-hero.warn .ov-a{color:#FFC53D} .ov-hero.bad .ov-a{color:#FF7A90}
.ov-a small{display:block;font-size:12.5px;font-weight:600;color:var(--t3);margin-top:6px;line-height:1.55;letter-spacing:0}
.ov-hero-l{flex:1;min-width:280px}
.ov-score{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:96px}
.ov-score b{font-size:38px;font-weight:850;line-height:1;letter-spacing:-2px;font-variant-numeric:tabular-nums}
.ov-hero.ok .ov-score b{color:#4ADE80} .ov-hero.warn .ov-score b{color:#FFC53D} .ov-hero.bad .ov-score b{color:#FF7A90}
.ov-score span{font-size:9px;font-weight:900;letter-spacing:1px;text-transform:uppercase;color:var(--t4);text-align:center}

.ov-people{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:10px;margin-bottom:10px}
.ov-p{border-radius:14px;border:1px solid var(--b1);background:var(--s1);padding:13px 15px;position:relative;overflow:hidden}
.ov-p::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--pc)}
.ov-p.ub{--pc:#7C5CFF} .ov-p.pl{--pc:#22D3EE}
.ov-p-h{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;margin-bottom:9px}
.ov-p-h b{font-size:14.5px;font-weight:850;color:var(--t1);letter-spacing:-.2px}
.ov-p-h .who{font-size:9.5px;font-weight:900;letter-spacing:1px;text-transform:uppercase;color:var(--pc)}
.ov-p-h .mode{margin-left:auto;font-size:9px;font-weight:900;letter-spacing:1px;text-transform:uppercase;padding:4px 9px;border-radius:99px;border:1px solid var(--b2);background:var(--s2);color:var(--t3)}
.ov-p-h .mode.source{border-color:rgba(167,139,255,.5);background:rgba(167,139,255,.14);color:#C9B8FF}
.ov-p-h .mode.pipeline{border-color:rgba(34,211,238,.5);background:rgba(34,211,238,.13);color:#7DE4F5}
.ov-hrs{display:flex;align-items:center;gap:11px;margin-bottom:9px}
.ov-hrs b{font-size:19px;font-weight:850;color:var(--t1);line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap}
.ov-hrs b i{font-style:normal;font-size:11.5px;font-weight:700;color:var(--t4)}
.ov-hrs em{flex:1;min-width:70px;height:7px;border-radius:99px;background:rgba(255,255,255,.07);position:relative;overflow:hidden;display:block}
.ov-hrs em u{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:linear-gradient(90deg,#7C5CFF,#A78BFF)}
.ov-hrs em u.hit{background:linear-gradient(90deg,#00C48C,#00E5A0)} .ov-hrs em u.lag{background:linear-gradient(90deg,#E8A317,#FFC53D)}
.ov-hrs em s{position:absolute;top:-3px;width:2px;height:13px;background:rgba(255,255,255,.5);border-radius:2px;text-decoration:none}
.ov-say{font-size:12.5px;font-weight:700;line-height:1.5;margin-bottom:9px}
.ov-say.ok{color:#4ADE80} .ov-say.warn{color:#FFC53D} .ov-say.bad{color:#FF7A90}
.ov-say small{display:block;font-size:11.5px;font-weight:600;color:var(--t3);margin-top:3px;line-height:1.5}
.ov-n{display:flex;gap:6px;flex-wrap:wrap}
.ov-n i{font-style:normal;min-width:52px;text-align:center;border-radius:8px;padding:5px 8px;background:var(--s2);border:1px solid var(--b1)}
.ov-n i b{display:block;font-size:15px;font-weight:850;color:var(--t1);line-height:1.15;font-variant-numeric:tabular-nums}
.ov-n i span{display:block;font-size:8px;font-weight:850;letter-spacing:.5px;text-transform:uppercase;color:var(--t4);margin-top:1px}
.ov-n i.go b{color:#4ADE80} .ov-n i.hot b{color:#FFC53D} .ov-n i.wait b{color:#7DE4F5} .ov-n i.bad b{color:#FF7A90}

.ov-answers{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:7px;margin-bottom:10px}
.ov-ans{border-radius:11px;border:1px solid var(--b1);background:var(--s1);padding:9px 11px;border-left:2px solid var(--ac,var(--b2))}
.ov-ans.y{--ac:#00E5A0} .ov-ans.n{--ac:#FF5470} .ov-ans.m{--ac:#FFC53D}
.ov-ans .q{font-size:9px;font-weight:900;letter-spacing:.8px;text-transform:uppercase;color:var(--t4);margin-bottom:4px;line-height:1.3}
.ov-ans .a{font-size:14px;font-weight:850;color:var(--t1);line-height:1.2;letter-spacing:-.2px}
.ov-ans.y .a{color:#4ADE80} .ov-ans.n .a{color:#FF7A90} .ov-ans.m .a{color:#FFC53D}
.ov-ans .s{font-size:10px;color:var(--t4);font-weight:650;margin-top:3px;line-height:1.35}
.ov-next{border-radius:12px;border:1px solid var(--b1);background:var(--s1);padding:11px 14px;margin-bottom:10px}
.ov-next-h{font-size:9.5px;font-weight:900;letter-spacing:1.2px;text-transform:uppercase;color:var(--t4);margin-bottom:8px}
.ov-step{display:flex;align-items:flex-start;gap:9px;padding:6px 0;border-top:1px solid var(--b1);cursor:pointer}
.ov-step:first-of-type{border-top:0}
.ov-step:hover .ov-step-t{color:#fff}
.ov-step em{font-style:normal;flex:none;width:19px;height:19px;border-radius:6px;display:grid;place-items:center;font-size:10px;font-weight:900;
  background:var(--s2);border:1px solid var(--b2);color:var(--t3);margin-top:1px}
.ov-step.p1 em{background:rgba(255,84,112,.16);border-color:rgba(255,84,112,.45);color:#FF97AA}
.ov-step.p2 em{background:rgba(255,197,61,.14);border-color:rgba(255,197,61,.42);color:#FFC53D}
.ov-step-t{font-size:12.5px;font-weight:750;color:var(--t2);line-height:1.4;transition:color .13s}
.ov-step-t span{display:block;font-size:11px;font-weight:600;color:var(--t4);margin-top:2px}
.ov-step-a{margin-left:auto;flex:none;font-size:10px;font-weight:850;color:var(--t4);letter-spacing:.4px;white-space:nowrap;align-self:center}
.p-week{display:flex;align-items:center;gap:14px;flex-wrap:wrap;border-radius:12px;padding:10px 14px;margin-bottom:10px;border:1px solid}
.p-week.ok{background:rgba(0,229,160,.06);border-color:rgba(0,229,160,.3)}
.p-week.quiet{background:rgba(255,197,61,.06);border-color:rgba(255,197,61,.35)}
.pw-verdict{font-size:12.5px;font-weight:800;flex:1;min-width:250px}
.p-week.ok .pw-verdict{color:#4ADE80} .p-week.quiet .pw-verdict{color:#FFC53D}
.pw-verdict i{font-style:normal;font-weight:650;font-size:10.5px;color:var(--t4)}
.pw-cells{display:flex;gap:7px;flex-wrap:wrap}
.pw-cell{display:flex;align-items:baseline;gap:5px;background:var(--s1);border:1px solid var(--b1);border-radius:9px;padding:5px 10px}
.pw-cell b{font-size:14px;font-weight:850;color:var(--t1);font-variant-numeric:tabular-nums}
.pw-cell span{font-size:9.5px;color:var(--t4);font-weight:650}
.pw-cell.hot{border-color:rgba(255,84,112,.4)} .pw-cell.hot b{color:#FF7A90}
.p-flow{display:flex;flex-direction:column;gap:7px;background:var(--s1);border:1px solid var(--b1);border-radius:12px;padding:11px 14px;margin-bottom:10px}
.p-flowbar{display:flex;gap:2px;height:9px;border-radius:99px;overflow:hidden}
.p-flowbar span{border-radius:99px;min-width:6px;transition:flex .3s}
.p-flowread{font-size:11.5px;color:var(--t3)} .p-flowread b{color:var(--t1);font-weight:800}
.p-cols{display:grid;gap:8px;min-width:0}
.p-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:6px;align-content:start}
.p-card{margin-bottom:0!important}
body.nobar .bar{display:none}
body.nobar .stage{inset:0}
.p-col{background:var(--s1);border:1px solid var(--b1);border-radius:12px;padding:9px 9px 8px;border-top:2px solid var(--b2);min-height:140px}
.p-col.slim{min-height:140px;padding:8px 0;display:flex;flex-direction:column;align-items:center;gap:8px;background:transparent;border-style:dashed;border-top-style:solid;opacity:.65}
.p-col.slim b{writing-mode:vertical-rl;font-size:9.5px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--t4)}
.p-col.slim .c0{font-size:10px;font-weight:800;color:var(--t4);background:var(--s2);border:1px solid var(--b1);border-radius:99px;padding:1px 6px}
.p-col-h{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.p-col-h b{font-size:11.5px;font-weight:800;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-col-h .c{font-size:10.5px;font-weight:800;color:var(--t3);background:var(--s3);border:1px solid var(--b2);border-radius:999px;padding:1px 7px;font-variant-numeric:tabular-nums}
.p-col.c-sourcing{border-top-color:var(--cyan)} .p-col.c-validating{border-top-color:var(--pink)} .p-col.c-samples{border-top-color:var(--blue)} .p-col.c-ordered{border-top-color:var(--orange)} .p-col.c-ready{border-top-color:var(--amber)} .p-col.c-launching{border-top-color:#4ADE80} .p-col.c-launched{border-top-color:var(--green);background:color-mix(in srgb,var(--green) 6%,var(--s1))}
.p-card{position:relative;overflow:hidden;background:var(--s2);border:1px solid var(--b1);border-radius:10px;padding:8px 9px 8px 12px;margin-bottom:6px;cursor:pointer;transition:border-color .14s,transform .08s}
.p-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--b2)}
.p-card.ub::before{background:var(--cyan)} .p-card.pl::before{background:var(--violet)}
.p-card:hover{border-color:var(--b3);transform:translateY(-1px)} .p-card:active{transform:scale(.985)}
.p-card.stuck{border-color:rgba(255,84,112,.5)} .p-card.stuck::before{background:#FF5470}
.p-card .sc{float:right;font-size:12px;font-weight:850;letter-spacing:-.4px;color:var(--green);font-variant-numeric:tabular-nums}
.p-more{font-size:10.5px;font-weight:700;color:var(--t3);text-align:center;padding:8px 6px;border:1px dashed var(--b2);border-radius:9px;cursor:pointer;transition:color .14s,border-color .14s}
.p-more:hover{color:var(--t1);border-color:var(--b3)}
.p-card .t{font-size:12px;font-weight:700;line-height:1.3;color:var(--t1);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.p-card .m{display:flex;align-items:center;gap:6px;margin-top:6px;flex-wrap:wrap}
.app-chip{font-size:9px;font-weight:800;letter-spacing:.6px;padding:2px 6px;border-radius:5px} .app-chip.ub{background:rgba(34,211,238,.16);color:var(--cyan)} .app-chip.pl{background:rgba(167,139,255,.18);color:#C4B2FF}
.p-card .d{font-size:10.5px;color:var(--t3)} .p-card .d.over{color:#FF8FA3;font-weight:700} .p-card .d.wait{color:#FFDC85;font-weight:700}
.p-card .s{font-size:10.5px;color:var(--t4);margin-top:3px}
.p-empty{font-size:11px;color:var(--t4);text-align:center;padding:14px 6px;border:1px dashed var(--b2);border-radius:9px}
.p-foot{font-size:11px;color:var(--t4);margin-top:10px}

/* ══════════════════════════════════════════════════════════════════════
   PLUB CORE — identity, activity, sessions, tasks, work types, settings.
   One copy, byte-identical in index.html, ub.html and pl.html.

   THIS WEEKEND: everything lives in localStorage under club_v1 (shared by
   the shell and both frames — same origin). Cross-frame changes arrive via
   the `storage` event, so a task sent from PL shows in UB without a reload.

   MONDAY: CLUB.sync.enable(supabaseClient) pulls the seven tables, then
   every write also upserts. The local store stays as the cache. Same rows,
   same shape as the SQL in  CLUB - 1 - Supabase setup.sql.
   ══════════════════════════════════════════════════════════════════════ */
window.CLUB = (function(){
  var KEY='plub_v1', WHO='plub_who', MODE='plub_mode', OUTBOX='plub_outbox_v1';
  var COLS=['users','activity','sessions','tasks','task_notes','work_types'];
  var DEF_USERS=[
    {id:'jack',  display_name:'Jack',  role:'owner', active:true},
    {id:'becki', display_name:'Becki', role:'staff', active:true}];
  var DEF_WT=[
    {key:'ideas',    label:'Finding new ideas',                              sort:10, active:true, counts_as_sourcing:true},
    {key:'validate', label:'Validating an existing idea',                    sort:20, active:true, counts_as_sourcing:true},
    {key:'supplier', label:'Supplier sourcing',                              sort:30, active:true, counts_as_sourcing:true},
    {key:'contact',  label:'Contacting wholesalers / distributors / brands', sort:40, active:true, counts_as_sourcing:true},
    {key:'pricing',  label:'Trade & bulk pricing',                           sort:50, active:true, counts_as_sourcing:true},
    {key:'listing',  label:'Creating listings',                              sort:60, active:true, counts_as_sourcing:false},
    {key:'images',   label:'Images & creative',                              sort:70, active:true, counts_as_sourcing:false},
    {key:'pipeline', label:'Progressing products through the pipeline',      sort:80, active:true, counts_as_sourcing:false}];
  // old session types from both apps map onto the shared list
  var LEGACY={fresh:'ideas', working:'validate'};

  var S=null;
  function load(){
    var raw=null; try{ raw=localStorage.getItem(KEY); }catch(e){}
    try{ S=raw?JSON.parse(raw):null; }catch(e){ S=null; }
    if(!S||typeof S!=='object') S={schema:1};
    COLS.forEach(function(c){ if(!Array.isArray(S[c])) S[c]=[]; });
    if(!S.settings||typeof S.settings!=='object') S.settings={};
    if(!S.users.length) S.users=DEF_USERS.map(function(u){return Object.assign({},u);});
    if(!S.work_types.length) S.work_types=DEF_WT.map(function(w){return Object.assign({},w);});
  }
  load();
  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} notify(); }
  function uuid(){ try{ if(crypto&&crypto.randomUUID) return crypto.randomUUID(); }catch(e){}
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,function(c){var r=Math.random()*16|0;return (c==='x'?r:(r&3|8)).toString(16);}); }
  function now(){ return new Date().toISOString(); }
  function mode(){ try{ return localStorage.getItem(MODE)||'local'; }catch(e){ return 'local'; } }

  /* ── identity ─────────────────────────────────────────────────────── */
  function whoId(){ try{ return localStorage.getItem(WHO)||''; }catch(e){ return ''; } }
  function user(){ var id=whoId(); return S.users.filter(function(u){return u.id===id;})[0]||null; }
  function users(){ return S.users.filter(function(u){return u.active!==false;}); }
  function setWho(id){ try{ localStorage.setItem(WHO,id); }catch(e){} notify(); }
  function signOut(){ try{ localStorage.removeItem(WHO); }catch(e){} notify(); }
  function byId(id){ return S.users.filter(function(u){return u.id===id;})[0]||null; }
  function nameOf(id){ var u=byId(id); return u?u.display_name:(id||'?'); }

  /* ── generic rows ─────────────────────────────────────────────────── */
  function add(col,row){ row.id=row.id||uuid(); row.created_at=row.created_at||now(); S[col].push(row); save(); push(col,row); return row; }
  function update(col,id,patch){ var r=S[col].filter(function(x){return x.id===id;})[0]; if(!r) return null;
    Object.keys(patch).forEach(function(k){ r[k]=patch[k]; }); r.updated_at=now(); save(); push(col,r); return r; }
  function all(col){ return S[col].slice(); }

  /* ── activity: the audit log ──────────────────────────────────────── */
  function log(kind,o){
    o=o||{}; var u=user();
    var row={ id:uuid(), at:now(), actor_id:u?u.id:null, actor_name:u?u.display_name:(whoId()||'?'),
      app:o.app||'club', kind:kind,
      entity_kind:o.entity_kind||null, entity_ref:(o.entity_ref!=null?String(o.entity_ref):null),
      entity_name:o.entity_name||null, from_val:o.from!=null?String(o.from):null, to_val:o.to!=null?String(o.to):null,
      mins:(typeof o.mins==='number')?Math.round(o.mins):null, session_id:o.session_id||null, detail:o.detail||{} };
    S.activity.push(row);
    if(S.activity.length>6000) S.activity=S.activity.slice(-5000);   // local cap; the DB keeps everything
    save(); push('activity',row); return row;
  }

  /* ── sessions: time by type of work ───────────────────────────────── */
  function workTypes(activeOnly){ var w=S.work_types.slice().sort(function(a,b){return (a.sort||0)-(b.sort||0);});
    return activeOnly===false? w : w.filter(function(x){return x.active!==false;}); }
  function wtKey(k){ return LEGACY[k]||k; }
  function wtLabel(k){ k=wtKey(k); var w=S.work_types.filter(function(x){return x.key===k;})[0]; return w?w.label:k; }
  function saveWorkTypes(list){ S.work_types=list; save(); }
  function sessionStart(app,work_type,note){
    var u=user(); var row=add('sessions',{ user_id:u?u.id:null, app:app, work_type:wtKey(work_type), started_at:now(), ended_at:null, mins:null, note:note||'', entity_refs:[] });
    log('session_start',{app:app, entity_kind:'session', entity_ref:row.id, to:wtLabel(work_type), session_id:row.id});
    return row;
  }
  function sessionEnd(id,o){ o=o||{}; var r=S.sessions.filter(function(x){return x.id===id;})[0]; if(!r) return null;
    r.ended_at=now(); r.mins=(typeof o.mins==='number')?Math.max(0,Math.round(o.mins)):Math.max(0,Math.round((Date.now()-new Date(r.started_at).getTime())/60000));
    if(o.note) r.note=o.note; if(o.entity_refs) r.entity_refs=o.entity_refs; save(); push('sessions',r);
    log('session_end',{app:r.app, entity_kind:'session', entity_ref:r.id, to:wtLabel(r.work_type), mins:r.mins, session_id:r.id}); return r; }
  function sessionQuick(app,work_type,mins,note){
    var u=user(); var t=now();
    var row=add('sessions',{ user_id:u?u.id:null, app:app, work_type:wtKey(work_type), started_at:t, ended_at:t, mins:Math.max(0,Math.round(mins)), note:note||'', entity_refs:[] });
    log('session_logged',{app:app, entity_kind:'session', entity_ref:row.id, to:wtLabel(work_type), mins:row.mins, session_id:row.id}); return row; }
  function sessionsFor(userId,sinceMs,untilMs){ return S.sessions.filter(function(s){ var t=new Date(s.started_at).getTime();
    return (!userId||s.user_id===userId) && (sinceMs==null||t>=sinceMs) && (untilMs==null||t<untilMs); }); }

  /* ── tasks between people ─────────────────────────────────────────── */
  function taskAdd(o){
    var u=user(); var row=add('tasks',{ title:o.title, type:o.type||'general', url:o.url||null, brief:o.brief||null,
      priority:o.priority||'normal', status:'not_started', created_by:u?u.id:null, assigned_to:o.assigned_to||(u?u.id:null),
      due:o.due||null, related_app:o.related_app||null, related_ref:o.related_ref!=null?String(o.related_ref):null,
      related_name:o.related_name||null, completed_at:null, completed_by:null, updated_at:now() });
    log('task_assigned',{app:o.related_app||'club', entity_kind:'task', entity_ref:row.id, entity_name:row.title, to:nameOf(row.assigned_to),
      detail:{related_ref:row.related_ref, related_name:row.related_name}});
    return row; }
  function taskStatus(id,status){ var u=user(); var r=update('tasks',id,{ status:status,
      completed_at:status==='done'?now():null, completed_by:status==='done'?(u?u.id:null):null });
    if(r) log(status==='done'?'task_done':'task_status',{app:r.related_app||'club', entity_kind:'task', entity_ref:r.id, entity_name:r.title, to:status});
    return r; }
  function taskNote(id,text){ var u=user(); var r=S.tasks.filter(function(x){return x.id===id;})[0]; if(!r) return null;
    var n=add('task_notes',{ task_id:id, who_id:u?u.id:null, who_name:u?u.display_name:'?', text:text, at:now() });
    log('task_note',{app:r.related_app||'club', entity_kind:'task', entity_ref:id, entity_name:r.title}); return n; }
  function tasksFor(userId,o){ o=o||{}; return S.tasks.filter(function(t){
    return !t.deleted_at && (!userId||t.assigned_to===userId) && (o.all||t.status!=='done'); })
    .sort(function(a,b){ var P={urgent:0,high:1,normal:2,low:3}; return (P[a.priority]-P[b.priority])||(a.due||'9').localeCompare(b.due||'9'); }); }
  function taskNotes(id){ return S.task_notes.filter(function(n){return n.task_id===id;}); }

  /* ── shared settings ──────────────────────────────────────────────── */
  function setting(key,val){ if(val===undefined) return S.settings[key]; S.settings[key]=val; save(); push('settings',{key:key,value:val}); return val; }

  /* ── "what happened?" ─────────────────────────────────────────────── */
  function activityBetween(sinceMs,untilMs,userId){ return S.activity.filter(function(a){ var t=new Date(a.at).getTime();
    return t>=sinceMs && (untilMs==null||t<untilMs) && (!userId||a.actor_id===userId); }); }
  function summarise(sinceMs,untilMs){
    var out={};
    users().forEach(function(u){
      var acts=activityBetween(sinceMs,untilMs,u.id), sess=sessionsFor(u.id,sinceMs,untilMs).filter(function(s){return s.mins!=null;});
      var byType={}; sess.forEach(function(s){ byType[s.work_type]=(byType[s.work_type]||0)+(s.mins||0); });
      var count=function(k){ return acts.filter(function(a){return a.kind===k;}).length; };
      out[u.id]={ user:u, sessions:sess.length, mins:sess.reduce(function(a,s){return a+(s.mins||0);},0), byType:byType,
        ideas_added:count('idea_added'), ideas_updated:count('idea_updated'), moved:count('stage'), entered:count('entered_pipeline'),
        launched:count('launched'), dropped:count('dropped'), suppliers:count('supplier_added')+count('supplier_contacted'),
        samples:count('sample_added')+count('sample_ordered')+count('sample_received'), tasks_done:count('task_done'),
        tasks_assigned:count('task_assigned'), opened:count('product_opened'), notes:count('note'), acts:acts };
    });
    return out;
  }

  /* ── cross-frame + subscribers ────────────────────────────────────── */
  var subs=[]; function on(fn){ subs.push(fn); } function notify(){ subs.forEach(function(f){ try{ f(); }catch(e){} }); }
  try{ window.addEventListener('storage',function(e){ if(e.key===KEY||e.key===WHO||e.key===MODE){ load(); notify(); } }); }catch(e){}

  /* ── Supabase sync (Monday). Dormant until enable() is called. ───── */
  var sb=null, outbox=[];
  try{ outbox=JSON.parse(localStorage.getItem(OUTBOX)||'[]'); }catch(e){ outbox=[]; }
  var TABLE={users:'bdl_plub_users',activity:'bdl_plub_activity',sessions:'bdl_plub_sessions',tasks:'bdl_plub_tasks',
             task_notes:'bdl_plub_task_notes',work_types:'bdl_plub_work_types',settings:'bdl_plub_settings'};
  function push(col,row){ if(mode()!=='supabase') return; outbox.push({col:col,row:row,at:Date.now()});
    try{ localStorage.setItem(OUTBOX,JSON.stringify(outbox.slice(-2000))); }catch(e){} flush(); }
  var flushing=false;
  function flush(){ if(!sb||flushing||!outbox.length) return; flushing=true;
    var item=outbox[0]; var t=TABLE[item.col]; var row=Object.assign({},item.row);
    if(item.col==='activity'){ delete row.id; }            // identity column server-side
    var q= item.col==='settings' ? sb.from(t).upsert({key:row.key,value:row.value},{onConflict:'key'})
         : item.col==='work_types' ? sb.from(t).upsert(row,{onConflict:'key'})
         : sb.from(t).upsert(row,{onConflict:'id'});
    q.then(function(res){ if(res&&res.error){ console.warn('club sync',res.error); flushing=false; return; }
      outbox.shift(); try{ localStorage.setItem(OUTBOX,JSON.stringify(outbox)); }catch(e){} flushing=false; flush(); })
     .catch(function(err){ console.warn('club sync',err); flushing=false; });
  }
  function enable(client){ sb=client; try{ localStorage.setItem(MODE,'supabase'); }catch(e){}
    // initial pull: server rows merge over local by id; local-only rows are then pushed
    var cols=Object.keys(TABLE);
    return Promise.all(cols.map(function(c){ return sb.from(TABLE[c]).select('*').then(function(res){ return {c:c,rows:(res&&res.data)||[]}; }); }))
      .then(function(parts){
        parts.forEach(function(p){
          if(p.c==='settings'){ p.rows.forEach(function(r){ S.settings[r.key]=r.value; }); return; }
          var byId={}; S[p.c].forEach(function(r){ byId[r.id||r.key]=r; });
          p.rows.forEach(function(r){ byId[r.id||r.key]=r; });
          S[p.c]=Object.keys(byId).map(function(k){return byId[k];});
        });
        save(); flush();
      });
  }
  function disable(){ sb=null; try{ localStorage.setItem(MODE,'local'); }catch(e){} }

  /* ── this month, both sides: read straight from the two trackers' stores (same origin) ── */
  function monthBoth(){
    var now=new Date(), ws=new Date(now.getFullYear(),now.getMonth(),1).getTime(), me=new Date(now.getFullYear(),now.getMonth()+1,1).getTime();
    var inM=function(t){ t=(typeof t==='number')?t:(t?new Date(t).getTime():0); return isFinite(t)&&t>=ws&&t<me; };
    var out={ub:null,pl:null};
    try{ var ub=JSON.parse(localStorage.getItem('ub_tracker_v1')||'null'); if(ub){
      var mins=(ub.sessionLog||[]).filter(function(x){return inM(x.date);}).reduce(function(a,x){return a+(x.mins||0);},0);
      if(ub.session&&ub.session.start>=ws) mins+=Math.max(0,Math.round((Date.now()-ub.session.start)/60000));
      var kh=((ub.settings&&ub.settings.kpis)||[]).filter(function(k){return k.id==='hours';})[0]; var ev=ub.events||[];
      out.ub={hrs:mins/60, tgt:(kh&&kh.target)||32, active:(ub.pipeline||[]).length,
        moved:ev.filter(function(e){return e.type==='stage'&&inM(e.at);}).length,
        launched:ev.filter(function(e){return e.type==='launches'&&inM(e.at);}).length}; } }catch(e){}
    try{ var pl=JSON.parse(localStorage.getItem('pl_sourcing_v1')||'null'); if(pl){
      var B=(pl.brand_state&&pl.brand_state[0]&&pl.brand_state[0].data)||{};
      var m2=(B.plSess||[]).filter(function(x){return inM(x.at);}).reduce(function(a,x){return a+(x.mins||0);},0);
      if(B.plRun&&B.plRun.start>=ws) m2+=Math.max(0,Math.round((Date.now()-B.plRun.start)/60000));
      var moved=0,launched=0,active=0;
      (pl.ideas||[]).forEach(function(r){ var i=r.data||{}, p=i.pipeline||{}; if(p.launchedAt&&inM(p.launchedAt)) launched++;
        if(!i.inPipeline||p.status==='rejected'||p.status==='launched') return; active++;
        if((p.history||[]).some(function(x){return inM(x.ts)&&(x.type==='advance'||x.type==='launch');})) moved++; });
      out.pl={hrs:m2/60, tgt:(typeof B.plMonthlyHours==='number'?B.plMonthlyHours:(typeof B.plWeeklyHours==='number'?Math.round(B.plWeeklyHours*52/12):87)), active:active, moved:moved, launched:launched}; } }catch(e){}
    return out;
  }
  function railMonthHtml(){
    var m=monthBoth(); var fh=function(h){ return h>=10?Math.round(h)+'h':(Math.round(h*10)/10)+'h'; };
    var row=function(d,who,app,col){
      if(!d) return '<div class="snm-row off"><i style="--av:'+col+'">'+who[0]+'</i><b>'+who+'</b><span>'+app+'</span><em>not opened</em></div>';
      var pct=d.tgt>0?Math.min(100,Math.round(d.hrs/d.tgt*100)):0;
      return '<div class="snm-row"><i style="--av:'+col+'">'+who[0]+'</i><b>'+who+'</b><span>'+app+'</span><em>'+fh(d.hrs)+' <u>/ '+fh(d.tgt)+'</u></em></div><div class="snm-bar" style="--c:'+col+'"><s style="width:'+pct+'%"></s></div>'; };
    var n=function(k){ return ((m.ub&&m.ub[k])||0)+((m.pl&&m.pl[k])||0); };
    return '<div class="snm-h">This month<span>both sides</span></div>'+row(m.ub,'Becki','UB','#00E5A0')+row(m.pl,'Jack','PL','#A78BFF')
      +'<div class="snm-foot"><b>'+n('active')+'</b> active · <b>'+n('moved')+'</b> moved · <b>'+n('launched')+'</b> launched</div>';
  }

  return { mode:mode, user:user, users:users, setWho:setWho, signOut:signOut, nameOf:nameOf, byId:byId,
    log:log, activityBetween:activityBetween, summarise:summarise,
    workTypes:workTypes, wtKey:wtKey, wtLabel:wtLabel, saveWorkTypes:saveWorkTypes,
    sessionStart:sessionStart, sessionEnd:sessionEnd, sessionQuick:sessionQuick, sessionsFor:sessionsFor,
    taskAdd:taskAdd, taskStatus:taskStatus, taskNote:taskNote, tasksFor:tasksFor, taskNotes:taskNotes,
    setting:setting, all:all, add:add, update:update, on:on, reload:function(){ load(); notify(); },
    sync:{ enable:enable, disable:disable, flush:flush, pending:function(){ return outbox.length; } },
    monthBoth:monthBoth, railMonthHtml:railMonthHtml,
    _dump:function(){ return JSON.parse(JSON.stringify(S)); } };
})();

</script>
<script>
// BUILD is the version people see — moves by 0.05 a release; STAMP is what actually busts the cache. Bump STAMP every push.
var BUILD = '0.90';
var STAMP = '2026-09-09b';
document.getElementById('buildChip').textContent = 'v' + BUILD;

var FRAMES = { ub: document.getElementById('f_ub'), pl: document.getElementById('f_pl') };
var SRC = { ub: 'ub.html', pl: 'pl.html' };
var TAB_KEY = 'ubpl_shell_tab';

function ensureLoaded(app){
  var f = FRAMES[app]; if(!f) return;
  if (!f.getAttribute('src')){ f.onload=function(){ try{ stampVersion(f.contentDocument); f.contentDocument.body.classList.add('plub-embed'); chromeSync(true); }catch(e){} }; f.src = SRC[app] + '?v=' + encodeURIComponent(BUILD + '-' + STAMP); }
}
// the two apps carry a hard-coded version string in their own bar and rail — the shell is the only thing that knows the real build
function stampVersion(doc){ try{ doc.querySelectorAll('[data-ver]').forEach(function(e){ e.textContent='v'+BUILD; }); }catch(e){} }
var _onScreen=null;
function show(app){
  if (app!=='pipe' && !FRAMES[app]) app = 'ub';
  if (app!=='pipe') ensureLoaded(app);
  var pipeEl=document.getElementById('pipe');
  var target = app==='pipe' ? pipeEl : FRAMES[app];
  Object.keys(FRAMES).forEach(function(k){ FRAMES[k].classList.toggle('show', k === app); FRAMES[k].classList.remove('leaving'); });
  pipeEl.classList.toggle('show', app==='pipe'); pipeEl.classList.remove('leaving');
  _onScreen = target;
  document.body.classList.toggle('nobar', app!=='pipe');
  try{ chromeSync(true); }catch(e){}
  // keep the in-app pills' active state honest
  Object.keys(FRAMES).forEach(function(k){ try{
    var xd=FRAMES[k].contentDocument, btns=xd?xd.querySelectorAll('#xtabs .xt'):[];
    if(btns.length===3){ btns[0].classList.toggle('on',app==='ub'); btns[1].classList.toggle('on',app==='pl'); btns[2].classList.toggle('on',app==='pipe'); }
    stampVersion(xd);
  }catch(e){} });
  document.querySelectorAll('.tab').forEach(function(t){ t.classList.toggle('on', t.dataset.app === app); });
  try { localStorage.setItem(TAB_KEY, app); } catch(e){}
  if (app==='pipe') renderPipe();
  else setTimeout(function(){ try { FRAMES[app].contentWindow.focus(); } catch(e){} }, 60);
}
document.getElementById('tabs').addEventListener('click', function(e){ var b = e.target.closest('.tab'); if (b) show(b.dataset.app); });

/* ══════════ merged pipeline: both apps' stores → one board ══════════ */
var COLS = [
  {key:'sourcing',   name:'Sourcing'},
  {key:'validating', name:'Validating'},
  {key:'samples',    name:'Samples'},
  {key:'ordered',    name:'Ordered / stock'},
  {key:'ready',      name:'Ready to launch'},
  {key:'launching',  name:'Launching'},
  {key:'launched',   name:'Launched'}
];
var UB_MAP = { sourcing:'sourcing', jack_validation:'validating', prepare_to_launch:'ready', buy_receive:'ordered', live:'launching', ready_to_source:'sourcing', source:'sourcing', order_purchase:'ordered', launch:'launching' };
var UB_NAMES = { sourcing:'Sourcing', jack_validation:'Jack Validation', prepare_to_launch:'Listing & test', buy_receive:'Buy & receive', live:'Live', ready_to_source:'Ready to Source', source:'Source', order_purchase:'Order / Purchase', launch:'Launch' };
var PL_MAP = { 1:'sourcing', 2:'sourcing', 3:'samples', 4:'samples', 5:'ordered', 6:'ready', 7:'launching' };
var PL_NAMES = { 1:'Sourcing', 2:'Contact & Pricing', 3:'Ordering Samples', 4:'Samples', 5:'Purchase', 6:'Prepare to Launch', 7:'Launch' };
var PL_TARGET = { 1:10, 2:14, 3:7, 4:10, 5:28, 6:15, 7:10 };
function days(iso){ if(!iso) return null; var d=(Date.now()-new Date(iso).getTime())/86400000; return isFinite(d)? Math.max(0,Math.round(d)) : null; }
function sameMonth(iso){ var d=new Date(iso), n=new Date(); return d.getFullYear()===n.getFullYear() && d.getMonth()===n.getMonth(); }
function readStores(){
  var ub=null, pl=null;
  try{ ub = JSON.parse(localStorage.getItem('ub_tracker_v1')||'null'); }catch(e){}
  try{ pl = JSON.parse(localStorage.getItem('pl_sourcing_v1')||'null'); }catch(e){}
  var cards = [];
  if(ub){
    var age = (ub.settings && ub.settings.ageing) || {};
    (ub.pipeline||[]).forEach(function(p){
      var col = UB_MAP[p.stage]||'sourcing', d = days(p.entered), waiting = !!(p.waiting && p.waiting.until && new Date(p.waiting.until) > new Date());
      cards.push({app:'ub', id:p.id, col:col, title:p.title, stage:UB_NAMES[p.stage]||p.stage, days:d, over: !waiting && d!=null && age[p.stage]!=null && d > age[p.stage], wait:waiting});
    });
    ((ub.archive&&ub.archive.launched)||[]).forEach(function(a){ if(a.date && sameMonth(a.date)) cards.push({app:'ub', col:'launched', title:a.title, stage:'launched '+new Date(a.date).toLocaleDateString('en-GB',{day:'numeric',month:'short'}), days:null}); });
  }
  if(pl){
    (pl.ideas||[]).forEach(function(r){
      var i = r.data||{}; var p = i.pipeline||{};

/* ── who owns what, and what the next move is ────────────────────────── */
function ovNext(c){
  if(c.over)  return {p:'HIGH',  t:'Past its '+c.stage+' target — '+c.days+' days in', b:'Work now'};
  if(c.waitExpired) return {p:'HIGH', t:'Waiting date has passed — chase it', b:'Chase it'};
  if(c.wait)  return {p:'LOW',  t:'Waiting on somebody else — nothing to do', b:'View'};
  if(c.cold)  return {p:'MED',  t:'Untouched for '+c.days+' days', b:'Continue'};
  return {p:'LOW', t:'On track in '+c.stage, b:'Review'};
}
// 'Work →' on a queue row opens that product's workspace on its own side — landing on the app and hunting for the card was the old behaviour
function ovOpen(app, id){
  show(app);
  if(!id) return;
  if(/^\d+$/.test(id)) id=Number(id);   // both trackers key products by number; a string id finds nothing
  var tries=0, t=setInterval(function(){
    tries++; try{
      var w=FRAMES[app].contentWindow;
      if(app==='ub' && typeof w.openWorkspace==='function'){ w.nav('pipeline'); w.openWorkspace(id); clearInterval(t); }
      else if(app==='pl' && typeof w.openProduct==='function'){ w.nav('pipeline'); w.openProduct(id); clearInterval(t); }
    }catch(e){}
    if(tries>20) clearInterval(t);
  },120);
}

function ovQueue(cards){
  var rank={HIGH:0,MED:1,LOW:2};
  return cards.filter(function(c){return c.col!=='launched';})
    .map(function(c){ var n=ovNext(c); return {c:c,n:n}; })
    .sort(function(a,b){ return rank[a.n.p]-rank[b.n.p] || (b.c.days||0)-(a.c.days||0); });
}

function renderOverview(ub, pl, m, cards){
  var U=sideUB(ub), L=sidePL(pl), sides=[U,L].filter(Boolean);
  if(!sides.length) return ''
    +'<div class="ov-first"><div class="ov-first-h">Nothing has been opened in this browser yet</div>'
    +'<p>This page reads whatever the two trackers have saved here. Open one and it fills in on its own.</p>'
    +'<div class="ov-first-s">'
      +'<div class="ov-first-c" onclick="show(\'ub\')"><b>1</b><span>Open Unique Bundles</span><i>Add ideas, rank them, move the best into the pipeline</i></div>'
      +'<div class="ov-first-c" onclick="show(\'pl\')"><b>2</b><span>Open Private Label</span><i>Same idea, seven stages, sample-led</i></div>'
      +'<div class="ov-first-c"><b>3</b><span>Come back here</span><i>One verdict, one queue, both belts</i></div>'
    +'</div></div>';
  // both trackers opened but nothing in either yet — the 'belt has holes' verdict would be shouting at a blank page
  if(sides.length>1 && sides.every(function(d){return !d.total;})) return ''
    +'<div class="ov-first"><div class="ov-first-h">Nothing in either tracker yet</div>'
    +'<p>Both sides are open and saving here, they are just empty. This page fills itself in as soon as an idea goes in on either side.</p>'
    +'<div class="ov-first-s">'
      +'<div class="ov-first-c" onclick="show(\'ub\')"><b>1</b><span>Add a Unique Bundles idea</span><i>Paste ASINs or type an idea, score it, move the best into the pipeline</i></div>'
      +'<div class="ov-first-c" onclick="show(\'pl\')"><b>2</b><span>Add a Private Label idea</span><i>Name, where it came from, paste the research \u2014 done in a minute</i></div>'
      +'<div class="ov-first-c"><b>3</b><span>Come back here</span><i>One verdict, one queue, launches forecast from both belts</i></div>'
    +'</div></div>';
  // a side that has never been opened — or has nothing in it on this laptop — is a fact, not five failed stages.
  // Until Monday's import Becki's data lives on her machine, so on Jack's the UB side is simply empty; judge the other side alone.
  var absent=[];
  if(!U) absent.push({k:'ub',n:'Unique Bundles',w:'Becki',empty:false});
  else if(!U.total && L && L.total){ absent.push({k:'ub',n:'Unique Bundles',w:'Becki',empty:true}); U=null; }
  if(!L) absent.push({k:'pl',n:'Private Label',w:'Jack',empty:false});
  else if(!L.total && U && U.total){ absent.push({k:'pl',n:'Private Label',w:'Jack',empty:true}); L=null; }
  sides=[U,L].filter(Boolean);
  var missHtml = absent.length ? '<div class="ov-miss">'
    + absent.map(function(a){ return '<div class="ov-miss-r"><b>'+a.n+(a.empty?' has nothing in it on this laptop':' has not been opened in this browser')+'</b>'
        +'<span>'+(a.empty? a.w+'\u2019s ideas and pipeline live on '+(a.w==='Becki'?'her':'his')+' machine until the import \u2014 this page judges '+(a.k==='ub'?'Private Label':'Unique Bundles')+' on its own for now.' : a.w+'\u2019s numbers are missing from everything on this page \u2014 targets, queue and belts below are one side only.')+'</span>'
        +'<button class="ov-go" onclick="show(\''+a.k+'\')">Open '+a.n+' \u2192</button></div>'; }).join('')
    + '</div>' : '';

  var moved=sides.reduce(function(a,d){return a+d.moved;},0);
  var launched=sides.reduce(function(a,d){return a+d.launched;},0);
  var entered=sides.reduce(function(a,d){return a+d.entered;},0);
  var ideasIn=sides.reduce(function(a,d){return a+d.ideasIn;},0);
  var waiting=sides.reduce(function(a,d){return a+d.waiting;},0);
  var empties=sides.reduce(function(a,d){return a+d.empties;},0);
  var hrs=sides.reduce(function(a,d){return a+d.hrs;},0);
  var tgt=sides.reduce(function(a,d){return a+d.tgt;},0);
  var exp=tgt*weekFrac();
  var q=ovQueue(cards||[]);
  var hot=q.filter(function(x){return x.n.p==='HIGH';}).length;
  var cold=(cards||[]).filter(function(c){return c.cold && c.col!=='launched';}).length;

  /* the headline is a sentence, not a score */
  var tone,head,sub;
  var scope = sides.length>1 ? 'across both sides' : 'on '+sides[0].label;
  if(empties>=3){ tone='bad'; head='The belt has holes in it.';
    sub=empties+' stages are empty '+scope+'. Each one is a launch that will not arrive in about three months.'; }
  else if(hot){ tone='warn'; head='This week needs a push.';
    sub=hot+' product'+(hot===1?'':'s')+' past target'+(cold?' and '+cold+' untouched':'')+'. '+moved+' moved forward so far.'; }
  else if(moved+launched===0){ tone='warn'; head='Nothing has moved yet this month.';
    sub=fmtH(hrs)+' sourced of '+fmtH(tgt)+' this month. Movement is the whole point — push one product forward today.'; }
  else { tone='ok'; head= sides.length>1 ? 'Both belts are moving.' : 'The belt is moving.';
    sub=moved+' moved forward, '+entered+' entered, '+ideasIn+' new idea'+(ideasIn===1?'':'s')+' this month.'; }

  /* four quiet stats with small icon tiles — not six glowing rainbow cards */
  var stat=function(v,l,s2,c,ic){
    return '<div class="ov-stat" style="--c:'+c+'"><span class="ov-si"><svg viewBox="0 0 20 20">'+ic+'</svg></span>'
      +'<div><b>'+v+'</b><span class="ov-sl">'+l+'</span><span class="ov-ss">'+s2+'</span></div></div>'; };
  var IC={bolt:'<path d="M11 2L4 11h5l-1 7 7-9h-5z" fill="currentColor"/>',
          clock:'<circle cx="10" cy="10" r="7.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10 5.5V10l3 2" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"/>',
          up:'<path d="M4 14l4-4 3 3 5-6" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>',
          pause:'<rect x="6" y="5" width="3" height="10" rx="1" fill="currentColor"/><rect x="11" y="5" width="3" height="10" rx="1" fill="currentColor"/>'};
  var stats='<div class="ov-stats">'
    +stat(hot,'Need action',hot?'past target':'nothing overdue','#FF5470',IC.bolt)
    +stat(moved+launched,'Moved forward','this month','#00E5A0',IC.up)
    +stat(cold,'Untouched',cold?'no movement yet':'all touched','#FFC53D',IC.clock)
    +stat(waiting,'Waiting','on somebody else','#22D3EE',IC.pause)
    +'</div>';

  /* targets, both sides, one card */
  var bar=function(l,a,t,c){
    if(!t) return '<div class="ov-t"><div class="ov-t-h"><span>'+l+'</span><b>'+a+'<i> so far</i></b></div>'
      +'<div class="ov-t-bar no-t"><em style="width:100%;--c:'+c+'"></em></div>'
      +'<div class="ov-t-n">no target set</div></div>';
    var p=Math.min(100,a/t*100), e=t*monthPace();
    var st=a>=t?'hit':a>=e?'':'lag';
    return '<div class="ov-t"><div class="ov-t-h"><span>'+l+'</span><b>'+a+'<i> / '+t+'</i></b></div>'
      +'<div class="ov-t-bar"><em class="'+st+'" style="width:'+p.toFixed(0)+'%;--c:'+c+'"></em>'
      +'<u style="left:'+(monthPace()*100).toFixed(0)+'%"></u></div>'
      +'<div class="ov-t-n">'+(a>=t?'hit':a>=e?'on pace':'behind pace')+' · expected '+Math.round(t*monthPace())+' by today</div></div>'; };
  var targets='<section class="ov-card"><div class="ov-card-h"><h3>This month</h3>'
    +'<span class="ov-card-s">day '+new Date().getDate()+' of '+monthDays()+' · the marker is where today should be</span></div>'
    +'<div class="ov-ts">'
      +bar('Sourcing hours', Math.round(hrs*10)/10, Math.round(tgt*10)/10, '#A78BFF')
      +bar('Ideas added', ideasIn, m.iTgt||12, '#7C5CFF')
      +bar('Moved forward', moved+launched, 0, '#00E5A0')
      +bar('Launched', launched, m.lTgt||3, '#22D3EE')
    +'</div></section>';

  /* the ranked queue — what to actually do next, across both belts */
  var rows=q.slice(0,8).map(function(x){
    var c=x.c, n=x.n;
    return '<tr onclick="ovOpen(\''+c.app+'\','+JSON.stringify(String(c.id||'')).replace(/"/g,'&quot;')+')">'
      +'<td><span class="ov-p '+n.p.toLowerCase()+'">'+n.p+'</span></td>'
      +'<td><span class="ov-prod">'+ovAvatar(c.title,'sm')
        +'<b>'+esc(c.title)+'</b><span class="ov-app '+c.app+'">'+(c.app==='ub'?'UB':'PL')+'</span></span></td>'
      +'<td><span class="ov-stage">'+esc(c.stage)+'</span></td>'
      +'<td class="ov-na">'+esc(n.t)+'</td>'
      +'<td class="ov-age">'+(c.days!=null?c.days+'d':'—')+'</td>'
      +'<td><button class="ov-go">'+n.b+' →</button></td></tr>';
  }).join('');
  var queue='<section class="ov-card"><div class="ov-card-h"><h3>Priority queue</h3>'
    +'<span class="ov-card-s">'+q.length+' active across both belts · worst first</span></div>'
    +(rows?'<div class="ov-tw"><table class="ov-tbl"><thead><tr><th>Priority</th><th>Product</th><th>Stage</th><th>Next action</th><th>Age</th><th></th></tr></thead><tbody>'
      +rows+'</tbody></table></div>'
      +(q.length>8?'<div class="ov-more">'+(q.length-8)+' more not shown</div>':'')
      :'<div class="ov-blank">Nothing in either pipeline yet.</div>')
    +'</section>';

  /* two lanes — each belt keeps its own real stages */
  var lane=function(d){
    if(!d) return '';
    var mx=Math.max.apply(null,d.stages.map(function(x){return x.count;}).concat([1]));
    return '<div class="ov-lane '+d.app+'">'
      +'<div class="ov-lane-h"><span class="ov-app '+d.app+'">'+(d.app==='ub'?'UB':'PL')+'</span>'
        +'<b>'+d.label+'</b><span class="ov-lane-s">'+d.who+' · '+d.active+' active</span>'
        +'<button class="ov-open" onclick="show(\''+d.app+'\')">Open →</button></div>'
      +'<div class="ov-flow">'+d.stages.map(function(x,i){
          var cls = x.count===0?'zero' : x.count<x.min?'low':'ok';
          return (i?'<span class="ov-arrow">›</span>':'')
            +'<div class="ov-node '+cls+'" title="'+esc(x.name)+' — '+x.count+' of '+x.min+' minimum">'
            +'<b>'+x.count+'</b><span>'+esc(x.name)+'</span>'
            +'<em style="width:'+Math.round(x.count/mx*100)+'%"></em>'
            +(x.count===0?'<i>empty</i>':'')+'</div>';
        }).join('')+'</div></div>';
  };
  var lanes='<section class="ov-card"><div class="ov-card-h"><h3>The two belts</h3>'
    +'<span class="ov-card-s">each keeps its own stages — they are different processes</span></div>'
    +'<div class="ov-lanes">'+lane(L)+lane(U)+'</div></section>';

  /* one nudge, the single most useful sentence right now */
  var nudge='';
  var worst=sides.slice().sort(function(a,b){return b.empties-a.empties;})[0];
  if(empties>0 && worst){
    var em=worst.stages.filter(function(x){return x.count===0;}).map(function(x){return x.name;});
    nudge='<div class="ov-nudge"><span class="ov-ni"><svg viewBox="0 0 20 20">'+IC.bolt+'</svg></span>'
      +'<div><b>Fill '+esc(em[0])+' on '+esc(worst.label)+'</b>'
      +'<span>'+(em.length>1?em.length+' stages are empty ('+em.map(esc).join(', ')+'). ':'')
      +worst.who+' owns this. An empty stage now is a missing launch about three months out.</span></div>'
      +'<button class="ov-go" onclick="show(\''+worst.app+'\')">Open '+(worst.app==='ub'?'UB':'PL')+' →</button></div>';
  } else if(hrs<exp*0.85){
    nudge='<div class="ov-nudge"><span class="ov-ni"><svg viewBox="0 0 20 20">'+IC.clock+'</svg></span>'
      +'<div><b>Sourcing is behind for the month</b><span>'+fmtH(hrs)+' of '+fmtH(tgt)+' logged, '
      +fmtH(Math.max(0,exp-hrs))+' behind where today sits.</span></div>'
      +'<button class="ov-go" onclick="show(\'pl\')">Start a session →</button></div>';
  }

  return missHtml+'<div class="ov-hero '+tone+'"><div><div class="eyebrow">'+(sides.length>1?'Both belts':esc(sides[0].label))+' · this month</div>'
      +'<h2 class="ov-head">'+head+'</h2><p class="ov-sub">'+sub+'</p></div></div>'
    + stats + nudge + (function(){ try{ return ovLaunches(ub,pl,m); }catch(e){ console.error('launches',e); return ''; } })()
    + (function(){ try{ return ovThisWeek(); }catch(e){ console.error('this week',e); return ''; } })() + targets + queue + lanes;
}

function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function activeCount(){ try{ return readStores().cards.filter(function(c){return c.col!=='launched';}).length; }catch(e){ return 0; } }
function paintPipeN(){ var n=document.getElementById('pipeN'); if(!n) return; var a=activeCount(); n.textContent=a; n.classList.toggle('show',a>0); }
function renderPipe(){
  var st = readStores(), cards = st.cards;
  cards.forEach(function(c){ c.cold = c.days!=null && c.days>=7 && !c.wait; });
  var ubN = cards.filter(function(c){return c.app==='ub' && c.col!=='launched';}).length, plN = cards.filter(function(c){return c.app==='pl' && c.col!=='launched';}).length;
  var stuck = cards.filter(function(c){return c.over;}).length, wait = cards.filter(function(c){return c.wait;}).length, launched = cards.filter(function(c){return c.col==='launched';}).length;
  paintPipeN();
  // Empty stages collapse to slim rails so the products that DO exist get the screen.
  var HUES = {sourcing:'#22D3EE', validating:'#E879C7', samples:'#3B9EFF', ordered:'#FF8A3D', ready:'#FFC53D', launching:'#4ADE80', launched:'#00E5A0'};
  var byCol = {}; COLS.forEach(function(c){ byCol[c.key]=cards.filter(function(x){return x.col===c.key;}); });
  var card = function(x){ return '<div class="p-card '+x.app+(x.over?' stuck':'')+'" onclick="ovOpen(\''+x.app+'\','+JSON.stringify(String(x.id||'')).replace(/"/g,'&quot;')+')" title="Open in '+(x.app==='ub'?'Unique Bundles':'Private Label')+'">'
      + (x.score!=null?'<span class="sc">'+x.score+'%</span>':'')
      + '<div class="t">'+esc(x.title)+'</div>'
      + '<div class="m"><span class="app-chip '+x.app+'">'+(x.app==='ub'?'UB':'PL')+'</span>'
      + (x.days!=null ? '<span class="d'+(x.over?' over':x.wait?' wait':'')+'">'+(x.wait?'waiting · ':'')+x.days+'d'+(x.over?' · stuck':'')+'</span>' : '')
      + '</div>'+(x.score==null?'<div class="s">'+esc(x.stage)+'</div>':'')+'</div>'; };
  var template = COLS.map(function(c){ return byCol[c.key].length ? 'minmax(200px,1fr)' : '44px'; }).join(' ');
  var cols = COLS.map(function(c){
    var rows = byCol[c.key];
    if(!rows.length) return '<div class="p-col slim c-'+c.key+'" title="'+c.name+' — empty"><span class="c0">0</span><b>'+c.name+'</b></div>';
    rows = rows.slice().sort(function(a,b){ return (b.over?1:0)-(a.over?1:0) || (b.days||0)-(a.days||0); });
    return '<div class="p-col c-'+c.key+'"><div class="p-col-h"><b>'+c.name+'</b><span class="c">'+rows.length+'</span></div>'
      + '<div class="p-cards">'+rows.map(card).join('')+'</div></div>';
  }).join('');
  // the flow bar: the shape of the whole belt in one line
  var flowSegs = COLS.filter(function(c){return byCol[c.key].length;}).map(function(c){
    return '<span style="flex:'+byCol[c.key].length+';background:'+HUES[c.key]+'" title="'+c.name+' · '+byCol[c.key].length+'"></span>'; }).join('');
  var moving = cards.filter(function(x){return x.col!=='launched';}).length;
  var flowRead = moving
    ? '<b>'+moving+'</b> in the pipelines'
      + (stuck?' · <b style="color:#FF8FA3">'+stuck+' stuck</b>':'') + (wait?' · '+wait+' waiting':'')
      + ' · '+(launched?'<b style="color:var(--green)">'+launched+' launched this month</b>':'0 launched this month')
    : 'Nothing in the pipelines yet — promote your best ideas from each app';
  // ── combined monthly KPIs: UB + PL against both apps' targets ──
  var ub2=null, pl2=null;
  try{ ub2=JSON.parse(localStorage.getItem('ub_tracker_v1')||'null'); }catch(e){}
  try{ pl2=JSON.parse(localStorage.getItem('pl_sourcing_v1')||'null'); }catch(e){}
  function tgt(id){ var k=((ub2&&ub2.settings&&ub2.settings.kpis)||[]).filter(function(x){return x.id===id&&x.on!==false;})[0]; return k?(+k.target||0):0; }
  var ubEv=(ub2&&ub2.events)||[];
  var ubIdeas=ubEv.filter(function(e){return e.type==='ideas'&&sameMonth(e.at);}).length;
  var ubMoved=ubEv.filter(function(e){return e.type==='moved'&&sameMonth(e.at);}).length;
  var ubLaunch=ubEv.filter(function(e){return e.type==='launches'&&sameMonth(e.at);}).length;
  var plRows=(pl2&&pl2.ideas)||[];
  var plBS=((pl2&&pl2.brand_state)||[])[0]; plBS=(plBS&&plBS.data)||{};
  var MK=plBS.plMonthlyK||{ideas:12,pipeline:4,launches:1};
  var plIdeas=plRows.filter(function(r){return r.data&&sameMonth(r.data.createdAt)&&!r.data._imported;}).length;
  var plMoved=plRows.filter(function(r){var p=(r.data&&r.data.pipeline)||{};return p.enteredAt&&sameMonth(p.enteredAt);}).length;
  var plLaunch=plRows.filter(function(r){var p=(r.data&&r.data.pipeline)||{};return p.launchedAt&&sameMonth(p.launchedAt);}).length;
  var now=new Date(), mPace=now.getDate()/new Date(now.getFullYear(),now.getMonth()+1,0).getDate();
  function ring(label,a,t,ua,pa,hue){
    var pct=t?Math.min(100,a/t*100):0, R=17, C=2*Math.PI*R, off=C*(1-pct/100);
    var exp=Math.round(t*mPace), st=a>=t?['HIT','ok']:a>=exp?['ON TRACK','ok']:['BEHIND','bad'];
    return '<div class="p-kpi" style="--c:'+hue+'">'
      +'<div class="p-kpi-ring"><svg viewBox="0 0 42 42"><circle cx="21" cy="21" r="'+R+'" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="4.5"/>'
      +'<circle cx="21" cy="21" r="'+R+'" fill="none" stroke="'+hue+'" stroke-width="4.5" stroke-linecap="round" stroke-dasharray="'+C.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'" transform="rotate(-90 21 21)"/></svg>'
      +'<span>'+Math.round(pct)+'<i>%</i></span></div>'
      +'<div class="p-kpi-t"><div class="p-kpi-top"><b>'+label+'</b><span class="p-kpi-b '+st[1]+'">'+st[0]+'</span></div>'
      +'<div class="p-kpi-v">'+a+'<i>/'+t+'</i></div>'
      +'<div class="p-kpi-s">UB '+ua+' · PL '+pa+' · expected '+exp+' by today</div></div></div>';
  }
  // ── the combined movement line: what actually happened across BOTH trackers this week ──
  var wkAgo=monthStart();
  var inWk=function(iso){ if(!iso) return false; var t=new Date(iso).getTime(); return isFinite(t)&&t>=wkAgo; };
  var uEv=(ub2&&ub2.events)||[];
  var wEnter = uEv.filter(function(e){return e.type==='moved'&&inWk(e.at);}).length;
  var wFwd   = uEv.filter(function(e){return e.type==='stage'&&inWk(e.at);}).length;
  var wLaunch= uEv.filter(function(e){return e.type==='launches'&&inWk(e.at);}).length;
  var uEnterW=wEnter, uFwdW=wFwd;
  var wUntouched=((ub2&&ub2.pipeline)||[]).filter(function(p){
    return !((p.hist||[]).some(function(h){ return h&&h[3]&&inWk(h[3]); })); }).length;
  var pEnterW=0,pFwdW=0,pLaunchW=0;
  plRows.forEach(function(r){
    var d2=r.data||{}, pp=d2.pipeline||{};
    if(!d2.inPipeline) return;
    if(pp.enteredAt&&pp.enteredAt>=wkAgo) pEnterW++;
    var hist=pp.history||[];
    if(hist.some(function(h){return h.type==='advance'&&h.ts>=wkAgo;})) pFwdW++;
    if(pp.launchedAt&&pp.launchedAt>=wkAgo) pLaunchW++;
    if(!hist.some(function(h){return h.ts>=wkAgo;})) wUntouched++;
  });
  wEnter+=pEnterW; wFwd+=pFwdW; wLaunch+=pLaunchW;
  var wOk=(wEnter+wFwd+wLaunch)>0;
  var wCell=function(v,l,hot){return '<div class="pw-cell'+(hot&&v?' hot':'')+'"><b>'+v+'</b><span>'+l+'</span></div>';};
  var weekLine='<div class="p-week '+(wOk?'ok':'quiet')+'">'
    +'<div class="pw-verdict">'+(wOk
      ? '✓ Both belts moving — '+wEnter+' entered · '+wFwd+' moved forward this month'
        +' <i>(UB '+uEnterW+'·'+uFwdW+' / PL '+pEnterW+'·'+pFwdW+')</i>'
      : '⚠ Quiet week across both trackers — nothing entered or moved forward')+'</div>'
    +'<div class="pw-cells">'+wCell(wEnter,'entered')+wCell(wFwd,'moved forward')+wCell(wLaunch,'launched')
    +wCell(stuck,'stuck',true)+wCell(wUntouched,'untouched 7d',true)+'</div></div>';

<!-- plub-design-system --><style>
/* ══════════════════════════════════════════════════════════════════════
   PLUB DESIGN SYSTEM — one copy, byte-identical in ub.html, pl.html and
   index.html. If a value needs to change it changes HERE, in all three.
   ══════════════════════════════════════════════════════════════════════ */
:root,[data-theme="dark"],[data-theme="light"]{
  /* ground + surfaces */
  --bg:#030304!important; --surface:#0A0A0C!important;
  --s1:#0A0A0C!important; --s2:#0F0F12!important; --s3:#17171B!important; --s4:#1E1E24!important;
  --sidebar:#050507!important;
  /* lines */
  --b1:#1E1E24!important; --b2:#2A2A31!important; --b3:#3A3A43!important;
  /* type — t4 is the quiet one; PL used to run it 12% brighter than UB */
  --t1:#F5F5F8!important; --t2:#C6C7D0!important; --t3:#9698A4!important; --t4:#787A87!important;
  /* accents */
  --brand:#A78BFF!important; --brand-d:#171425!important; --brand-t:#C4B2FF!important;
  --brand-b:rgba(167,139,255,.45)!important; --brand-h:#B9A3FF!important;
  --accent:#A78BFF!important; --accent2:#22D3EE!important;
  --green:#00E5A0!important; --gd:rgba(0,229,160,.14)!important; --gt:#5FFFC8!important; --gb:rgba(0,229,160,.45)!important;
  --amber:#FFC53D!important; --ad:rgba(255,197,61,.14)!important; --at:#FFDC85!important; --ab:rgba(255,197,61,.45)!important;
  --red:#FF5470!important;   --rd:rgba(255,84,112,.14)!important; --rt:#FF8FA3!important; --rb:rgba(255,84,112,.46)!important;
  --blue:#3B9EFF!important;  --bd:rgba(59,158,255,.14)!important; --bt:#8CC8FF!important; --bb:rgba(59,158,255,.45)!important;
  --purple:#A78BFF!important;--pd:rgba(167,139,255,.14)!important;--pt:#C4B2FF!important;--pb:rgba(167,139,255,.45)!important;
  --cyan:#22D3EE!important;  --cd:rgba(34,211,238,.14)!important; --cb:rgba(34,211,238,.45)!important;
  --orange:#FF8A3D!important;--od:rgba(255,138,61,.14)!important; --ob:rgba(255,138,61,.45)!important;
  --pink:#FF5CC8!important;  --pkd:rgba(255,92,200,.14)!important;--pkb:rgba(255,92,200,.45)!important;
  /* type stack */
  --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif!important;
  --mono:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif!important;
  /* ONE radius scale */
  --r-sm:10px!important; --r-md:12px!important; --r-lg:14px!important; --r-xl:16px!important;
  /* ONE depth scale — PL had none, so its cards sat flat against the page */
  --sh-card:0 8px 24px rgba(0,0,0,.24)!important;
  --sh-hover:0 14px 32px rgba(0,0,0,.40)!important;
  --glow:0 0 0 3px rgba(124,92,255,.18)!important;
  /* motion */
  --ease:cubic-bezier(.4,0,.2,1);
}
html{font-size:13px}

/* ── CHROME: same bar, same rail, in both apps ───────────────────────── */
.topbar,#appTopbar{height:44px!important;min-height:44px!important;padding:0 16px!important;
  background:rgba(3,3,4,.92)!important;border-bottom:1px solid var(--b1)!important;
  display:flex!important;align-items:center!important;gap:8px!important;backdrop-filter:blur(14px)!important}
.sidebar.sb2{width:236px!important;background:var(--sidebar)!important;border-right:1px solid var(--b1)!important}
body.sb-min .sidebar.sb2{width:64px!important}

/* ── THE RAIL, IDENTICAL IN BOTH APPS ─────────────────────────────────
   UB dressed every icon in its own tinted tile; PL did too, in different
   hues. Six competing colours read as noise before they read as navigation.
   Colour now marks the ACTIVE item only, in both apps. */
.sb2 .sn-sec{padding:13px 8px 4px!important;font-size:9px!important;font-weight:800!important;
  letter-spacing:1.5px!important;text-transform:uppercase!important;color:#5E5E6C!important}
.sb2 .sn-sec::after{background:rgba(255,255,255,.06)!important}
.sb2 .sn-nav{padding:4px 10px 6px!important;display:flex;flex-direction:column}
.sb2 .sn-spacer{flex:1;min-height:10px}
.sb2 .nav-item{padding:7px!important;margin-bottom:1px!important;border-radius:10px!important;
  color:#9A9AA8!important;font-size:13px!important;font-weight:650!important}
.sb2 .nav-item:hover{background:rgba(255,255,255,.045)!important;color:#F2F2F6!important}
.sb2 .sn-ic{width:24px!important;height:24px!important;border-radius:7px!important;
  background:transparent!important;color:#75757F!important}
.sb2 .sn-ic svg{width:18px!important;height:18px!important}
.sb2 .nav-item:hover .sn-ic{color:#C6C6D2!important}
.sb2 .nav-item.active{color:#FFFFFF!important;font-weight:800!important;
  background:linear-gradient(90deg,color-mix(in srgb,var(--c) 20%,transparent),color-mix(in srgb,var(--c) 5%,transparent) 72%,transparent)!important}
.sb2 .nav-item.active .sn-ic{background:color-mix(in srgb,var(--c) 20%,transparent)!important;color:var(--c)!important}
.sb2 .nav-item.active::before{top:5px!important;bottom:5px!important;
  box-shadow:0 0 12px color-mix(in srgb,var(--c) 65%,transparent)}
.sb2 .nav-badge{font-size:9.5px!important;padding:2px 6px!important;background:rgba(255,255,255,.05)!important;
  border-color:rgba(255,255,255,.09)!important;color:#8C8C99!important}
.sb2 .nav-item.active .nav-badge{background:color-mix(in srgb,var(--c) 17%,transparent)!important;
  border-color:color-mix(in srgb,var(--c) 40%,transparent)!important;color:var(--c)!important}
.sb2 .sn-mark{background:linear-gradient(135deg,#7C5CFF,#A78BFF)!important}
.sb2 .sn-av{background:linear-gradient(135deg,#7C5CFF,#A78BFF)!important;border-radius:8px!important}
.sb2 .sn-foot{border-top:1px solid rgba(255,255,255,.06)!important}
body.sb-min .sb2 .sn-spacer{display:none}

/* ── PRIMITIVES ──────────────────────────────────────────────────────── */
.btn,.pl-action-btn,.ac2-btn,.tk-type{height:30px;padding:0 12px;border-radius:var(--r-sm)!important;
  font:700 12px var(--sans)!important;background:var(--s3)!important;border:1px solid var(--b2)!important;
  color:var(--t1)!important;cursor:pointer;transition:all .14s var(--ease)}
.btn:hover,.pl-action-btn:hover,.ac2-btn:hover{border-color:var(--b3)!important;background:var(--s4)!important}
/* ONE primary button. PL used a purple->cyan gradient with black text; UB used solid
   purple with white. Two different products in one glance — now they are the same. */
.btn.primary,.btn-primary,.btn.pri,.btn-pri,.imp-btn.primary,.tb-add,.pl-action-btn.primary,
.pl-task-save,.pl-footer-advance,.prod-advance,.ac2-btn.pri{
  background:linear-gradient(180deg,#7C5CFF,#6742F5)!important;
  border:1px solid rgba(167,139,255,.55)!important;color:#FFFFFF!important;
  font-weight:850!important;border-radius:var(--r-sm)!important;
  box-shadow:0 3px 14px rgba(124,92,255,.34)!important;text-shadow:none!important}
.btn.primary:hover,.btn-pri:hover,.tb-add:hover,.pl-action-btn.primary:hover,
.pl-task-save:hover,.pl-footer-advance:hover,.prod-advance:hover{filter:brightness(1.12)}
.btn.sm,.btn-sm{height:26px!important;padding:0 9px!important;font-size:11px!important}
/* Destructive and positive variants. The .btn rule above uses !important, which
   flattened .btn.danger to the same grey as Cancel — so "Yes, delete it" and
   "Cancel" looked identical in every confirm dialog. These restore the meaning. */
.btn.danger,.btn-danger,.prod-reject,.pl-action-btn.danger,.tsk-danger{
  background:rgba(255,84,112,.11)!important;border:1px solid rgba(255,84,112,.42)!important;
  color:#FF93A6!important;font-weight:800!important}
.btn.danger:hover,.btn-danger:hover,.prod-reject:hover,.pl-action-btn.danger:hover{
  background:rgba(255,84,112,.24)!important;border-color:rgba(255,84,112,.65)!important;color:#fff!important}
.btn.success,.btn-success,.pl-action-btn.success{
  background:rgba(0,229,160,.11)!important;border:1px solid rgba(0,229,160,.42)!important;
  color:#5CE6B0!important;font-weight:800!important}
.btn.success:hover,.btn-success:hover{background:rgba(0,229,160,.24)!important;color:#fff!important}
.btn.warn,.btn-warn,.pl-action-btn.warn{
  background:rgba(255,197,61,.11)!important;border:1px solid rgba(255,197,61,.42)!important;
  color:#FFD066!important;font-weight:800!important}
.btn.warn:hover,.btn-warn:hover{background:rgba(255,197,61,.24)!important;color:#fff!important}
.btn.ghost,.btn-ghost{background:transparent!important;border:1px solid var(--b2)!important;color:var(--t3)!important}
.btn.ghost:hover,.btn-ghost:hover{background:rgba(255,255,255,.05)!important;color:var(--t1)!important}
/* every confirm dialog gets the same shell */
#delOverlay>div,#rejectOverlay>div,#bulkOverlay>div,#exportOverlay>div,#modal,.pl-quick-panel{
  border-radius:var(--r-xl)!important;background:var(--s1)!important;border:1px solid var(--b2)!important;
  box-shadow:0 30px 90px rgba(0,0,0,.6),0 0 0 1px rgba(167,139,255,.06)!important}

.btn.lg{height:36px!important;padding:0 16px!important;font-size:13px!important}

/* eyebrows: flat muted caps in both apps. PL's gradient-clipped text was the single
   most obvious "different app" tell on every page header. */
.eyebrow,.page-eyebrow,.pl-eyebrow,.ac2-eyebrow,.p-eyebrow{
  font:850 9.5px var(--sans)!important;letter-spacing:1.6px!important;text-transform:uppercase!important;
  background:none!important;-webkit-background-clip:border-box!important;background-clip:border-box!important;
  color:var(--t4)!important}
.page-title,.p-title{font-size:21px!important;font-weight:850!important;letter-spacing:-.6px!important;color:var(--t1)!important}
.page-sub,.p-sub{font-size:12px!important;color:var(--t3)!important}
.page-hd,.page-head{margin-bottom:12px!important;padding-bottom:10px!important;border-color:var(--b1)!important}

input,select,textarea{font-family:var(--sans)!important;background:var(--s2)!important;
  border:1px solid var(--b2)!important;color:var(--t1)!important;border-radius:var(--r-sm)!important}
input:focus,select:focus,textarea:focus{outline:0!important;border-color:var(--brand)!important;box-shadow:var(--glow)!important}

/* ── SHARED COMPONENTS ────────────────────────────────────────────────
   Used by the Overview AND by each app's Action Centre, so switching tabs
   shows the same stat card, the same target bar and the same ranked queue
   rather than three dialects of the same idea. */
.ov-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:9px;margin-bottom:11px}
.ov-stat{display:flex;gap:11px;align-items:center;border:1px solid var(--b1);border-radius:var(--r-md);
  padding:11px 13px;background:var(--s1);box-shadow:var(--sh-card)}
.ov-si{flex:none;width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:var(--c);
  background:color-mix(in srgb,var(--c) 14%,transparent);border:1px solid color-mix(in srgb,var(--c) 34%,transparent)}
.ov-si svg{width:17px;height:17px}
.ov-stat b{display:block;font-size:21px;font-weight:850;color:var(--t1);line-height:1.05;letter-spacing:-.7px;font-variant-numeric:tabular-nums}
.ov-sl{display:block;font-size:11px;font-weight:800;color:var(--t2);margin-top:2px}
.ov-ss{display:block;font-size:10px;color:var(--t4);margin-top:1px}
.ov-card{border:1px solid var(--b1);border-radius:var(--r-lg);background:var(--s1);
  box-shadow:var(--sh-card);margin-bottom:11px;overflow:hidden}
.ov-card-h{display:flex;align-items:baseline;gap:10px;padding:13px 16px 11px;border-bottom:1px solid var(--b1)}
.ov-card-h h3{margin:0;font-size:14px;font-weight:850;color:var(--t1);letter-spacing:-.2px}
.ov-card-s{font-size:11px;color:var(--t4);margin-left:auto}
.ov-ts{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;padding:14px 16px}
.ov-t-h{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:6px}
