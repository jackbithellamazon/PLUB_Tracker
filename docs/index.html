<script>
/* PLUB ONLINE storage shim — runs before anything else on the page. The local version and the online one live on the
   same web address, so they'd share browser storage. Every PLUB key is quietly stored under a plubc_ name instead,
   so the online copy can never touch the local copy (kept 30 days as the fallback). The apps don't notice. */
(function(){
  var MAP={plub_v1:1,plub_who:1,plub_mode:1,plub_outbox_v1:1,ubpl_shell_tab:1,plub_rail_min:1,plub_ov_view:1,plub_ov_filter:1,
    ub_tracker_v1:1,ub_tracker_lock:1,ub_sb_min:1,ub_last_report:1,ub_last_backup:1,pl_sourcing_v1:1,pls_theme:1,pls_draft:1,pl_sb_min:1,
    plub_last_full_export:1,plub_golive_v1:1,plub_build_seen:1};
  var DYN=/^(ub_tracker_v1__|pl_sourcing_v1_quarantine_)/;
  function to(k){ k=String(k); return (MAP[k]||DYN.test(k))?'plubc_'+k:k; }
  function from(k){ return (k&&k.indexOf('plubc_')===0&&(MAP[k.slice(6)]||DYN.test(k.slice(6))))?k.slice(6):k; }
  var P=Storage.prototype, g=P.getItem, s=P.setItem, r=P.removeItem, kf=P.key;
  P.getItem=function(k){ return g.call(this,to(k)); };
  P.setItem=function(k,v){ return s.call(this,to(k),v); };
  P.removeItem=function(k){ return r.call(this,to(k)); };
  P.key=function(i){ return from(kf.call(this,i)); };
  var add=window.addEventListener;
  window.addEventListener=function(type,fn,opt){
    if(type!=='storage'||typeof fn!=='function') return add.call(this,type,fn,opt);
    return add.call(this,type,function(e){ fn({key:from(e.key),newValue:e.newValue,oldValue:e.oldValue,storageArea:e.storageArea,url:e.url}); },opt);
  };
  window.PLUB_ONLINE=true;
})();
</script>

<script>
/* First load of v1.00: copy PLUB's saved data exactly as the previous version left it, before anything on this page
   (the shared core, or either app as it loads) can bring it up to date. Memory only — the shared browser storage is too
   full for a second copy — and it rides along inside "Export everything" as before_update. Same key list as PD_KEYS. */
window.__plubPre=(function(){ try{
  if(localStorage.getItem('plub_build_seen')==='1.00') return null;
  var list=['plub_v1','plub_who','plub_mode','plub_outbox_v1','ubpl_shell_tab','plub_rail_min','plub_ov_view','plub_ov_filter',
    'ub_tracker_v1','ub_sb_min','ub_last_report','ub_last_backup','pl_sourcing_v1','pls_theme','pls_draft','pl_sb_min'];
  var o={}, n=0;
  for(var i=0;i<localStorage.length;i++){ var k=localStorage.key(i); if(k&&(list.indexOf(k)>=0||/^(ub_tracker_v1__|pl_sourcing_v1_quarantine_)/.test(k))){ o[k]=localStorage.getItem(k); n++; } }
  try{ localStorage.setItem('plub_build_seen','1.00'); }catch(e){}
  return n?{captured_at:new Date().toISOString(),keys:o}:null;
}catch(e){ return null; } })();
</script>

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#030304;--s1:#0A0A0C;--s2:#0F0F12;--s3:#17171B;--b1:#1E1E24;--b2:#2A2A31;--b3:#3A3A43;--t1:#F5F5F8;--t2:#C6C7D0;--t3:#9698A4;--t4:#787A87;

html,body{height:100%;background:var(--bg);color:var(--t1);font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;overflow:hidden;font-size:13px}
/* ── bar ── */
.bar{position:fixed;inset:0 0 auto 0;height:40px;display:flex;align-items:center;gap:10px;padding:0 12px;background:var(--bg);border-bottom:1px solid #15151A;z-index:10}

.mark .tile svg{width:15px;height:15px}
.mark b{font-size:13.5px;font-weight:800;letter-spacing:-.4px;white-space:nowrap;background:linear-gradient(90deg,#C4B2FF,#7FE9F5);-webkit-background-clip:text;background-clip:text;color:transparent}
.mark span{font-size:10.5px;color:var(--t4);white-space:nowrap;margin-left:2px}
.tabs{display:flex;gap:2px;background:#0B0B0E;border:1px solid #1A1A20;border-radius:10px;padding:2px}
.tab{appearance:none;border:none;background:none;cursor:pointer;color:#9A9AA6;font:600 12px/1 'Inter',sans-serif;padding:7px 12px;border-radius:8px;display:flex;align-items:center;gap:7px;transition:color .15s cubic-bezier(.4,0,.2,1),background .15s cubic-bezier(.4,0,.2,1),transform .1s cubic-bezier(.4,0,.2,1)}
.tab:active{transform:scale(.96)}
.tab i{width:7px;height:7px;border-radius:50%;font-style:normal;flex:none;background:#34343D;transition:background .15s}
.tab.on{color:#fff;background:#17171E}
.tab.on.ub i{background:var(--cyan)} .tab.on.pl i{background:var(--violet)} .tab.on.pipe i{background:var(--green)}
.tab .n{font-size:9.5px;font-weight:800;padding:1px 5px;border-radius:999px;background:#1E1E26;color:var(--t3);display:none} .tab .n.show{display:inline-block}
.right{margin-left:auto;display:flex;align-items:center;gap:8px}

/* ── stage ── */
.stage{position:fixed;inset:40px 0 0 0}
/* instant cut between apps: both frames stay painted underneath, only the z-order changes — no crossfade, no repaint, nothing to blink */
iframe{position:absolute;inset:0;width:100%;height:100%;border:none;background:var(--bg);display:block;pointer-events:none;z-index:1}
iframe.show{pointer-events:auto;z-index:3}

#pipe{position:absolute;inset:0;display:none;overflow:auto;padding:18px 22px 40px;background:var(--bg);z-index:2}
#pipe.show{z-index:3}
#pipe.leaving{display:none}
#pipe.show{display:block}
.p-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:12px}

.ov-people{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:10px;margin-bottom:10px}

.p-card{margin-bottom:0!important}
body.nobar .bar{display:none}
body.nobar .stage{inset:0}
.p-col{background:var(--s1);border:1px solid var(--b1);border-radius:12px;padding:9px 9px 8px;border-top:2px solid var(--b2);min-height:140px}
.p-col.slim{min-height:140px;padding:8px 0;display:flex;flex-direction:column;align-items:center;gap:8px;background:transparent;border-style:dashed;border-top-style:solid;opacity:.65}

.p-col-h .c{font-size:10.5px;font-weight:800;color:var(--t3);background:var(--s3);border:1px solid var(--b2);border-radius:999px;padding:1px 7px;font-variant-numeric:tabular-nums}
.p-col.c-sourcing{border-top-color:var(--cyan)} .p-col.c-validating{border-top-color:var(--pink)} .p-col.c-samples{border-top-color:var(--blue)} .p-col.c-ordered{border-top-color:var(--orange)} .p-col.c-ready{border-top-color:var(--amber)} .p-col.c-launching{border-top-color:#4ADE80} .p-col.c-launched{border-top-color:var(--green);background:color-mix(in srgb,var(--green) 6%,var(--s1))}

<!-- plub-core --><script>
/* ══════════════════════════════════════════════════════════════════════
   PLUB CORE — identity, activity, sessions, tasks, work types, settings.
   One copy, byte-identical in index.html, ub.html and pl.html.

   THIS WEEKEND: everything lives in localStorage under club_v1 (shared by
   the shell and both frames — same origin). Cross-frame changes arrive via
   the `storage` event, so a task sent from PL shows in UB without a reload.

   MONDAY: CLUB.sync.enable(supabaseClient) pulls the seven tables, then
   every write also upserts. The local store stays as the cache. Same rows,
   same shape as the SQL in  CLUB - 1 - Supabase setup.sql.
   ══════════════════════════════════════════════════════════════════════ */
window.CLUB = (function(){
  var KEY='plub_v1', WHO='plub_who', MODE='plub_mode', OUTBOX='plub_outbox_v1';
  var COLS=['users','activity','sessions','tasks','task_notes','work_types'];
  var DEF_USERS=[
    {id:'jack',  display_name:'Jack',  role:'owner', active:true},
    {id:'becki', display_name:'Becki', role:'staff', active:true}];
  /* The five session types (UK staff spec, 9 Sept 2026). Sourcing Hours is the time spent
     finding AND building a new product — discovery, research, suppliers and getting the
     listing ready. Growth & Optimisation is deliberately outside it: by then the product is
     launched and proven, so that time is improving an existing product, not building a new one.
     It is still timed and reported, just not against the KPI. */
  var WT_VERSION=2;
  var DEF_WT=[
    {key:'fresh',     label:'Fresh sourcing',         sort:10, active:true, counts_as_sourcing:true,
     hint:'New product ideas and opportunities \u2014 market research, competitor discovery, browsing'},
    {key:'research',  label:'Research & validation',  sort:20, active:true, counts_as_sourcing:true,
     hint:'Is this idea worth progressing \u2014 demand, competitors, pricing, margin, differentiation'},
    {key:'suppliers', label:'Suppliers & purchasing', sort:30, active:true, counts_as_sourcing:true,
     hint:'Finding and contacting suppliers, quotes, trade pricing, MOQs, samples, freight, purchasing'},
    {key:'listing',   label:'Listing & creative',     sort:40, active:true, counts_as_sourcing:true,
     hint:'Keyword and competitor listing research, images, A+ content, building the listing'},
    {key:'growth',    label:'Growth & optimisation',  sort:50, active:true, counts_as_sourcing:false,
     hint:'Improving a product that is already live \u2014 PPC, SEO, conversion, pricing tests'}];
  /* Every key either app has ever written maps onto the five, so no logged hour is lost and
     no session history reads as blank. */
  var LEGACY={ ideas:'fresh', working:'research', validate:'research',
    supplier:'suppliers', contact:'suppliers', pricing:'suppliers',
    images:'listing', pipeline:'research', ppc:'growth', optimise:'growth' };

  var S=null;
  function load(){
    var raw=null; try{ raw=localStorage.getItem(KEY); }catch(e){}
    try{ S=raw?JSON.parse(raw):null; }catch(e){ S=null; }
    if(!S||typeof S!=='object') S={schema:1};
    COLS.forEach(function(c){ if(!Array.isArray(S[c])) S[c]=[]; });
    if(!S.settings||typeof S.settings!=='object') S.settings={};
    if(!S.users.length) S.users=DEF_USERS.map(function(u){return Object.assign({},u);});
    // upgrade an older stored list in place — a saved copy of the previous eight would
    // otherwise keep the old options on screen for ever
    if(!S.work_types.length || (S.wt_version||1) < WT_VERSION){
      S.work_types=DEF_WT.map(function(w){return Object.assign({},w);}); S.wt_version=WT_VERSION;
    }
  }
  load();
  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} notify(); }
  function uuid(){ try{ if(crypto&&crypto.randomUUID) return crypto.randomUUID(); }catch(e){}
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,function(c){var r=Math.random()*16|0;return (c==='x'?r:(r&3|8)).toString(16);}); }
  function now(){ return new Date().toISOString(); }
  function mode(){ try{ return localStorage.getItem(MODE)||'local'; }catch(e){ return 'local'; } }

  /* ── identity ─────────────────────────────────────────────────────── */
  function whoId(){ try{ return localStorage.getItem(WHO)||''; }catch(e){ return ''; } }
  function user(){ var id=whoId(); return S.users.filter(function(u){return u.id===id;})[0]||null; }
  function users(){ return S.users.filter(function(u){return u.active!==false;}); }
  function setWho(id){ try{ localStorage.setItem(WHO,id); }catch(e){} notify(); }
  function signOut(){ try{ localStorage.removeItem(WHO); }catch(e){} notify(); }
  function byId(id){ return S.users.filter(function(u){return u.id===id;})[0]||null; }
  function nameOf(id){ var u=byId(id); return u?u.display_name:(id||'?'); }

  /* ── generic rows ─────────────────────────────────────────────────── */
  function add(col,row){ row.id=row.id||uuid(); row.created_at=row.created_at||now(); S[col].push(row); save(); push(col,row); return row; }
  function update(col,id,patch){ var r=S[col].filter(function(x){return x.id===id;})[0]; if(!r) return null;
    Object.keys(patch).forEach(function(k){ r[k]=patch[k]; }); r.updated_at=now(); save(); push(col,r); return r; }
  function all(col){ return S[col].slice(); }

  /* ── activity: the audit log ──────────────────────────────────────── */
  function log(kind,o){
    o=o||{}; var u=user();
    var row={ id:uuid(), at:now(), actor_id:u?u.id:null, actor_name:u?u.display_name:(whoId()||'?'),
      app:o.app||'club', kind:kind,
      entity_kind:o.entity_kind||null, entity_ref:(o.entity_ref!=null?String(o.entity_ref):null),
      entity_name:o.entity_name||null, from_val:o.from!=null?String(o.from):null, to_val:o.to!=null?String(o.to):null,
      mins:(typeof o.mins==='number')?Math.round(o.mins):null, session_id:o.session_id||null, detail:o.detail||{} };
    S.activity.push(row);
    if(S.activity.length>6000) S.activity=S.activity.slice(-5000);   // local cap; the DB keeps everything
    save(); push('activity',row); return row;
  }

  /* ── sessions: time by type of work ───────────────────────────────── */
  function workTypes(activeOnly){ var w=S.work_types.slice().sort(function(a,b){return (a.sort||0)-(b.sort||0);});
    return activeOnly===false? w : w.filter(function(x){return x.active!==false;}); }
  function wtKey(k){ k=k||'fresh'; return LEGACY[k]||k; }
  function wtLabel(k){ k=wtKey(k); var w=S.work_types.filter(function(x){return x.key===k;})[0]; return w?w.label:k; }
  function wtHint(k){ k=wtKey(k); var w=S.work_types.filter(function(x){return x.key===k;})[0]; return (w&&w.hint)||''; }
  // does this type count toward the Sourcing Hours KPI? unknown keys count, so nothing is lost silently
  function wtCounts(k){ k=wtKey(k); var w=S.work_types.filter(function(x){return x.key===k;})[0]; return w? w.counts_as_sourcing!==false : true; }
  function saveWorkTypes(list){ S.work_types=list; save(); }
  function sessionStart(app,work_type,note){
    var u=user(); var row=add('sessions',{ user_id:u?u.id:null, app:app, work_type:wtKey(work_type), started_at:now(), ended_at:null, mins:null, note:note||'', entity_refs:[] });
    log('session_start',{app:app, entity_kind:'session', entity_ref:row.id, to:wtLabel(work_type), session_id:row.id});
    return row;
  }
  function sessionEnd(id,o){ o=o||{}; var r=S.sessions.filter(function(x){return x.id===id;})[0]; if(!r) return null;
    r.ended_at=now(); r.mins=(typeof o.mins==='number')?Math.max(0,Math.round(o.mins)):Math.max(0,Math.round((Date.now()-new Date(r.started_at).getTime())/60000));
    if(o.note) r.note=o.note; if(o.entity_refs) r.entity_refs=o.entity_refs; save(); push('sessions',r);
    log('session_end',{app:r.app, entity_kind:'session', entity_ref:r.id, to:wtLabel(r.work_type), mins:r.mins, session_id:r.id}); return r; }
  function sessionQuick(app,work_type,mins,note){
    var u=user(); var t=now();
    var row=add('sessions',{ user_id:u?u.id:null, app:app, work_type:wtKey(work_type), started_at:t, ended_at:t, mins:Math.max(0,Math.round(mins)), note:note||'', entity_refs:[] });
    log('session_logged',{app:app, entity_kind:'session', entity_ref:row.id, to:wtLabel(work_type), mins:row.mins, session_id:row.id}); return row; }
  function sessionsFor(userId,sinceMs,untilMs){ return S.sessions.filter(function(s){ var t=new Date(s.started_at).getTime();
    return (!userId||s.user_id===userId) && (sinceMs==null||t>=sinceMs) && (untilMs==null||t<untilMs); }); }

  /* ── tasks between people ─────────────────────────────────────────── */
  function taskAdd(o){
    var u=user(); var row=add('tasks',{ title:o.title, type:o.type||'general', url:o.url||null, brief:o.brief||null,
      priority:o.priority||'normal', status:'not_started', created_by:u?u.id:null, assigned_to:o.assigned_to||(u?u.id:null),
      due:o.due||null, related_app:o.related_app||null, related_ref:o.related_ref!=null?String(o.related_ref):null,
      related_name:o.related_name||null, completed_at:null, completed_by:null, updated_at:now() });
    log('task_assigned',{app:o.related_app||'club', entity_kind:'task', entity_ref:row.id, entity_name:row.title, to:nameOf(row.assigned_to),
      detail:{related_ref:row.related_ref, related_name:row.related_name}});
    return row; }
  function taskStatus(id,status){ var u=user(); var r=update('tasks',id,{ status:status,
      completed_at:status==='done'?now():null, completed_by:status==='done'?(u?u.id:null):null });
    if(r) log(status==='done'?'task_done':'task_status',{app:r.related_app||'club', entity_kind:'task', entity_ref:r.id, entity_name:r.title, to:status});
    return r; }
  function taskNote(id,text){ var u=user(); var r=S.tasks.filter(function(x){return x.id===id;})[0]; if(!r) return null;
    var n=add('task_notes',{ task_id:id, who_id:u?u.id:null, who_name:u?u.display_name:'?', text:text, at:now() });
    log('task_note',{app:r.related_app||'club', entity_kind:'task', entity_ref:id, entity_name:r.title}); return n; }
  function tasksFor(userId,o){ o=o||{}; return S.tasks.filter(function(t){
    return !t.deleted_at && (!userId||t.assigned_to===userId) && (o.all||t.status!=='done'); })
    .sort(function(a,b){ var P={urgent:0,high:1,normal:2,low:3}; return (P[a.priority]-P[b.priority])||(a.due||'9').localeCompare(b.due||'9'); }); }
  function taskNotes(id){ return S.task_notes.filter(function(n){return n.task_id===id;}); }

  /* ── shared settings ──────────────────────────────────────────────── */
  function setting(key,val){ if(val===undefined) return S.settings[key]; S.settings[key]=val; save(); push('settings',{key:key,value:val}); return val; }

  /* ── "what happened?" ─────────────────────────────────────────────── */
  function activityBetween(sinceMs,untilMs,userId){ return S.activity.filter(function(a){ var t=new Date(a.at).getTime();
    return t>=sinceMs && (untilMs==null||t<untilMs) && (!userId||a.actor_id===userId); }); }
  function summarise(sinceMs,untilMs){
    var out={};
    users().forEach(function(u){
      var acts=activityBetween(sinceMs,untilMs,u.id), sess=sessionsFor(u.id,sinceMs,untilMs).filter(function(s){return s.mins!=null;});
      var byType={}; sess.forEach(function(s){ byType[s.work_type]=(byType[s.work_type]||0)+(s.mins||0); });
      var count=function(k){ return acts.filter(function(a){return a.kind===k;}).length; };
      out[u.id]={ user:u, sessions:sess.length, mins:sess.reduce(function(a,s){return a+(s.mins||0);},0), byType:byType,
        ideas_added:count('idea_added'), ideas_updated:count('idea_updated'), moved:count('stage'), entered:count('entered_pipeline'),
        launched:count('launched'), dropped:count('dropped'), suppliers:count('supplier_added')+count('supplier_contacted'),
        samples:count('sample_added')+count('sample_ordered')+count('sample_received'), tasks_done:count('task_done'),
        tasks_assigned:count('task_assigned'), opened:count('product_opened'), notes:count('note'), acts:acts };
    });
    return out;
  }

  /* ── cross-frame + subscribers ────────────────────────────────────── */
  var subs=[]; function on(fn){ subs.push(fn); } function notify(){ subs.forEach(function(f){ try{ f(); }catch(e){} }); }
  try{ window.addEventListener('storage',function(e){ if(e.key===KEY||e.key===WHO||e.key===MODE){ load(); notify(); } }); }catch(e){}

  /* ── Supabase sync (Monday). Dormant until enable() is called. ───── */
  var sb=null, outbox=[];
  try{ outbox=JSON.parse(localStorage.getItem(OUTBOX)||'[]'); }catch(e){ outbox=[]; }
  var TABLE={users:'bdl_plub_users',activity:'bdl_plub_activity',sessions:'bdl_plub_sessions',tasks:'bdl_plub_tasks',
             task_notes:'bdl_plub_task_notes',work_types:'bdl_plub_work_types',settings:'bdl_plub_settings'};
  function push(col,row){ if(mode()!=='supabase') return; outbox.push({col:col,row:row,at:Date.now()});
    try{ localStorage.setItem(OUTBOX,JSON.stringify(outbox.slice(-2000))); }catch(e){} flush(); }
  var flushing=false;
  function flush(){ if(!sb||flushing||!outbox.length) return; flushing=true;
    var item=outbox[0]; var t=TABLE[item.col]; var row=Object.assign({},item.row);
    if(item.col==='activity'){ delete row.id; }            // identity column server-side
    var q= item.col==='settings' ? sb.from(t).upsert({key:row.key,value:row.value},{onConflict:'key'})
         : item.col==='work_types' ? sb.from(t).upsert(row,{onConflict:'key'})
         : sb.from(t).upsert(row,{onConflict:'id'});
    q.then(function(res){ if(res&&res.error){ console.warn('club sync',res.error); flushing=false; return; }
      outbox.shift(); try{ localStorage.setItem(OUTBOX,JSON.stringify(outbox)); }catch(e){} flushing=false; flush(); })
     .catch(function(err){ console.warn('club sync',err); flushing=false; });
  }
  function enable(client){ sb=client; try{ localStorage.setItem(MODE,'supabase'); }catch(e){}
    // initial pull: server rows merge over local by id; local-only rows are then pushed
    var cols=Object.keys(TABLE);
    return Promise.all(cols.map(function(c){ return sb.from(TABLE[c]).select('*').then(function(res){ return {c:c,rows:(res&&res.data)||[]}; }); }))
      .then(function(parts){
        parts.forEach(function(p){
          if(p.c==='settings'){ p.rows.forEach(function(r){ S.settings[r.key]=r.value; }); return; }
          var byId={}; S[p.c].forEach(function(r){ byId[r.id||r.key]=r; });
          p.rows.forEach(function(r){ byId[r.id||r.key]=r; });
          S[p.c]=Object.keys(byId).map(function(k){return byId[k];});
        });
        save(); flush();
      });
  }
  function disable(){ sb=null; try{ localStorage.setItem(MODE,'local'); }catch(e){} }

  /* ── this month, both sides: read straight from the two trackers' stores (same origin) ── */
  function monthBoth(){
    var now=new Date(), ws=new Date(now.getFullYear(),now.getMonth(),1).getTime(), me=new Date(now.getFullYear(),now.getMonth()+1,1).getTime();
    var inM=function(t){ t=(typeof t==='number')?t:(t?new Date(t).getTime():0); return isFinite(t)&&t>=ws&&t<me; };
    var out={ub:null,pl:null};
    try{ var ub=JSON.parse(localStorage.getItem('ub_tracker_v1')||'null'); if(ub){
      var mins=(ub.sessionLog||[]).filter(function(x){return inM(x.date) && wtCounts(x.type);}).reduce(function(a,x){return a+(x.mins||0);},0);
      if(ub.session&&ub.session.start>=ws) mins+=Math.max(0,Math.round((Date.now()-ub.session.start)/60000));
      var kh=((ub.settings&&ub.settings.kpis)||[]).filter(function(k){return k.id==='hours';})[0]; var ev=ub.events||[];
      out.ub={hrs:mins/60, tgt:(kh&&kh.target)||32, active:(ub.pipeline||[]).length,
        moved:ev.filter(function(e){return e.type==='stage'&&inM(e.at);}).length,
        launched:ev.filter(function(e){return e.type==='launches'&&inM(e.at);}).length}; } }catch(e){}
    try{ var pl=JSON.parse(localStorage.getItem('pl_sourcing_v1')||'null'); if(pl){
      var B=(pl.brand_state&&pl.brand_state[0]&&pl.brand_state[0].data)||{};
      var m2=(B.plSess||[]).filter(function(x){return inM(x.at) && wtCounts(x.kind);}).reduce(function(a,x){return a+(x.mins||0);},0);
      if(B.plRun&&B.plRun.start>=ws) m2+=Math.max(0,Math.round((Date.now()-B.plRun.start)/60000));
      var moved=0,launched=0,active=0;
      (pl.ideas||[]).forEach(function(r){ var i=r.data||{}, p=i.pipeline||{}; if(p.launchedAt&&inM(p.launchedAt)) launched++;
        if(!i.inPipeline||p.status==='rejected'||p.status==='launched') return; active++;
        if((p.history||[]).some(function(x){return inM(x.ts)&&(x.type==='advance'||x.type==='launch');})) moved++; });
      out.pl={hrs:m2/60, tgt:(typeof B.plMonthlyHours==='number'?B.plMonthlyHours:(typeof B.plWeeklyHours==='number'?Math.round(B.plWeeklyHours*52/12):87)), active:active, moved:moved, launched:launched}; } }catch(e){}
    return out;
  }
  function railMonthHtml(){
    var m=monthBoth(); var fh=function(h){ return h>=10?Math.round(h)+'h':(Math.round(h*10)/10)+'h'; };
    var row=function(d,who,app,col){
      if(!d) return '<div class="snm-row off"><i style="--av:'+col+'">'+who[0]+'</i><b>'+who+'</b><span>'+app+'</span><em>not opened</em></div>';
      var pct=d.tgt>0?Math.min(100,Math.round(d.hrs/d.tgt*100)):0;
      return '<div class="snm-row"><i style="--av:'+col+'">'+who[0]+'</i><b>'+who+'</b><span>'+app+'</span><em>'+fh(d.hrs)+' <u>/ '+fh(d.tgt)+'</u></em></div><div class="snm-bar" style="--c:'+col+'"><s style="width:'+pct+'%"></s></div>'; };
    var n=function(k){ return ((m.ub&&m.ub[k])||0)+((m.pl&&m.pl[k])||0); };
    return '<div class="snm-h">This month<span>both sides</span></div>'+row(m.ub,'Becki','UB','#00E5A0')+row(m.pl,'Jack','PL','#A78BFF')
      +'<div class="snm-foot"><b>'+n('active')+'</b> active · <b>'+n('moved')+'</b> moved · <b>'+n('launched')+'</b> launched</div>';
  }

  return { mode:mode, user:user, users:users, setWho:setWho, signOut:signOut, nameOf:nameOf, byId:byId,
    log:log, activityBetween:activityBetween, summarise:summarise,
    workTypes:workTypes, wtKey:wtKey, wtLabel:wtLabel, wtHint:wtHint, wtCounts:wtCounts, saveWorkTypes:saveWorkTypes,
    sessionStart:sessionStart, sessionEnd:sessionEnd, sessionQuick:sessionQuick, sessionsFor:sessionsFor,
    taskAdd:taskAdd, taskStatus:taskStatus, taskNote:taskNote, tasksFor:tasksFor, taskNotes:taskNotes,
    setting:setting, all:all, add:add, update:update, on:on, reload:function(){ load(); notify(); },
    sync:{ enable:enable, disable:disable, flush:flush, pending:function(){ return outbox.length; } },
    monthBoth:monthBoth, railMonthHtml:railMonthHtml,
    _dump:function(){ return JSON.parse(JSON.stringify(S)); } };
})();

</script>

<script id="plub-online-libs">
/* ═══════ PLUB records — split each app's saved blob into rows the cloud can merge one by one ═══════
   A row is {app, coll, id, data}. Lists of things with an id become one row per thing, so Jack editing an idea and
   Becki editing a task never touch the same row. Everything else is one row per field. Per-person / per-laptop state
   (a running session timer, a half-typed draft, sidebar collapsed, which tab was open) never leaves the laptop.
   compose(rows, local) rebuilds the exact blob the app expects; the local copy supplies anything that stays local. */
(function(root){

/* ═══════ PLUB COMBINE — turn Jack's and Becki's "Export everything" files into one set of cloud rows ═══════
   Agreed rules (23 Oct 2026):
     · Unique Bundles: Becki's laptop is the owner — her settings win, her copy wins a tie
     · Private Label and the shared tasks/sessions: Jack's laptop is the owner
     · the same thing on both laptops (same id, same content) is kept once
     · the same id holding DIFFERENT things (UB numbers are per laptop) → the other laptop's one gets a new number,
       and every link to it (ideaId, pipeId, vendorId, sessionId, entityId) is updated
     · the same task imported on both laptops under different numbers → kept once, the copy with more progress
     · nothing is dropped without appearing in the report */
(function(root){
  var R=root.PLUBRecords;
  var OWNER={ub:'becki',pl:'jack',club:'jack'};
  var KEY={ub:'ub_tracker_v1',pl:'pl_sourcing_v1',club:'plub_v1'};
  var REFS={ideaId:'ideas',pipeId:'pipeline',vendorId:'vendors',sessionId:'sessionLog'};
  var DONE_RANK={done:3,complete:3,completed:3,in_process:2,in_progress:2,waiting:1,not_started:0};

  function clone(v){ return v==null?v:JSON.parse(JSON.stringify(v)); }
  function who(f){ var id=String(f.exported_by_id||f.exported_by||'').toLowerCase(); return id.indexOf('becki')>=0?'becki':id.indexOf('jack')>=0?'jack':id; }
  function stamp(d){
    if(!d||typeof d!=='object') return '';
    var own=String(d.updatedAt||d.updated_at||d.doneAt||d.modified||d.created_at||d.created||d.createdAt||'');
    var inner=d.data&&typeof d.data==='object'?stamp(d.data):'';      // a PL row keeps its edit time inside .data
    return inner>own?inner:own;
  }
  function Name(p){ return p?p.charAt(0).toUpperCase()+p.slice(1):p; }
  function progress(t){ return (t&&DONE_RANK[t.status])||0; }
  // what makes two UB records "the same thing" even when their numbers differ (or match by accident)
  var SIG={
    tasks:      function(t){ return [t.title||'',t.brief||'',t.created||'',t.type||''].join('\u0001'); },
    ideas:      function(i){ return [i.title||'',i.created||'',i.asin||''].join('\u0001'); },
    pipeline:   function(p){ return [p.title||'',p.createdAt||p.entered||'',p.ideaId||''].join('\u0001'); },
    inbox:      function(c){ return [c.asin||'',c.searchUrl||'',c.created||c.at||''].join('\u0001'); },
    storefronts:function(f){ return [f.url||'',f.name||''].join('\u0001'); },
    vendors:    function(v){ return [String(v.name||'').toLowerCase(),String(v.company||'').toLowerCase()].join('\u0001'); }
  };
  var SEEDED=['seasons','rankQs'];   // come pre-filled on every laptop with the same numbers — same number IS the same thing
  function better(a,b,coll){ if(coll==='tasks'){ var pa=progress(a), pb=progress(b); if(pa!==pb) return pa>pb?a:b; } return stamp(a)>=stamp(b)?a:b; }

  function rowsOf(file,app){
    var raw=file.keys&&file.keys[KEY[app]]; if(!raw) return [];
    var blob; try{ blob=JSON.parse(raw); }catch(e){ return []; }
    return R.decompose(app,blob);
  }
  function nextUbId(used,digit){ var b=Math.max(Date.now(),0); var id; do{ id=String(b*10+digit); b++; }while(used[id]); used[id]=1; return id; }

  function combine(files, owners){
    var OWN=Object.assign({},OWNER,owners||{});   // the online Import passes {ub:'cloud',…} so what's already online leads
    var people={}; files.forEach(function(f){ people[who(f)]=f; });
    var report={people:Object.keys(people),apps:{},notes:[]};
    var out=[];
    ['ub','pl','club'].forEach(function(app){
      var ownerName=OWN[app], owner=people[ownerName], others=Object.keys(people).filter(function(p){ return p!==ownerName; }).map(function(p){ return {name:p,file:people[p]}; });
      if(!owner){ owner=people[Object.keys(people)[0]]; ownerName=Object.keys(people)[0]; others=others.filter(function(o){ return o.name!==ownerName; }); }
      var rep={owner:ownerName,counts:{},renumbered:0,duplicates:0,conflicts:0};
      var merged={}, order={};                 // 'coll|id' → row ; coll → [ids]
      var lists=R.SPEC[app].lists||{}, nestedLists=R.SPEC[app].nestedLists||{};
      function isList(c){ return lists[c]!==undefined || (c.indexOf('data.')===0 && nestedLists[c.slice(5)]!==undefined); }
      function isLog(c){ return (R.SPEC[app].logs||[]).indexOf(c)>=0; }
      // the owner's rows go in as they are
      rowsOf(owner,app).forEach(function(r){
        if(r.coll==='_order'){ order[r.id]=r.data.slice(); return; }
        merged[r.coll+'|'+r.id]=r; (rep.counts[r.coll]=rep.counts[r.coll]||{})[ownerName]=((rep.counts[r.coll]||{})[ownerName]||0)+1;
      });
      var usedIds={}; Object.keys(merged).forEach(function(k){ usedIds[k.split('|').slice(1).join('|')]=1; });
      others.forEach(function(o){
        var rows=rowsOf(o.file,app), remap={};      // coll → {old:new}
        var theirOrder={};
        // pass 1: decide what each of their rows becomes
        var keep=[];
        rows.forEach(function(r){
          if(r.coll==='_order'){ theirOrder[r.id]=r.data; return; }
          (rep.counts[r.coll]=rep.counts[r.coll]||{})[o.name]=((rep.counts[r.coll]||{})[o.name]||0)+1;
          var k=r.coll+'|'+r.id, mine=merged[k];
          if(r.coll==='_doc'){ if(!mine) merged[k]=r; return; }                       // fields: the owner's version wins
          if(isLog(r.coll)){ if(!mine) merged[k]=r; return; }                          // logs: everything from both
          if(!isList(r.coll)){ if(!mine) merged[k]=r; return; }
          if(mine && R.stable(mine.data)===R.stable(r.data)){ if(!(app==='ub'&&SEEDED.indexOf(r.coll)>=0)) rep.duplicates++; return; }   // identical on both laptops (the pre-filled seasons don't count)
          if(app==='ub' && SEEDED.indexOf(r.coll)>=0){ if(!mine) merged[k]=r; else rep.conflicts++; return; }   // the owner's (Becki's) wins
          if(app==='ub' && SIG[r.coll]){
            // the same thing on both laptops — same number or not (a work list imported twice, an idea edited on one side)
            var sig=SIG[r.coll](r.data||{}), twin=mine && SIG[r.coll](mine.data||{})===sig ? k
              : Object.keys(merged).filter(function(mk){ return mk.indexOf(r.coll+'|')===0 && SIG[r.coll](merged[mk].data||{})===sig; })[0];
            if(twin){
              rep.duplicates++;
              var tw=merged[twin], pick=better(tw.data,r.data,r.coll);
              if(pick===r.data) merged[twin]={app:app,coll:r.coll,id:tw.id,data:Object.assign({},r.data,{id:tw.data.id})};
              if(twin!==k) (remap[r.coll]=remap[r.coll]||{})[r.id]=tw.id;
              return;
            }
          }
          if(!mine){ keep.push(r); return; }
          if(app==='ub'){
            // UB numbers are per laptop — same number, different thing: give theirs a new one
            var nid=nextUbId(usedIds,o.name==='becki'?2:1);
            (remap[r.coll]=remap[r.coll]||{})[r.id]=nid; rep.renumbered++;
            var d=clone(r.data); if(d&&typeof d==='object') d.id=typeof r.data.id==='number'?Number(nid):nid;
            keep.push({app:app,coll:r.coll,id:nid,data:d}); return;
          }
          // PL / shared: one real thing edited on both laptops → the newer edit wins, the other is reported
          rep.conflicts++;
          if(stamp(r.data)>stamp(mine.data)) merged[k]=r;
          report.notes.push((app==='pl'?'Private Label ':'Shared ')+r.coll+' '+((r.data&&(r.data.name||r.data.title))||r.id)+': different on each laptop — kept '+(stamp(r.data)>stamp(mine.data)?Name(o.name)+'’s (newer)':Name(ownerName)+'’s')+' version');
        });
        // pass 2: fix links inside their rows, then add them
        function fix(v){
          if(Array.isArray(v)) return v.map(fix);
          if(v&&typeof v==='object'){ var c={}; Object.keys(v).forEach(function(key){
            var val=v[key], coll=REFS[key];
            if(coll && val!=null && remap[coll] && remap[coll][String(val)]!=null){ var n=remap[coll][String(val)]; c[key]=typeof val==='number'?Number(n):n; }
            else if(key==='entityId' && val!=null && ((remap.ideas||{})[String(val)]||(remap.pipeline||{})[String(val)])){ var m=(remap.ideas||{})[String(val)]||(remap.pipeline||{})[String(val)]; c[key]=typeof val==='number'?Number(m):m; }
            else c[key]=fix(val); }); return c; }
          return v;
        }
        keep.forEach(function(r){ var row={app:app,coll:r.coll,id:r.id,data:fix(r.data)}; merged[row.coll+'|'+row.id]=row; usedIds[row.id]=1; });
        // their list order: anything new from them goes after the owner's
        Object.keys(theirOrder).forEach(function(coll){
          var mine=order[coll]=order[coll]||[];
          theirOrder[coll].forEach(function(id){ var m=(remap[coll]||{})[id]||id; if(mine.indexOf(m)<0 && merged[coll+'|'+m]) mine.push(m); });
        });
      });
      Object.keys(merged).forEach(function(k){ out.push(merged[k]); });
      Object.keys(order).forEach(function(coll){ out.push({app:app,coll:'_order',id:coll,data:order[coll].filter(function(id){ return merged[coll+'|'+id]; })}); });
      var total={}; Object.keys(merged).forEach(function(k){ var c=k.split('|')[0]; total[c]=(total[c]||0)+1; });
      Object.keys(rep.counts).forEach(function(c){ rep.counts[c].combined=total[c]||0; });
      report.apps[app]=rep;
    });
    return {rows:out,report:report};
  }

  root.PLUBCombine={combine:combine, who:who};
})(typeof window!=='undefined'?window:globalThis);

/* ═══════ PLUB ONLINE — sign-in, first-time load, the sync engine's hooks, and the cloud status ═══════
   Runs in the shell. The two apps don't know they're online: they keep using their own stores (kept apart from the
   local version by the storage shim at the top of each page) and this file keeps those stores in step with the cloud. */
(function(){
  var CFG=window.PLUB_CONFIG||{};
  var KEYS={ub:'ub_tracker_v1',pl:'pl_sourcing_v1',club:'plub_v1'};   // the shim stores these under plubc_ names
  var engine=null, backend=null, member=null, members={}, cloudState='off', cloudInfo={};

  /* ── backends: the real one, and a stand-in for testing on this Mac ── */
  function SupabaseBackend(){
    var sb=window.supabase.createClient(CFG.url,CFG.key,{auth:{persistSession:true,autoRefreshToken:true,storageKey:'plubc_auth'}});
    function page(q,from){ return q.range(from,from+999).then(function(r){ if(r.error) throw r.error; return r.data||[]; }); }
    return {
      session:function(){ return sb.auth.getSession().then(function(r){ return r.data&&r.data.session?{uid:r.data.session.user.id,email:r.data.session.user.email}:null; }); },
      signIn:function(email,pw){ return sb.auth.signInWithPassword({email:email,password:pw}).then(function(r){ if(r.error) throw r.error; return {uid:r.data.user.id,email:r.data.user.email}; }); },
      signOut:function(){ return sb.auth.signOut(); },
      members:function(){ return sb.from('plub_members').select('*').then(function(r){ if(r.error) throw r.error; return r.data||[]; }); },
      pullAll:function(){
        var all=[]; function next(from){ return page(sb.from('plub_rows').select('*').order('updated_at'),from).then(function(rows){ all=all.concat(rows); return rows.length===1000?next(from+1000):all; }); }
        return next(0);
      },
      pullSince:function(iso){ return sb.from('plub_rows').select('*').gt('updated_at',iso).order('updated_at').then(function(r){ if(r.error) throw r.error; return r.data||[]; }); },
      upsert:function(rows){ return sb.from('plub_rows').upsert(rows.map(function(r){ return {app:r.app,coll:r.coll,id:r.id,data:r.data===undefined?null:r.data,deleted:!!r.deleted}; }),{onConflict:'app,coll,id'}).then(function(r){ if(r.error) throw r.error; return {data:r.data,error:null}; }); },
      subscribe:function(cb){ sb.channel('plub_rows').on('postgres_changes',{event:'*',schema:'public',table:'plub_rows'},function(p){ if(p&&p.new) cb(p.new); }).subscribe(); },
      history:function(sinceIso){ var all=[]; function next(from){ return page(sb.from('plub_history').select('*').gte('at',sinceIso).order('at'),from).then(function(rows){ all=all.concat(rows); return rows.length===1000?next(from+1000):all; }); } return next(0); }
    };
  }
  function MockBackend(){   // talks to plub-online/mock-server.py — never used on the real site
    var base=CFG.mockUrl, tok=null; try{ tok=localStorage.getItem('plubc_mock_token'); }catch(e){}
    function j(path,opt){ return fetch(base+path+(path.indexOf('?')<0?'?':'&')+'token='+encodeURIComponent(tok||''),opt).then(function(r){ if(!r.ok) throw new Error('mock '+r.status); return r.json(); }); }
    return {
      session:function(){ return tok?j('/me').then(function(m){ return {uid:m.user_id,email:m.name.toLowerCase()+'@test'}; }).catch(function(){ return null; }):Promise.resolve(null); },
      signIn:function(email){ return fetch(base+'/signin',{method:'POST',body:JSON.stringify({email:email})}).then(function(r){ if(!r.ok) throw new Error('Invalid login credentials'); return r.json(); }).then(function(d){ tok=d.token; localStorage.setItem('plubc_mock_token',tok); return {uid:d.user_id,email:email}; }); },
      signOut:function(){ tok=null; localStorage.removeItem('plubc_mock_token'); return Promise.resolve(); },
      members:function(){ return j('/members'); },
      pullAll:function(){ return j('/rows'); },
      pullSince:function(iso){ return j('/rows?since='+encodeURIComponent(iso)); },
      upsert:function(rows){ return j('/rows',{method:'POST',body:JSON.stringify(rows)}).then(function(d){ return {data:d,error:null}; }); },
      subscribe:function(cb){ var since=new Date().toISOString(); (function wait(){ j('/wait?since='+encodeURIComponent(since)).then(function(rows){ rows.forEach(function(r){ if(r.updated_at>since) since=r.updated_at; cb(r); }); wait(); }).catch(function(){ setTimeout(wait,3000); }); })(); },
      history:function(sinceIso){ return j('/history?since='+encodeURIComponent(sinceIso)); }
    };
  }

  /* ── the sync engine's view of the two apps ── */
  function frameW(app){ try{ var f=FRAMES[app]; return f&&f.getAttribute('src')?f.contentWindow:null; }catch(e){ return null; } }
  function idle(app){
    if(app==='club') return true;
    var w=frameW(app); if(!w||!w.document||!w.document.body) return true;
    var d=w.document, a=d.activeElement;
    if(a && (/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) || a.isContentEditable)) return false;      // someone is typing
    var vw=w.innerWidth, vh=w.innerHeight, open=false;
    Array.prototype.some.call(d.querySelectorAll('.open,.show,[open]'),function(el){            // a popup or drawer is up
      var cs=w.getComputedStyle(el); if(cs.display==='none'||cs.visibility==='hidden') return false;
      if(cs.position!=='fixed') return false;
      var r=el.getBoundingClientRect(); if(r.width*r.height>vw*vh*0.2){ open=true; return true; } return false;
    });
    return !open;
  }
  function flush(app){ var w=frameW(app); if(!w) return; try{ new w.Function(app==='ub'?'try{flushSave()}catch(e){}':'try{_flushPendingSave()}catch(e){}')(); }catch(e){} }
  function reload(app){
    if(app==='club'){ try{ CLUB.reload(); }catch(e){} }
    else { var w=frameW(app); if(w&&w.plubReload) try{ w.plubReload(); }catch(e){ console.warn('reload',app,e); } }
    try{ chromeSync(true); }catch(e){}
    try{ if(document.getElementById('pipe').classList.contains('show')) renderPipe(); }catch(e){}
  }
  function nameOf(uid){ return (members[uid]&&members[uid].name)||'the other person'; }

  /* ── status: the line under your name in the sidebar ── */
  window.plubCloudText=function(){
    if(cloudState==='ok') return '<span class="pc-dot ok"></span>saved';
    if(cloudState==='saving') return '<span class="pc-dot busy"></span>saving…';
    if(cloudState==='loading') return '<span class="pc-dot busy"></span>loading…';
    if(cloudState==='offline') return '<span class="pc-dot warn"></span>offline · '+(cloudInfo.waiting?cloudInfo.waiting+' waiting':'will catch up');
    if(cloudState==='held') return '<span class="pc-dot bad"></span>paused — check';
    return 'cloud';
  };
  var _lastPaint='', _shownHeld=null;
  function onStatus(st,info){
    cloudState=st; cloudInfo=info||{};
    var t=window.plubCloudText(); if(t!==_lastPaint){ _lastPaint=t; var el=document.getElementById('plubCloud'); if(el) el.innerHTML=t; }
    if(st==='held' && info.held && info.held!==_shownHeld){ _shownHeld=info.held; heldPopup(info.held); }
  }
  function onNote(msg){ toastCloud(msg); }
  function toastCloud(msg){
    var t=document.getElementById('plubCloudToast'); if(!t){ t=document.createElement('div'); t.id='plubCloudToast'; document.body.appendChild(t); }
    t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(function(){ t.classList.remove('show'); },6000);
  }
  function heldPopup(h){
    if(!h) return;
    pdSet(pdHead('Delete '+h.deletes+' items?')
      +'<div class="pd-warn">PLUB was about to delete <b>'+h.deletes+' items</b> from the cloud in one go. That’s unusual, so it stopped to check. Nothing has been removed yet.</div>'
      +'<p class="pd-tip">If you meant it (for example clearing out finished tasks), say yes. If not, say no and this laptop goes back to what the cloud has.</p>'
      +'<div class="pd-foot"><button class="pd-btn" onclick="plubHeld(false)">No — put them back</button><button class="pd-btn pd-pri pd-danger" onclick="plubHeld(true)">Yes, delete them</button></div>',true);
  }
  window.plubHeld=function(yes){ pdClose(); if(engine) engine.releaseHeld(yes); };

  /* ── sign-in ── */
  function gate(html){
    var g=document.getElementById('clubGate'); if(!g){ g=document.createElement('div'); g.id='clubGate'; document.body.appendChild(g); }
    g.innerHTML='<div class="cg-box">'+html+'</div>'; g.style.display='flex'; return g;
  }
  function gateHead(sub){ return '<div class="cg-mark"><svg viewBox="0 0 24 24"><rect x="4" y="9" width="16" height="11" rx="2.5" fill="#030304" opacity=".85"/><path d="M8.5 9V7a3.5 3.5 0 017 0v2" fill="none" stroke="#030304" stroke-width="2" stroke-linecap="round"/></svg></div><div class="cg-t">PLUB</div><div class="cg-s">'+(sub||'Private Label + Unique Bundles HQ')+'</div>'; }
  function showSignIn(msg){
    gate(gateHead()+'<form class="cg-form" onsubmit="return plubSignIn(event)"><input id="cgEmail" type="email" placeholder="Email" autocomplete="username" required>'
      +'<input id="cgPw" type="password" placeholder="Password" autocomplete="current-password"'+(CFG.backend==='mock'?'':' required')+'>'
      +'<button class="btn primary" type="submit">Sign in</button><div class="cg-err" id="cgErr">'+(msg?esc(msg):'')+'</div></form>'
      +'<div class="cg-note">You stay signed in on this laptop. Only Jack and Becki can sign in.</div>');
    setTimeout(function(){ var e=document.getElementById('cgEmail'); if(e) e.focus(); },50);
  }
  window.plubSignIn=function(ev){
    ev.preventDefault();
    var em=document.getElementById('cgEmail').value.trim(), pw=document.getElementById('cgPw').value, err=document.getElementById('cgErr');
    err.textContent='Signing in…';
    backend.signIn(em,pw).then(function(s){ return afterSignIn(s); })
      .catch(function(e){ var m=String(e&&e.message||e); err.textContent=/invalid/i.test(m)?'That email and password don’t match.':m; });
    return false;
  };
  function afterSignIn(sess){
    return backend.members().then(function(list){
      members={}; list.forEach(function(m){ members[m.user_id]=m; });
      member=members[sess.uid];
      if(!member){ gate(gateHead()+'<div class="cg-err" style="margin-top:14px">This login isn’t on the PLUB list.</div><button class="btn" style="margin-top:10px" onclick="plubSignOut()">Sign out</button>'); return; }
      window.PLUB_DIGIT=member.digit; window.PLUB_MEMBER=member;
      CLUB.setWho(member.name.toLowerCase());
      return startEngine();
    });
  }
  window.plubSignOut=function(){
    var done=function(){ backend.signOut().then(function(){ try{ CLUB.signOut(); }catch(e){} location.reload(); }); };
    if(engine){ engine.tick(); setTimeout(done,1200); } else done();
  };

  /* ── engine start, and the first-ever load ── */
  function startEngine(){
    gate(gateHead('Loading from the cloud…')+'<div class="cg-note"><span class="pd-spin" style="display:inline-block;vertical-align:middle;margin-right:8px"></span>Getting the latest from both of you</div>');
    engine=new PLUBSync.Engine({keys:KEYS},backend,{idle:idle,flush:flush,reload:reload,status:onStatus,note:onNote,nameOf:nameOf});
    return engine.boot().then(function(res){
      if(res.empty){ showFirstLoad(); return; }
      try{ CLUB.reload(); }catch(e){}            // this page's own copy of the shared store was read before the cloud arrived
      engine.start(); document.getElementById('clubGate').style.display='none';
      if(res.held) heldPopup(engine.held);
      if(res.pushed) toastCloud(res.pushed+' change'+(res.pushed>1?'s':'')+' made on this laptop while offline went up to the cloud');
      clubBoot();
    }).catch(function(e){
      gate(gateHead()+'<div class="cg-err" style="margin-top:14px">Couldn’t reach the cloud: '+esc(String(e&&e.message||e))+'</div><button class="btn primary" style="margin-top:10px" onclick="location.reload()">Try again</button>');
    });
  }
  var _files=[];
  function showFirstLoad(){
    if(member.role!=='owner'){
      gate(gateHead('Nearly there')+'<div class="cg-note" style="margin-top:14px">Jack hasn’t loaded everyone’s data into the cloud yet. Try again in a few minutes.</div><button class="btn primary" style="margin-top:12px" onclick="location.reload()">Try again</button>');
      return;
    }
    _files=[];
    gate(gateHead('One-time setup')+'<div class="fl"><h3>Load everyone’s data into the cloud</h3>'
      +'<p>Pick both “PLUB everything” files — yours and Becki’s. They’re combined into one, checked, and shown to you before anything is saved.</p>'
      +'<input type="file" id="flFiles" accept=".json,application/json" multiple onchange="plubFirstFiles(this)" style="display:none">'
      +'<button class="btn primary" onclick="document.getElementById(\'flFiles\').click()">Choose the two files…</button><div id="flOut"></div></div>');
  }
  window.plubFirstFiles=function(inp){
    var fs=Array.prototype.slice.call(inp.files||[]), out=document.getElementById('flOut');
    out.innerHTML='<div class="cg-note">Checking…</div>';
    Promise.all(fs.map(function(f){ return f.text().then(function(t){ var o=null; try{ o=JSON.parse(t); }catch(e){} return {name:f.name,file:o}; }); })).then(function(list){
      var bad=list.filter(function(x){ return !x.file||x.file.format!=='plub-full-export'; });
      if(bad.length){ out.innerHTML='<div class="cg-err">'+esc(bad.map(function(b){ return b.name; }).join(', '))+' — not a “PLUB everything” file.</div>'; return; }
      return Promise.all(list.map(function(x){ return pdHash(x.file.keys).then(function(h){ x.ok=!x.file.sha256||h===x.file.sha256; return x; }); })).then(function(list){
        var dam=list.filter(function(x){ return !x.ok; });
        if(dam.length){ out.innerHTML='<div class="cg-err">'+esc(dam[0].name)+' has been changed or damaged since it was exported.</div>'; return; }

/* ══ LAUNCH FORECAST — derived, never typed ══ */
var UB_DUR={sourcing:7, jack_validation:3, prepare_to_launch:10, buy_receive:28, live:0};
var UB_ORDER=['sourcing','jack_validation','prepare_to_launch','buy_receive','live'];
var PL_DUR={1:10,2:14,3:7,4:10,5:28,6:15,7:10};

function launchForecast(ub,pl){
  var D=86400000, now=Date.now(), rows=[];
  if(ub){ var age=(ub.settings&&ub.settings.ageing)||UB_DUR;
    (ub.pipeline||[]).forEach(function(p){
      var key=UB_MAP[p.stage]?p.stage:'sourcing'; if(!UB_DUR.hasOwnProperty(key)) key='sourcing';
      var entered=p.entered?new Date(p.entered).getTime():now;
      var inStage=Math.max(0,(now-entered)/D), stageDur=age[key]!=null?age[key]:UB_DUR[key];
      var remaining=Math.max(0,stageDur-inStage)+fcRemaining(UB_ORDER,age,key)-(age[key]||0);
      var expected=now+remaining*D;
      if(p.waiting&&p.waiting.until){ var wu=new Date(p.waiting.until).getTime(); if(wu>expected) expected=wu+(fcRemaining(UB_ORDER,age,key)-(age[key]||0))*D; }
      var wOver=!!(p.waiting&&p.waiting.until&&new Date(p.waiting.until)<new Date());
      rows.push({app:'ub',id:p.id,title:p.title,stage:UB_NAMES[p.stage]||p.stage,expected:expected,stuck:inStage>stageDur||wOver,over:Math.max(0,Math.round(inStage-stageDur)),wOver:wOver,last:key==='live',waiting:!!(p.waiting&&p.waiting.until&&new Date(p.waiting.until)>new Date()),override:false});
    });
    ((ub.archive&&ub.archive.launched)||[]).forEach(function(a){ if(a.date) rows.push({app:'ub',title:a.title,launched:new Date(a.date).getTime()}); });
  }
  if(pl){ (pl.ideas||[]).forEach(function(r){ var i=r.data||{}, p=i.pipeline||{}; if(!i.inPipeline) return;
      if(p.status==='launched'||r.pipeline_status==='launched'){ rows.push({app:'pl',title:i.name||r.name,launched:p.launchedAt||now}); return; }
      if(p.status==='rejected'||r.pipeline_status==='dropped') return;
      var st=Number(p.stage)||1, moved=p.lastMoved||p.enteredAt||now, inStage=Math.max(0,(now-moved)/D), stageDur=PL_DUR[st]||14;
      var rem=Math.max(0,stageDur-inStage); for(var k=st+1;k<=7;k++) rem+=PL_DUR[k];
      var expected=p.forecastLive? new Date(p.forecastLive).getTime() : now+rem*D;
      var due=p.waitingUntil?new Date(p.waitingUntil).getTime():0;
      var wOver=!!(p.waitingFor&&due&&due<now);
      rows.push({app:'pl',id:(i.id||r.id),title:i.name||r.name,stage:PL_NAMES[st]||('Stage '+st),expected:expected,stuck:inStage>stageDur||wOver,over:Math.max(0,Math.round(inStage-stageDur)),wOver:wOver,last:st===7,waiting:!!(p.waitingFor&&(!due||due>=now)),override:!!p.forecastLive});
    }); }

}
function fcSummary(ub,pl,m){
  var D=86400000, now=Date.now(), rows=launchForecast(ub,pl);
  var mEnd=monthEnd(), mStart=monthStart(), wkEnd=isoWeekStart()+7*D, nwkEnd=wkEnd+7*D, d30=now+30*D;
  var open=rows.filter(function(r){return r.expected!=null;}).sort(function(a,b){return a.expected-b.expected;});
  var done=rows.filter(function(r){return r.launched!=null;});
  var launchedMonth=done.filter(function(r){return r.launched>=mStart&&r.launched<mEnd;}).length;
  var v30=done.filter(function(r){return r.launched>=now-30*D;}).length, v90=done.filter(function(r){return r.launched>=now-90*D;}).length;
  var thisWeek=open.filter(function(r){return r.expected<wkEnd;}), nextWeek=open.filter(function(r){return r.expected>=wkEnd&&r.expected<nwkEnd;});
  var next30=open.filter(function(r){return r.expected<d30;}), restOfMonth=open.filter(function(r){return r.expected<mEnd;});

  return '<section class="ov-card fc"><div class="ov-card-h"><h3>Launches \u2014 where we\u2019re at</h3>'

    .map(function(c){ var n=ovNext(c); return {c:c,n:n}; })
    .sort(function(a,b){ return rank[a.n.p]-rank[b.n.p] || (b.c.days||0)-(a.c.days||0); });
}

      +'<td class="ov-age">'+(c.days!=null?c.days+'d':'—')+'</td>'
      +'<td><button class="ov-go">'+n.b+' →</button></td></tr>';
  }).join('');
  var queue='<section class="ov-card"><div class="ov-card-h"><h3>Priority queue</h3>'
    +'<span class="ov-card-s">'+q.length+' active across both belts · worst first</span></div>'
    +(rows?'<div class="ov-tw"><table class="ov-tbl"><thead><tr><th>Priority</th><th>Product</th><th>Stage</th><th>Next action</th><th>Age</th><th></th></tr></thead><tbody>'
      +rows+'</tbody></table></div>'
      +(q.length>8?'<div class="ov-more">'+(q.length-8)+' more not shown</div>':'')
      :'<div class="ov-blank">Nothing in either pipeline yet.</div>')
    +'</section>';

  /* two lanes — each belt keeps its own real stages */
  var lane=function(d){
    if(!d) return '';
    var mx=Math.max.apply(null,d.stages.map(function(x){return x.count;}).concat([1]));
    return '<div class="ov-lane '+d.app+'">'
      +'<div class="ov-lane-h"><span class="ov-app '+d.app+'">'+(d.app==='ub'?'UB':'PL')+'</span>'
        +'<b>'+d.label+'</b><span class="ov-lane-s">'+d.who+' · '+d.active+' active</span>'
        +'<button class="ov-open" onclick="show(\''+d.app+'\')">Open →</button></div>'
      +'<div class="ov-flow">'+d.stages.map(function(x,i){
          var cls = x.count===0?'zero' : x.count<x.min?'low':'ok';
          return (i?'<span class="ov-arrow">›</span>':'')
            +'<div class="ov-node '+cls+'" title="'+esc(x.name)+' — '+x.count+' of '+x.min+' minimum">'
            +'<b>'+x.count+'</b><span>'+esc(x.name)+'</span>'
            +'<em style="width:'+Math.round(x.count/mx*100)+'%"></em>'
            +(x.count===0?'<i>empty</i>':'')+'</div>';
        }).join('')+'</div></div>';
  };
  var lanes='<section class="ov-card"><div class="ov-card-h"><h3>The two belts</h3>'
    +'<span class="ov-card-s">each keeps its own stages — they are different processes</span></div>'
    +'<div class="ov-lanes">'+lane(L)+lane(U)+'</div></section>';

  /* one nudge, the single most useful sentence right now */
  var nudge='';
  var worst=sides.slice().sort(function(a,b){return b.empties-a.empties;})[0];
  if(empties>0 && worst){
    var em=worst.stages.filter(function(x){return x.count===0;}).map(function(x){return x.name;});
    nudge='<div class="ov-nudge"><span class="ov-ni"><svg viewBox="0 0 20 20">'+IC.bolt+'</svg></span>'
      +'<div><b>Fill '+esc(em[0])+' on '+esc(worst.label)+'</b>'
      +'<span>'+(em.length>1?em.length+' stages are empty ('+em.map(esc).join(', ')+'). ':'')
      +worst.who+' owns this. An empty stage now is a missing launch about three months out.</span></div>'
      +'<button class="ov-go" onclick="show(\''+worst.app+'\')">Open '+(worst.app==='ub'?'UB':'PL')+' →</button></div>';
  } else if(hrs<exp*0.85){
    nudge='<div class="ov-nudge"><span class="ov-ni"><svg viewBox="0 0 20 20">'+IC.clock+'</svg></span>'
      +'<div><b>Sourcing is behind for the month</b><span>'+fmtH(hrs)+' of '+fmtH(tgt)+' logged, '
      +fmtH(Math.max(0,exp-hrs))+' behind where today sits.</span></div>'
      +'<button class="ov-go" onclick="show(\'pl\')">Start a session →</button></div>';
  }

  // what matters first — launches, the month's targets, this week, what to work on — then the detail (24 Oct)
  return missHtml+'<div class="ov-hero compact '+tone+'"><div><div class="eyebrow">'+(sides.length>1?'Both belts':esc(sides[0].label))+' · this month</div>'
      +'<h2 class="ov-head">'+head+'</h2><p class="ov-sub">'+sub+'</p></div></div>'
    + (function(){ try{ return ovLaunches(ub,pl,m); }catch(e){ console.error('launches',e); return ''; } })()
    + targets
    + (function(){ try{ return ovThisWeek(); }catch(e){ console.error('this week',e); return ''; } })() + queue
    + '<div class="ov-detail-h">The detail</div>' + stats + nudge + lanes;
}

function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function activeCount(){ try{ return readStores().cards.filter(function(c){return c.col!=='launched';}).length; }catch(e){ return 0; } }
function paintPipeN(){ var n=document.getElementById('pipeN'); if(!n) return; var a=activeCount(); n.textContent=a; n.classList.toggle('show',a>0); }
function renderPipe(){
  if(ovView()==='foryou') return renderForYou();
  if(ovView()==='audit') return renderAudit();
  var st = readStores(), cards = st.cards;
  cards.forEach(function(c){ c.cold = c.days!=null && c.days>=7 && !c.wait; });
  var ubN = cards.filter(function(c){return c.app==='ub' && c.col!=='launched';}).length, plN = cards.filter(function(c){return c.app==='pl' && c.col!=='launched';}).length;
  var stuck = cards.filter(function(c){return c.over;}).length, wait = cards.filter(function(c){return c.wait;}).length, launched = cards.filter(function(c){return c.col==='launched';}).length;
  paintPipeN();
  // Empty stages collapse to slim rails so the products that DO exist get the screen.
  var HUES = {sourcing:'#22D3EE', validating:'#E879C7', samples:'#3B9EFF', ordered:'#FF8A3D', ready:'#FFC53D', launching:'#4ADE80', launched:'#00E5A0'};
  var shown = ovApplyFilter(cards);
  var byCol = {}; COLS.forEach(function(c){ byCol[c.key]=shown.filter(function(x){return x.col===c.key;}); });
  var OWNER={ub:'Becki', pl:'Jack'};
  var card = function(x){
    var next = x.over ? 'past its '+x.stage+' target'
             : x.wait ? 'waiting on somebody else'
             : x.days!=null && x.days>=7 ? 'untouched for '+x.days+' days'
             : x.col==='launched' ? 'live' : 'on track in '+x.stage;
    return '<div class="p-card '+x.app+(x.over?' stuck':'')+(x.wait?' waiting':'')+'" onclick="ovOpen(\''+x.app+'\','+JSON.stringify(String(x.id||'')).replace(/"/g,'&quot;')+')" title="'+esc(x.title)+' — open in '+(x.app==='ub'?'Unique Bundles':'Private Label')+'">'
      + '<div class="pc-top">'+ovAvatar(x.title,'sm')+'<div class="t">'+esc(x.title)+'</div>'
        + (x.score!=null?'<span class="sc">'+x.score+'%</span>':'')+'</div>'
      + '<div class="pc-next'+(x.over?' bad':x.wait?' wait':'')+'">'+esc(next)+'</div>'
      + '<div class="m"><span class="app-chip '+x.app+'" title="'+OWNER[x.app]+' owns this side">'+(x.app==='ub'?'UB':'PL')+' · '+OWNER[x.app]+'</span>'
      + (x.days!=null ? '<span class="d'+(x.over?' over':x.wait?' wait':'')+'">'+x.days+'d</span>' : '')
      + '</div></div>'; };
  var oldest = function(rows){ var d=rows.map(function(r){return r.days||0;}); return d.length?Math.max.apply(null,d):0; };
  var template = COLS.map(function(c){ return byCol[c.key].length ? 'minmax(210px,1fr)' : '46px'; }).join(' ');
  var cols = COLS.map(function(c){
    var rows = byCol[c.key];
    if(!rows.length) return '<div class="p-col slim c-'+c.key+'" title="'+c.name+' — nothing here, and an empty stage is a launch that does not arrive"><span class="c0">0</span><b>'+c.name+'</b></div>';
    rows = rows.slice().sort(function(a,b){ return (b.over?1:0)-(a.over?1:0) || (b.days||0)-(a.days||0); });
    var st = rows.filter(function(r){return r.over;}).length, wt = rows.filter(function(r){return r.wait;}).length;
    return '<div class="p-col c-'+c.key+'"><div class="p-col-h"><b>'+c.name+'</b><span class="c">'+rows.length+'</span></div>'
      + '<div class="p-col-sub">'+(st?'<i class="pcs-bad">'+st+' stuck</i>':'')+(wt?'<i class="pcs-wait">'+wt+' waiting</i>':'')
        +(!st&&!wt?'<i>oldest '+oldest(rows)+'d</i>':'')+'</div>'
      + '<div class="p-cards">'+rows.map(card).join('')+'</div></div>';
  }).join('');
  // the flow bar: the shape of the whole belt in one line
  var flowSegs = COLS.filter(function(c){return byCol[c.key].length;}).map(function(c){
    return '<span style="flex:'+byCol[c.key].length+';background:'+HUES[c.key]+'" title="'+c.name+' · '+byCol[c.key].length+'"></span>'; }).join('');
  var moving = cards.filter(function(x){return x.col!=='launched';}).length;
  var flowRead = moving
    ? '<b>'+moving+'</b> in the pipelines'
      + (stuck?' · <b style="color:#FF8FA3">'+stuck+' stuck</b>':'') + (wait?' · '+wait+' waiting':'')
      + ' · '+(launched?'<b style="color:var(--green)">'+launched+' launched this month</b>':'0 launched this month')
    : 'Nothing in the pipelines yet — promote your best ideas from each app';
  // ── combined monthly KPIs: UB + PL against both apps' targets ──
  var ub2=null, pl2=null;
  try{ ub2=JSON.parse(localStorage.getItem('ub_tracker_v1')||'null'); }catch(e){}
  try{ pl2=JSON.parse(localStorage.getItem('pl_sourcing_v1')||'null'); }catch(e){}
  function tgt(id){ var k=((ub2&&ub2.settings&&ub2.settings.kpis)||[]).filter(function(x){return x.id===id&&x.on!==false;})[0]; return k?(+k.target||0):0; }
  var ubEv=(ub2&&ub2.events)||[];
  var ubIdeas=ubEv.filter(function(e){return e.type==='ideas'&&sameMonth(e.at);}).length;
  var ubMoved=ubEv.filter(function(e){return e.type==='moved'&&sameMonth(e.at);}).length;
  var ubLaunch=ubEv.filter(function(e){return e.type==='launches'&&sameMonth(e.at);}).length;
  var plRows=(pl2&&pl2.ideas)||[];
  var plBS=((pl2&&pl2.brand_state)||[])[0]; plBS=(plBS&&plBS.data)||{};
  var MK=plBS.plMonthlyK||{ideas:12,pipeline:4,launches:1};
  var plIdeas=plRows.filter(function(r){return r.data&&sameMonth(r.data.createdAt)&&!r.data._imported;}).length;
  var plMoved=plRows.filter(function(r){var p=(r.data&&r.data.pipeline)||{};return p.enteredAt&&sameMonth(p.enteredAt);}).length;
  var plLaunch=plRows.filter(function(r){var p=(r.data&&r.data.pipeline)||{};return p.launchedAt&&sameMonth(p.launchedAt);}).length;
  var now=new Date(), mPace=now.getDate()/new Date(now.getFullYear(),now.getMonth()+1,0).getDate();
  function ring(label,a,t,ua,pa,hue){
    var pct=t?Math.min(100,a/t*100):0, R=17, C=2*Math.PI*R, off=C*(1-pct/100);
    var exp=Math.round(t*mPace), st=a>=t?['HIT','ok']:a>=exp?['ON TRACK','ok']:['BEHIND','bad'];
    return '<div class="p-kpi" style="--c:'+hue+'">'
      +'<div class="p-kpi-ring"><svg viewBox="0 0 42 42"><circle cx="21" cy="21" r="'+R+'" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="4.5"/>'
      +'<circle cx="21" cy="21" r="'+R+'" fill="none" stroke="'+hue+'" stroke-width="4.5" stroke-linecap="round" stroke-dasharray="'+C.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'" transform="rotate(-90 21 21)"/></svg>'
      +'<span>'+Math.round(pct)+'<i>%</i></span></div>'
      +'<div class="p-kpi-t"><div class="p-kpi-top"><b>'+label+'</b><span class="p-kpi-b '+st[1]+'">'+st[0]+'</span></div>'
      +'<div class="p-kpi-v">'+a+'<i>/'+t+'</i></div>'
      +'<div class="p-kpi-s">UB '+ua+' · PL '+pa+' · expected '+exp+' by today</div></div></div>';
  }
  // ── the combined movement line: what actually happened across BOTH trackers this week ──
  var wkAgo=monthStart();
  var inWk=function(iso){ if(!iso) return false; var t=new Date(iso).getTime(); return isFinite(t)&&t>=wkAgo; };
  var uEv=(ub2&&ub2.events)||[];
  var wEnter = uEv.filter(function(e){return e.type==='moved'&&inWk(e.at);}).length;
  var wFwd   = uEv.filter(function(e){return e.type==='stage'&&inWk(e.at);}).length;
  var wLaunch= uEv.filter(function(e){return e.type==='launches'&&inWk(e.at);}).length;
  var uEnterW=wEnter, uFwdW=wFwd;
  var wUntouched=((ub2&&ub2.pipeline)||[]).filter(function(p){
    return !((p.hist||[]).some(function(h){ return h&&h[3]&&inWk(h[3]); })); }).length;
  var pEnterW=0,pFwdW=0,pLaunchW=0;
  plRows.forEach(function(r){
    var d2=r.data||{}, pp=d2.pipeline||{};
    if(!d2.inPipeline) return;
    if(pp.enteredAt&&pp.enteredAt>=wkAgo) pEnterW++;
    var hist=pp.history||[];
    if(hist.some(function(h){return h.type==='advance'&&h.ts>=wkAgo;})) pFwdW++;
    if(pp.launchedAt&&pp.launchedAt>=wkAgo) pLaunchW++;
    if(!hist.some(function(h){return h.ts>=wkAgo;})) wUntouched++;
  });
  wEnter+=pEnterW; wFwd+=pFwdW; wLaunch+=pLaunchW;
  var wOk=(wEnter+wFwd+wLaunch)>0;
  var wCell=function(v,l,hot){return '<div class="pw-cell'+(hot&&v?' hot':'')+'"><b>'+v+'</b><span>'+l+'</span></div>';};
  var weekLine='<div class="p-week '+(wOk?'ok':'quiet')+'">'
    +'<div class="pw-verdict">'+(wOk
      ? '✓ Both belts moving — '+wEnter+' entered · '+wFwd+' moved forward this month'
        +' <i>(UB '+uEnterW+'·'+uFwdW+' / PL '+pEnterW+'·'+pFwdW+')</i>'
      : '⚠ Quiet week across both trackers — nothing entered or moved forward')+'</div>'
    +'<div class="pw-cells">'+wCell(wEnter,'entered')+wCell(wFwd,'moved forward')+wCell(wLaunch,'launched')
    +wCell(stuck,'stuck',true)+wCell(wUntouched,'untouched 7d',true)+'</div></div>';
  var kpiRow='<div class="p-kpis">'
    + ring('Ideas captured', ubIdeas+plIdeas, tgt('ideas')+MK.ideas, ubIdeas, plIdeas, '#A78BFF')
    + ring('Into the pipelines', ubMoved+plMoved, (tgt('moved')||0)+MK.pipeline, ubMoved, plMoved, '#22D3EE')
    + ring('Launched', ubLaunch+plLaunch, tgt('launches')+MK.launches, ubLaunch, plLaunch, '#00E5A0')
    +'</div>';
  var overview='';
  try{ overview = renderOverview(ub2, pl2, {iAct:ubIdeas+plIdeas, iTgt:tgt('ideas')+MK.ideas,
        lAct:ubLaunch+plLaunch, lTgt:tgt('launches')+MK.launches,
        mTgt:(tgt('moved')||0)+MK.pipeline, stuck:stuck}, cards); }
  catch(e){ console.error('overview',e); }
  // the joint board: every product on both belts across the seven shared stages
  var f=ovFilter();
  var fBtn=function(k,l,n){ return '<button class="ovf'+(f===k?' on':'')+'" onclick="setOvFilter(\''+k+'\')">'+l+(n!=null?'<i>'+n+'</i>':'')+'</button>'; };
  var nUb=cards.filter(function(c){return c.app==='ub'&&c.col!=='launched';}).length,
      nPl=cards.filter(function(c){return c.app==='pl'&&c.col!=='launched';}).length;
  var filters='<div class="ov-fbar">'+fBtn('all','Everything',moving)+fBtn('ub','Unique Bundles · Becki',nUb)+fBtn('pl','Private Label · Jack',nPl)
    +'<span class="ovf-sp"></span>'+fBtn('stuck','Needs a push',stuck)+fBtn('wait','Waiting',wait)+'</div>';
  var board = filters
    + '<div class="jb-flow">'+(flowSegs||'<span style="flex:1;background:var(--s3)"></span>')+'</div><div class="ov-flow-read">'+flowRead+'</div>'
    + (moving+launched===0
        ? '<div class="ov-blank">Nothing in either pipeline yet — promote your best ideas from each app and they appear here.</div>'
        : '<div class="p-board" style="grid-template-columns:'+template+'">'+cols+'</div>');
  var isBoard = ovView()==='board';
  document.getElementById('pipe').innerHTML =
    '<div class="ov-main">'
      + '<div class="pane ov-pane'+(isBoard?' ov-board':'')+'">'
        + '<div class="page-hd"><div><div class="eyebrow">Unique Bundles + Private Label</div>'
          + '<div class="page-title">'+(isBoard?'Joint pipeline':'Overview')+'</div>'
          + '<div class="page-sub">'+(isBoard?'Every product on both belts, seven shared stages — the shape of the whole business. Click a card to open it.':'Are we scaling, is anything moving, and where should the time go this month.')+'</div></div></div>'
        + (isBoard? board : overview)
      + '</div>'
    + '</div>';
}
function ovView(){ try{ var v=localStorage.getItem('plub_ov_view'); return (v==='board'||v==='foryou'||v==='audit')?v:'summary'; }catch(e){ return 'summary'; } }
function ovFilter(){ try{ return localStorage.getItem('plub_ov_filter')||'all'; }catch(e){ return 'all'; } }
function setOvFilter(v){ try{ localStorage.setItem('plub_ov_filter', v); }catch(e){} renderPipe(); }
function ovApplyFilter(cards){
  var f=ovFilter();
  if(f==='ub'||f==='pl') return cards.filter(function(c){ return c.app===f; });
  if(f==='stuck') return cards.filter(function(c){ return c.over; });
  if(f==='wait')  return cards.filter(function(c){ return c.wait; });

}

<script id="plub-data">
/* ═══════ EXPORT / IMPORT EVERYTHING ═══════
   One file holds every PLUB key on this laptop, byte for byte: both trackers, shared tasks/sessions, settings, drafts.
   Format 'plub-full-export' v1 — the online version imports this same file, so a key's raw value must never be
   reshaped on the way out. Other BDL apps share this browser storage; only PLUB's own keys are ever read or written. */
var PD_KEYS=['plub_v1','plub_who','plub_mode','plub_outbox_v1','ubpl_shell_tab','plub_rail_min','plub_ov_view','plub_ov_filter',
  'ub_tracker_v1','ub_sb_min','ub_last_report','ub_last_backup','pl_sourcing_v1','pls_theme','pls_draft','pl_sb_min'];
var PD_DYNAMIC=/^(ub_tracker_v1__|pl_sourcing_v1_quarantine_)/;   // UB's undo/pre-import copies, PL's quarantined stores
var PD_KEEP=['plub_who'];                                           // who is using this laptop is not data — an import never changes it
var PD_LAST='plub_last_full_export';
var _pdPending=null;

function pdKeys(){
  var out=PD_KEYS.slice();
  try{ for(var i=0;i<localStorage.length;i++){ var k=localStorage.key(i); if(k&&PD_DYNAMIC.test(k)&&out.indexOf(k)<0) out.push(k); } }catch(e){}
  return out;
}
function pdOwns(k){ return PD_KEYS.indexOf(k)>=0 || PD_DYNAMIC.test(k); }
function pdRead(){ var o={}; pdKeys().forEach(function(k){ try{ var v=localStorage.getItem(k); if(v!=null) o[k]=v; }catch(e){} }); return o; }
function pdParse(s){ try{ return JSON.parse(s); }catch(e){ return null; } }
var _pdLastMem=null;   // if the shared browser storage is full the note can't be written — the page must still know the export happened
function pdLast(){ var r=null; try{ r=pdParse(localStorage.getItem(PD_LAST)||'null'); }catch(e){} return r||_pdLastMem; }
function pdCounts(keys){
  var ub=pdParse(keys.ub_tracker_v1||'null')||{}, pl=pdParse(keys.pl_sourcing_v1||'null')||{}, sh=pdParse(keys.plub_v1||'null')||{};
  var bs=((pl.brand_state||[])[0]||{}).data||{};
  function n(a){ return Array.isArray(a)?a.length:0; }
  var pli=Array.isArray(pl.ideas)?pl.ideas:[];
  return {
    ub_ideas:n(ub.ideas), ub_pipeline:n(ub.pipeline), ub_tasks:n(ub.tasks), ub_inbox:n(ub.inbox), ub_vendors:n(ub.vendors),
    ub_storefronts:n(ub.storefronts), ub_sessions:n(ub.sessionLog), ub_archive:n(ub.archive),
    pl_ideas:pli.length, pl_pipeline:pli.filter(function(r){ return r&&r.in_pipeline; }).length, pl_vendors:n(bs.vendors),
    pl_sessions:n(bs.plSess), pl_week_tasks:n(bs.weekTasks),
    sh_tasks:n(sh.tasks), sh_sessions:n(sh.sessions), sh_notes:n(sh.task_notes), sh_activity:n(sh.activity)
  };
}
var PD_ROWS=[
  ['Unique Bundles',[['ub_ideas','Ideas'],['ub_pipeline','In the pipeline'],['ub_tasks','Tasks'],['ub_inbox','Review queue'],['ub_vendors','Suppliers'],['ub_storefronts','Storefronts'],['ub_sessions','Sessions'],['ub_archive','Archived']]],
  ['Private Label',[['pl_ideas','Ideas'],['pl_pipeline','In the pipeline'],['pl_vendors','Suppliers'],['pl_sessions','Sessions'],['pl_week_tasks','Week plan tasks']]],
  ['Shared',[['sh_tasks','Tasks'],['sh_notes','Task notes'],['sh_sessions','Sessions'],['sh_activity','Activity log']]]
];
function pdHash(keys){
  var s=Object.keys(keys).sort().map(function(k){ return k+'\u0000'+keys[k]; }).join('\u0001');
  try{ if(window.crypto&&crypto.subtle&&window.TextEncoder) return crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)).then(function(b){
    return Array.prototype.map.call(new Uint8Array(b),function(x){ return ('0'+x.toString(16)).slice(-2); }).join(''); }); }catch(e){}
  return Promise.resolve('');
}
function pdFlush(){
  // both apps save on a short timer — push anything still waiting into storage before it is read
  try{ var w=frameWin('ub'); if(w) new w.Function('try{flushSave()}catch(e){}')(); }catch(e){}
  try{ var p=frameWin('pl'); if(p) new p.Function('try{_flushPendingSave()}catch(e){}')(); }catch(e){}
}
function pdP(n){ return (n<10?'0':'')+n; }
function pdStamp(d){ return d.getFullYear()+'-'+pdP(d.getMonth()+1)+'-'+pdP(d.getDate())+' '+pdP(d.getHours())+'.'+pdP(d.getMinutes()); }
function pdWhen(iso){
  var d=new Date(iso); if(isNaN(d)) return '';
  var t=pdP(d.getHours())+':'+pdP(d.getMinutes()), today=new Date(); today.setHours(0,0,0,0);
  var day=new Date(d); day.setHours(0,0,0,0); var diff=Math.round((today-day)/864e5);
  if(diff===0) return 'today '+t; if(diff===1) return 'yesterday '+t;
  return d.getDate()+' '+['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getMonth()]+' '+t;
}
function pdSize(n){ return n>1048576?(n/1048576).toFixed(1)+' MB':Math.max(1,Math.round(n/1024))+' KB'; }
function pdFileObj(keys,h,extra){
  var u=CLUB.user();
  var f={format:'plub-full-export',format_version:1,app:'PLUB',build:BUILD,stamp:STAMP,exported_at:new Date().toISOString(),
    exported_by:u?u.display_name:'?',exported_by_id:u?u.id:'',key_count:Object.keys(keys).length,counts:pdCounts(keys),sha256:h,keys:keys};
  if(extra) Object.keys(extra).forEach(function(k){ f[k]=extra[k]; });
  // the untouched pre-update copy goes in every normal export from this page load — a fallback, never what Import restores
  if(window.__plubPre&&!f.safety_copy) f.before_update={note:'Every PLUB key exactly as the previous version left it, captured on the first load of v'+BUILD+' before anything updated it',
    captured_at:window.__plubPre.captured_at,counts:pdCounts(window.__plubPre.keys),keys:window.__plubPre.keys};
  return f;
}
function pdDownload(text,name){
  var b=new Blob([text],{type:'application/json'}), a=document.createElement('a');
  a.href=URL.createObjectURL(b); a.download=name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(a.href); },8000);
}

function pdBusy(msg){ pdSet('<div class="pd-busy"><span class="pd-spin"></span>'+msg+'</div>',true); }
