/* ── export ── */
function pdExport(quiet){
  // quiet = started from the to-do page, which shows the result itself
  pdBusy('Gathering everything from both apps…');
  pdFlush();
  setTimeout(function(){
    var keys=pdRead();
    pdHash(keys).then(function(h){
      var file=pdFileObj(keys,h), text=JSON.stringify(file), back=pdParse(text);
      // read it straight back before it leaves the page — it only counts if every byte comes back the same
      return pdHash((back&&back.keys)||{}).then(function(h2){
        if(!back||h2!==h) throw new Error('the file did not read back cleanly');
        var name='PLUB everything - '+file.exported_by+' - '+pdStamp(new Date())+'.json';
        pdDownload(text,name);
        var rec={at:file.exported_at,who:file.exported_by,bytes:text.length,name:name,parts:file.key_count,counts:file.counts,pre:!!file.before_update};
        _pdLastMem=rec; try{ localStorage.setItem(PD_LAST,JSON.stringify(rec)); }catch(e){}
        chromeSync(true);
        if(quiet){ pdClose(); golRender(); return; }
        pdSet(pdHead('Exported ✓')
          +'<div class="pd-ok"><b>'+esc(name)+'</b><span>'+pdSize(text.length)+' · in your Downloads folder</span></div>'
          +'<ul class="pd-checks"><li>Read straight back and checked — every byte matches this laptop</li><li>'+file.key_count+' saved parts from both apps</li>'+(file.before_update?'<li>Also holds an untouched copy from before this update</li>':'')+'</ul>'
          +'<div class="pd-lab">What is in the file</div>'+pdCountsHtml(file.counts)
          +'<p class="pd-tip">Keep it safe: drag a copy into Google Drive, or email it to yourself. If anything ever goes wrong, <b>Import everything</b> puts it all back.</p>'
          +'<div class="pd-foot"><button class="pd-btn pd-ghost" onclick="pdPick()">Import a file instead…</button><span style="flex:1"></span><button class="pd-btn pd-pri" onclick="pdClose()">Done</button></div>');
      });
    }).catch(function(e){ pdShowError('The export did not finish ('+esc(String(e&&e.message||e))+'). Nothing was changed — try again.'); });
  },700);
}

/* ── import ── */
function pdPick(){ pdBox(); var i=document.getElementById('pdFile'); i.value=''; i.click(); }
function pdFileChosen(inp){
  var f=inp.files&&inp.files[0]; if(!f) return;
  pdBusy('Checking the file…');
  var r=new FileReader();
  r.onload=function(){ pdCheckFile(String(r.result||''),f.name); };
  r.onerror=function(){ pdShowError('That file could not be opened.'); };
  r.readAsText(f);
}
function pdCheckFile(text,fname){
  var file=pdParse(text);
  if(!file||typeof file!=='object') return pdShowError('<b>'+esc(fname)+'</b> is not a PLUB export — it could not be read.');
  if(file.app==='bdl-ub') return pdShowError('<b>'+esc(fname)+'</b> is a Unique Bundles-only backup. Put it back from Unique Bundles → Settings → Import backup.');
  if(file.format!=='plub-full-export'||!file.keys||typeof file.keys!=='object') return pdShowError('<b>'+esc(fname)+'</b> is not an “Export everything” file from PLUB.');
  if((file.format_version||1)>1) return pdShowError('This file was made by a newer PLUB (v'+esc(file.build)+'). Reload this page to update it first.');
  pdHash(file.keys).then(function(h){
    if(file.sha256&&h&&h!==file.sha256) return pdShowError('<b>'+esc(fname)+'</b> has been changed or damaged since it was exported, so it was not used.');
    _pdPending=file; pdCompare(file,fname);
  });
}
function pdCompare(file,fname){
  pdFlush();
  var now=pdCounts(pdRead()), fc=pdCounts(file.keys), u=CLUB.user(), lose=0;
  var rows=PD_ROWS.map(function(g){
    var shown=g[1].filter(function(r){ return fc[r[0]]||now[r[0]]; });   // a row that is 0 on both sides says nothing
    return '<tr class="pd-tg"><td colspan="3">'+g[0]+'</td></tr>'+(shown.length?shown.map(function(r){
      var a=fc[r[0]], b=now[r[0]], cls=a<b?' class="pd-less"':'';
      if(a<b&&r[0]!=='sh_activity') lose++;
      return '<tr'+cls+'><td>'+r[1]+'</td><td>'+a+'</td><td>'+b+(a<b?' <em>−'+(b-a)+'</em>':a>b?' <u>+'+(a-b)+' back</u>':'')+'</td></tr>';
    }).join(''):'<tr><td colspan="3" class="pd-nil">Nothing on either side</td></tr>');
  }).join('');
  var warn='', other=!!(u&&file.exported_by_id&&file.exported_by_id!==u.id);
  if(other) warn+='<div class="pd-warn">This file is <b>'+esc(file.exported_by)+'’s</b>. Online, importing <b>adds</b> it to the cloud — nothing of yours is removed.</div>';
  if(lose) warn+='<div class="pd-warn">This laptop has more in '+lose+' place'+(lose>1?'s':'')+' than the file (marked below). Those would be replaced — the safety copy keeps them.</div>';
  pdSet(pdHead('Import everything?','<b>'+esc(fname)+'</b><br>Exported '+esc(pdWhen(file.exported_at))+' by '+esc(file.exported_by)+' · PLUB v'+esc(file.build)+' · checked, undamaged')
    +warn
    +'<table class="pd-tbl"><thead><tr><th></th><th>In the file</th><th>On this laptop now</th></tr></thead><tbody>'+rows+'</tbody></table>'
    +'<ol class="pd-steps"><li>The file is combined with what’s in the cloud — nothing online is deleted</li><li>Anything missing or older online comes back from the file</li><li>You both see the result straight away</li></ol>'
    +'<p class="pd-tip">Close PLUB in any other tab first, or that tab can save its old copy back over this.</p>'
    +'<div class="pd-foot"><button class="pd-btn" onclick="pdOpen()">Cancel</button><button class="pd-btn pd-pri'+(other?' pd-danger':'')+'" onclick="pdReplace()">'+(other?'Add '+esc(file.exported_by)+'’s file to the cloud':'Add this file to the cloud')+'</button></div>');
}
function pdPark(){
  // empty both app frames first: each saves on its way out, and that save must land BEFORE the file is written, never after
  return new Promise(function(done){
    var n=0, fin=false; function end(){ if(!fin){ fin=true; done(); } }
    ['ub','pl'].forEach(function(a){ var f=FRAMES[a]; if(f&&f.getAttribute('src')){ n++; f.onload=function(){ if(--n<=0) end(); }; f.src='about:blank'; } });
    if(!n) end(); setTimeout(end,3000);
  });
}
function pdWrite(keys,before){
  var put=Object.keys(keys).filter(function(k){ return pdOwns(k)&&PD_KEEP.indexOf(k)<0; });
  try{
    // clear PLUB's own keys first so the space the old copies held is free for the file's
    pdKeys().forEach(function(k){ if(PD_KEEP.indexOf(k)<0) localStorage.removeItem(k); });
    put.forEach(function(k){ localStorage.setItem(k,keys[k]); });
    var bad=put.filter(function(k){ return localStorage.getItem(k)!==keys[k]; });
    if(bad.length) throw new Error('did not read back: '+bad.join(', '));
    return {ok:true,n:put.length};
  }catch(e){
    // put the laptop back exactly as it was before — each key on its own, so one failure can't stop the rest
    var stuck=[];
    pdKeys().forEach(function(k){ if(PD_KEEP.indexOf(k)<0){ try{ localStorage.removeItem(k); }catch(_e){} } });
    Object.keys(before).forEach(function(k){ if(PD_KEEP.indexOf(k)<0){ try{ localStorage.setItem(k,before[k]); }catch(_e){ stuck.push(k); } } });
    return {ok:false,err:e,stuck:stuck};
  }
}
function pdReplace(){
  var file=_pdPending; if(!file) return;
  if(window.PLUB_ONLINE) return plubOnlineImport(file);
  pdBusy('Saving a safety copy of this laptop first…');
  pdFlush();
  setTimeout(function(){
    var before=pdRead(), has=!!(before.ub_tracker_v1||before.pl_sourcing_v1||before.plub_v1);
    (has?pdHash(before).then(function(h){
      pdDownload(JSON.stringify(pdFileObj(before,h,{safety_copy:true})),'PLUB safety copy before import - '+pdStamp(new Date())+'.json');
    }):Promise.resolve()).then(function(){
      pdBusy('Putting everything back…');
      return pdPark();
    }).then(function(){
      before=pdRead();   // re-read after the apps' last saves, so a failed write rolls back to the truth
      var res=pdWrite(file.keys,before);
      if(!res.ok){
        var full=/quota/i.test(String(res.err&&res.err.name||''))||/quota/i.test(String(res.err&&res.err.message||''));
        ensureLoaded('ub'); ensureLoaded('pl');
        var tail=res.stuck&&res.stuck.length?' This laptop could not be put fully back — choose <b>Import everything</b> again and pick the <b>safety copy</b> that just downloaded.':' This laptop is exactly as it was.';
        return pdShowError((full?'This browser’s storage is full (every BDL web app shares it), so the file did not fit.':'The import did not finish ('+esc(String(res.err&&res.err.message||res.err))+').')+tail);
      }
      try{ sessionStorage.setItem('plub_import_check',JSON.stringify({counts:pdCounts(file.keys),who:file.exported_by,at:file.exported_at,n:res.n})); }catch(e){}
      location.reload();
    });
  },700);
}
(function pdAfterImport(){
  var chk=null; try{ chk=pdParse(sessionStorage.getItem('plub_import_check')||'null'); sessionStorage.removeItem('plub_import_check'); }catch(e){}
  if(!chk) return;
  setTimeout(function(){
    var now=pdCounts(pdRead());
    var off=[]; PD_ROWS.forEach(function(g){ g[1].forEach(function(r){ if(r[0]!=='sh_activity'&&chk.counts[r[0]]!==now[r[0]]) off.push(g[0]+' '+r[1].toLowerCase()+': file '+chk.counts[r[0]]+', now '+now[r[0]]); }); });
    pdSet(pdHead(off.length?'Imported — please check':'Imported ✓')
      +(off.length?'<div class="pd-warn">These counts are different from the file:<br>'+off.map(esc).join('<br>')+'</div>'
        :'<div class="pd-ok"><b>Everything is back</b><span>'+esc(chk.who)+'’s file from '+esc(pdWhen(chk.at))+' · '+chk.n+' saved parts · every count matches</span></div>')
      +'<div class="pd-lab">On this laptop now</div>'+pdCountsHtml(now)
      +'<div class="pd-foot"><button class="pd-btn pd-pri" onclick="pdClose()">Done</button></div>');
  },2500);
})();

/* ═══════ BEFORE WE GO ONLINE — the to-do page v1.00 opens on ═══════
   Each laptop is walked through: export everything → send it to Jack / keep it safe → carry on.
   Its own key, never exported or imported: it describes this laptop, not the business. */
var GOL_KEY='plub_golive_v1';
var _golMem=null;
function golState(){ var st=null; try{ st=pdParse(localStorage.getItem(GOL_KEY)||'null'); }catch(e){} return st||_golMem||{}; }
function golSave(st){ _golMem=st; try{ localStorage.setItem(GOL_KEY,JSON.stringify(st)); }catch(e){} }
function golTotal(c){ c=c||{}; return ['ub_ideas','ub_pipeline','ub_tasks','ub_inbox','ub_vendors','pl_ideas','pl_vendors','pl_week_tasks','sh_tasks'].reduce(function(a,k){ return a+(c[k]||0); },0); }
function golIsJack(){ var u=CLUB.user(); return !!(u&&u.role==='owner'); }
function golRail(){ pdExport(); }   // one click from anywhere — the to-do page still opens by itself until it's finished
function golOpen(){
  var g=document.getElementById('golive');
  if(!g){ g=document.createElement('div'); g.id='golive'; g.className='gol'; document.body.appendChild(g); }
  g.classList.add('show'); golRender();
}
function golClose(later){ var g=document.getElementById('golive'); if(g) g.classList.remove('show'); if(later){ try{ sessionStorage.setItem('plub_golive_later','1'); }catch(e){} } }
function golSent(){ var st=golState(); st.sent=new Date().toISOString(); golSave(st); golRender(); }
function golFinish(){ var st=golState(); st.done=new Date().toISOString(); golSave(st); golClose(); chromeSync(true); }
function golCopy(name){
  var ok=function(){ var b=document.getElementById('golCopyBtn'); if(b){ b.textContent='Copied ✓'; setTimeout(function(){ if(b) b.textContent='Copy the file name'; },1800); } };
  try{ navigator.clipboard.writeText(name).then(ok,function(){}); }catch(e){}
}
function golRender(){
  var g=document.getElementById('golive'); if(!g||!g.classList.contains('show')) return;
  var u=CLUB.user(), nm=u?u.display_name:'', jack=golIsJack(), st=golState(), r=pdLast();
  var exported=!!r, sent=!!st.sent, all=exported&&sent;
  function step(n,state,title,body){
    return '<div class="gol-step '+state+'"><div class="gol-n">'+(state==='done'?'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 8.5l3 3 6-7"/></svg>':n)+'</div>'
      +'<div class="gol-sb"><h4>'+title+'</h4>'+body+'</div></div>';
  }
  var s1 = exported
    ? '<div class="gol-file"><b>'+esc(r.name||'PLUB everything')+'</b><span>'+pdSize(r.bytes||0)+' · saved '+esc(pdWhen(r.at))+' · in your <b>Downloads</b> folder</span></div>'
      +'<p class="gol-ok">✓ Checked — it reads back perfectly and holds everything on this laptop'+(r.pre?'<br>✓ Also holds an untouched copy from before this update':'')+'</p>'
      +(r.counts?(golTotal(r.counts)
        ?'<div class="gol-in"><div class="gol-in-h">What’s in the file — does this look like your work?</div>'+pdCountsHtml(r.counts)+'</div>'
        :'<div class="gol-empty"><b>This file is empty</b> — PLUB on this laptop has nothing saved. Tell Jack before going any further.</div>'):'')
      +'<button class="gol-link" onclick="pdExport(true)">Export again</button>'
    : '<p>One file with every idea, product, task, supplier and session from <b>both</b> Unique Bundles and Private Label. Nothing on this laptop changes.</p>'

    : (sent?'<p class="gol-ok">✓ Sent to Jack</p>'

  var s3 = '<p>Keep using PLUB exactly as normal until '+(jack?'the online version is switched on':'Jack says the online version is ready')+'. Don’t import anything unless '+(jack?'you mean to':'Jack asks you to')+'.</p>'
    +(all?'<button class="gol-big" onclick="golFinish()">All done — open PLUB</button>':'');
  g.innerHTML='<div class="gol-wrap">'
    +'<div class="gol-top"><div class="gol-mark">P</div><b>PLUB</b><span>v'+BUILD+'</span></div>'

    +'</div>'
    +'<div class="gol-foot">'+(all?'':'<button class="gol-later" onclick="golClose(true)">Not now — remind me next time</button>')
    +'<button class="gol-later" onclick="golClose();pdOpen()">Need to put a file back? Import…</button></div>'

<script id="plub-foryou-audit">
/* ═══════ FOR YOU + WEEKLY AUDIT — two shell pages that read both apps' stores; they change nothing except ticking a task done ═══════
   For you: what's on this person's plate today — their tasks from both apps (overdue first), what's waiting on Jack,
   what needs a push, and what the other person did lately. Becki lands here.
   Weekly audit: who used PLUB, how and why, per person per week — from the activity log and session timer (both apps
   log into the shared core) and, once online, the cloud's change history. Jack sees both people; Becki sees her own week. */
var FY_DAY=864e5;
function fyToday(){ var d=new Date(); d.setHours(0,0,0,0); return d.getTime(); }
function fyDue(due){
  if(!due) return {k:'none',t:'',r:5};
  var d=new Date(String(due).length<=10?due+'T00:00:00':due); if(isNaN(d)) return {k:'none',t:'',r:5};
  d.setHours(0,0,0,0); var diff=Math.round((d.getTime()-fyToday())/FY_DAY);
  if(diff<0) return {k:'over',t:(-diff)+' day'+(diff===-1?'':'s')+' overdue',r:0};
  if(diff===0) return {k:'today',t:'due today',r:1};
  if(diff===1) return {k:'soon',t:'due tomorrow',r:2};
  if(diff<7) return {k:'soon',t:'due '+d.toLocaleDateString('en-GB',{weekday:'short'}),r:3};
  return {k:'later',t:'due '+d.toLocaleDateString('en-GB',{day:'numeric',month:'short'}),r:4};
}
function fyStores(){ var ub=null, pl=null; try{ ub=JSON.parse(localStorage.getItem('ub_tracker_v1')||'null'); }catch(e){} try{ pl=JSON.parse(localStorage.getItem('pl_sourcing_v1')||'null'); }catch(e){} return {ub:ub,pl:pl}; }
function fyTasks(u){
  var out=[], st=fyStores();
  CLUB.tasksFor(u.id).forEach(function(t){
    out.push({src:'club', id:t.id, title:t.title, due:t.due, pri:t.priority, app:t.related_app, ref:t.related_ref, rel:t.related_name, url:t.url,
      from:(t.created_by&&t.created_by!==u.id)?CLUB.nameOf(t.created_by):null, status:t.status});
  });
  ((st.ub&&st.ub.tasks)||[]).forEach(function(t){
    if(t.to!==u.display_name || t.status==='done') return;
    out.push({src:'ub', id:t.id, title:t.title, due:t.due, pri:t.pri, app:'ub', rel:t.rel, url:t.url, from:(t.from&&t.from!==u.display_name)?t.from:null, status:t.status});
  });
  out.forEach(function(t){ t.d=fyDue(t.due); });
  var P={urgent:0,high:1,medium:2,normal:2,low:3};
  out.sort(function(a,b){ return (a.d.r-b.d.r) || ((P[a.pri]==null?2:P[a.pri])-(P[b.pri]==null?2:P[b.pri])) || String(a.due||'9').localeCompare(String(b.due||'9')); });
  return out;
}
function fyWaitingJack(){
  var st=fyStores(), out=[];
  ((st.ub&&st.ub.pipeline)||[]).forEach(function(p){
    if(p.stage!=='jack_validation') return;
    var d=p.entered?Math.max(0,Math.floor((Date.now()-new Date(p.entered).getTime())/FY_DAY)):null;
    out.push({app:'ub', id:p.id, title:p.title, days:d, late:d!=null&&d>=3});
  });
  return out.sort(function(a,b){ return (b.days||0)-(a.days||0); });
}
function fyBadge(){
  var u=CLUB.user(); if(!u) return 0;
  var n=fyTasks(u).filter(function(t){ return t.d.k==='over'||t.d.k==='today'; }).length;
  if(u.role==='owner') n+=fyWaitingJack().length;
  return n;
}
var FY_KIND={idea_added:'added the idea',idea_updated:'updated',stage:'moved',entered_pipeline:'put into the pipeline',launched:'launched',dropped:'dropped',
  supplier_added:'added supplier',supplier_contacted:'contacted supplier',sample_added:'added a sample for',sample_ordered:'ordered a sample of',sample_received:'received a sample of',
  task_done:'finished the task',task_assigned:'gave a task',task_status:'updated the task',task_note:'added a note to',product_opened:'opened',note:'added a note to',
  session_start:'started a session',session_end:'ended a session',session_logged:'logged a session',signed_in:'signed in',signed_out:'signed out',
  storefront_checked:'checked the storefront',flagged:'flagged',task:''};
// Unique Bundles mirrors its own task events too — a completed task would otherwise show twice
function fyShow(a){ return !FY_QUIET[a.kind] && !(a.kind==='task' && /^Task completed/i.test(a.entity_name||'')); }
var FY_QUIET={product_opened:1,signed_in:1,signed_out:1,session_start:1};
function fyActLine(a,showWho){
  var verb=FY_KIND[a.kind]!=null?FY_KIND[a.kind]:String(a.kind||'').replace(/_/g,' ');
  var what=a.entity_name?' <b>'+esc(a.entity_name)+'</b>':'';
  var move=(a.from_val||a.to_val)?' <i>'+esc(a.from_val||'')+(a.from_val&&a.to_val?' → ':'')+esc(a.to_val||'')+'</i>':'';
  if(a.kind==='task_assigned'){ if(a.to_val&&a.to_val!==a.actor_name) move=' <i>to '+esc(a.to_val)+'</i>'; else { verb='added the task'; move=''; } }
  var app=a.app==='ub'?'<span class="fy-app ub">UB</span>':a.app==='pl'?'<span class="fy-app pl">PL</span>':'';
  var t=new Date(a.at), hm=('0'+t.getHours()).slice(-2)+':'+('0'+t.getMinutes()).slice(-2);
  return '<div class="fy-act"><span class="fy-t">'+hm+'</span>'+(showWho?'<b class="fy-who">'+esc(a.actor_name||'?')+'</b> ':'')+verb+what+move+' '+app+(a.mins?' <span class="fy-mins">'+fmtH(a.mins/60)+'</span>':'')+'</div>';
}
function fyDone(src,id){
  if(src==='club'){ CLUB.taskStatus(id,'done'); }
  else { frameRun('ub','taskStatus('+JSON.stringify(id)+',"done"); saveState(); flushSave();'); }
  setTimeout(function(){ renderPipe(); chromeSync(true); },250);
}
function fyOpenTask(src,id,app,ref){
  if(src==='ub'){ show('ub'); railGo('ub','tasks'); return; }
  if(app&&ref){ ovOpen(app,ref); return; }
  show(app==='pl'?'pl':'ub');
}

function renderForYou(){
  var u=CLUB.user(); if(!u){ document.getElementById('pipe').innerHTML=''; return; }
  var jack=u.role==='owner', other=CLUB.users().filter(function(x){ return x.id!==u.id; })[0];
  var tasks=fyTasks(u), waiting=fyWaitingJack(), cards=readStores().cards.filter(function(c){ return c.over; });
  var over=tasks.filter(function(t){ return t.d.k==='over'; }).length, today=tasks.filter(function(t){ return t.d.k==='today'; }).length;
  var hr=new Date().getHours(), hello=hr<12?'Morning':hr<18?'Afternoon':'Evening';
  var chips='<div class="fy-chips">'
    +(over?'<span class="fy-chip bad"><b>'+over+'</b> overdue</span>':'')
    +'<span class="fy-chip'+(today?' warn':'')+'"><b>'+today+'</b> due today</span>'
    +'<span class="fy-chip"><b>'+tasks.length+'</b> open tasks</span>'
    +(waiting.length?'<span class="fy-chip '+(jack?'warn':'')+'"><b>'+waiting.length+'</b> waiting for '+(jack?'you':'Jack')+'</span>':'')
    +(cards.length?'<span class="fy-chip"><b>'+cards.length+'</b> need a push</span>':'')+'</div>';
  // tasks
  var tl=tasks.length? tasks.map(function(t){
      return '<div class="fy-task '+t.d.k+'">'
        +'<button class="fy-tick" title="Mark done" onclick="fyDone(\''+t.src+'\','+esc(JSON.stringify(t.id))+')"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 8.5l3 3 6-7"/></svg></button>'
        +'<div class="fy-tb"><div class="fy-tt">'+esc(t.title||'Untitled task')+'</div>'
        +'<div class="fy-tm">'+(t.d.t?'<span class="fy-due '+t.d.k+'">'+t.d.t+'</span>':'<span class="fy-due none">no date</span>')
          +(t.app?'<span class="fy-app '+t.app+'">'+(t.app==='ub'?'UB':t.app==='pl'?'PL':'')+'</span>':'')
          +(t.rel?'<span>'+esc(t.rel)+'</span>':'')+(t.from?'<span>from '+esc(t.from)+'</span>':'')
          +(t.status==='in_process'||t.status==='in_progress'?'<span class="fy-ip">in progress</span>':'')+'</div></div>'
        +(t.url?'<a class="fy-go" href="'+esc(t.url)+'" target="_blank" rel="noopener">Link ↗</a>':'')
        +'<button class="fy-go" onclick="fyOpenTask(\''+t.src+'\','+esc(JSON.stringify(t.id))+',\''+(t.app||'')+'\','+esc(JSON.stringify(t.ref||null))+')">Open</button></div>';
    }).join('') : '<div class="fy-empty">Nothing on your list. 🎉</div>';
  // waiting on Jack
  var wl=waiting.map(function(w){ return '<button class="fy-row'+(w.late?' late':'')+'" onclick="ovOpen(\'ub\','+esc(JSON.stringify(w.id))+')"><span class="fy-app ub">UB</span><b>'+esc(w.title)+'</b><em>'+(w.days==null?'':w.days===0?'today':w.days+' day'+(w.days===1?'':'s'))+(w.late?' — over 3 days':'')+'</em></button>'; }).join('');
  // needs a push
  var pl=cards.sort(function(a,b){ return (b.days||0)-(a.days||0); }).slice(0,12).map(function(c){ return '<button class="fy-row" onclick="ovOpen(\''+c.app+'\','+esc(JSON.stringify(c.id))+')"><span class="fy-app '+c.app+'">'+c.app.toUpperCase()+'</span><b>'+esc(c.title)+'</b><em>'+esc(c.stage)+' · '+c.days+' days</em></button>'; }).join('');
  // the other person lately
  var acts=other?CLUB.activityBetween(Date.now()-7*FY_DAY,Date.now()+60000,other.id).filter(fyShow).slice(-12).reverse():[];
  var al=acts.map(function(a){ return fyActLine(a,false); }).join('');
  document.getElementById('pipe').innerHTML='<div class="ov-main"><div class="pane ov-pane fy-pane">'
    +'<div class="page-hd"><div><div class="eyebrow">'+new Date().toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'})+'</div>'
    +'<div class="page-title">'+hello+', '+esc(u.display_name)+'</div><div class="page-sub">Everything that needs you, in one place — both apps.</div></div>'
    +'<button class="fy-add" onclick="sfOpen()">＋ Storefront link</button></div>'
    +chips
    +'<div class="fy-grid"><div class="fy-col">'
      +'<div class="ov-card fy-card"><div class="fy-h">Your tasks<span>'+tasks.length+'</span></div>'+tl+'</div>'
    +'</div><div class="fy-col">'
      +(waiting.length?'<div class="ov-card fy-card"><div class="fy-h">'+(jack?'Waiting for you to validate':'Waiting for Jack to validate')+'<span>'+waiting.length+'</span></div>'+wl+'</div>':'')
      +'<div class="ov-card fy-card"><div class="fy-h">Needs a push<span>'+cards.length+'</span></div>'+(pl||'<div class="fy-empty">Nothing is past its stage target.</div>')+'</div>'
      +(other?'<div class="ov-card fy-card"><div class="fy-h">'+esc(other.display_name)+' lately<span>7 days</span></div>'+(al||'<div class="fy-empty">'+(window.PLUB_ONLINE?'Nothing yet this week.':'Shows up once PLUB is online — '+esc(other.display_name)+'’s work is on '+(other.role==='owner'?'his':'her')+' laptop for now.')+'</div>')+'</div>':'')
    +'</div></div></div></div>';
}

/* ── Sarah's weekly storefront link → a "check this storefront" task: UB for Becki, PL for Jack, due that Friday ── */
var _sfApp='ub';
function sfFriday(){ var d=new Date(); d.setHours(0,0,0,0); var add=(5-d.getDay()+7)%7; if(add<2) add+=7;   // pasted Thu–Sun → next week's Friday, never due today
  d.setDate(d.getDate()+add); return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); }
function sfPersonFor(app){ var us=CLUB.users(); var p=us.filter(function(u){ return app==='pl'?u.role==='owner':u.role!=='owner'; })[0]; return p||us[0]; }
// a list file (like "UB and PL Keepa links - last 5 weeks.md"): "## UB" / "## PL" sections, a "### …" heading per week,
// the link on the line under it. Each week becomes one task, for the person who owns that side.
function sfParseMd(text){
  var out=[], app=null, head=null;
  String(text||'').split(/\n/).forEach(function(line){
    var t=line.trim(), h2=t.match(/^##\s+(UB|PL)\b/i), h3=t.match(/^###\s+(.+)$/), m=t.match(/https?:\/\/\S+/i);
    if(h2){ app=h2[1].toLowerCase(); head=null; return; }
    if(h3){ head=h3[1].trim(); var a=head.match(/^(UB|PL)\b/i); if(a) app=a[1].toLowerCase(); return; }
    if(m && app){ var name=(head||'Storefront paste').replace(/^(UB|PL)\s*[—–-]\s*/i,''); out.push({url:m[0].replace(/[),.;]+$/,''),name:name,app:app}); head=null; }
  });
  return out;
}
function sfIsMd(text){ return /^##\s+(UB|PL)\b/im.test(String(text||'')) || /^###\s+(UB|PL)\b/im.test(String(text||'')); }
function sfItems(){
  var text=(document.getElementById('sfLinks')||{}).value||'';
  var list=sfIsMd(text)?sfParseMd(text):sfParse(text).map(function(x){ return {url:x.url,name:x.name,app:_sfApp}; });
  var have={}; CLUB.all('tasks').forEach(function(t){ if(t.url) have[t.url]=1; });
  list.forEach(function(x){ x.dupe=!!have[x.url]; });
  return list;
}
function sfFile(inp){ var f=inp.files&&inp.files[0]; if(!f) return; f.text().then(function(t){ var ta=document.getElementById('sfLinks'); ta.value=t; sfPreview(); }); }
function sfParse(text){
  return String(text||'').split(/\n+/).map(function(line){
    var m=line.match(/https?:\/\/\S+/i); if(!m) return null;
    var url=m[0].replace(/[),.;]+$/,''), name=line.replace(m[0],'').replace(/^[\s\-–—:|·•]+|[\s\-–—:|·•]+$/g,'').trim();
    if(!name){ var seller=(url.match(/[?&](?:me|seller)=([A-Z0-9]+)/i)||[])[1]; try{ var h=new URL(url).hostname.replace(/^www\./,''); name=seller?'Amazon seller '+seller:h; }catch(e){ name='Storefront'; } }
    return {url:url,name:name};
  }).filter(Boolean);
}
function sfOpen(){
  _sfApp='ub';
  pdSet(pdHead('Add a storefront link','Paste Sarah’s link — or several, one per line. You can put a name before each link. They become “check this storefront” tasks, due <b>Friday</b>.')
    +'<div class="sf-up"><input type="file" id="sfFileIn" accept=".md,.txt,text/plain,text/markdown" style="display:none" onchange="sfFile(this)"><button class="pd-btn" onclick="document.getElementById(\'sfFileIn\').click()">⬆ Upload a list file (.md)</button><span>UB and PL sections go to the right person automatically</span></div>'
    +'<textarea id="sfLinks" class="sf-ta" placeholder="https://www.amazon.co.uk/s?me=A1B2C3D4…&#10;Gift Box Co — https://www.amazon.co.uk/s?me=…" oninput="sfPreview()"></textarea>'
    +'<div class="sf-pick"><button class="sf-b on" data-a="ub" onclick="sfPick(\'ub\')"><span class="fy-app ub">UB</span> Unique Bundles <i>→ '+esc(sfPersonFor('ub').display_name)+'</i></button>'
    +'<button class="sf-b" data-a="pl" onclick="sfPick(\'pl\')"><span class="fy-app pl">PL</span> Private Label <i>→ '+esc(sfPersonFor('pl').display_name)+'</i></button></div>'
    +'<div id="sfPrev" class="sf-prev"></div>'
    +'<div class="pd-foot"><button class="pd-btn" onclick="pdClose()">Cancel</button><button class="pd-btn pd-pri" id="sfGo" onclick="sfSave()" disabled>Add</button></div>');
  setTimeout(function(){ var t=document.getElementById('sfLinks'); if(t) t.focus(); },30);
}
function sfPick(a){ _sfApp=a; Array.prototype.forEach.call(document.querySelectorAll('.sf-b'),function(b){ b.classList.toggle('on',b.getAttribute('data-a')===a); }); sfPreview(); }
function sfPreview(){
  var all=sfItems(), list=all.filter(function(x){ return !x.dupe; }), el=document.getElementById('sfPrev'), go=document.getElementById('sfGo');
  var md=sfIsMd((document.getElementById('sfLinks')||{}).value), pick=document.querySelector('.sf-pick'); if(pick) pick.style.display=md?'none':'';
  var by={}; list.forEach(function(x){ var n=sfPersonFor(x.app).display_name; by[n]=(by[n]||0)+1; });
  if(go){ go.disabled=!list.length; go.textContent=list.length?'Add '+Object.keys(by).map(function(n){ return by[n]+' for '+n; }).join(' + '):'Add'; }
  if(el) el.innerHTML=all.length?all.map(function(x){ return '<div'+(x.dupe?' class="dupe"':'')+'><b><span class="fy-app '+x.app+'">'+x.app.toUpperCase()+'</span> Check storefront: '+esc(x.name)+' <i>→ '+esc(sfPersonFor(x.app).display_name)+(x.dupe?' · already added':'')+'</i></b><span>'+esc(x.url.length>90?x.url.slice(0,90)+'…':x.url)+'</span></div>'; }).join(''):'';
}
function sfSave(){
  var list=sfItems().filter(function(x){ return !x.dupe; }), due=sfFriday(), by={};
  list.forEach(function(x){ var who=sfPersonFor(x.app); by[who.display_name]=(by[who.display_name]||0)+1;
    CLUB.taskAdd({title:'Check storefront: '+x.name, url:x.url, type:'storefront', due:due, priority:'normal', assigned_to:who.id, related_app:x.app}); });
  pdSet(pdHead('Added ✓')+'<div class="pd-ok"><b>'+Object.keys(by).map(function(n){ return by[n]+' storefront task'+(by[n]>1?'s':'')+' for '+esc(n); }).join(' · ')+'</b><span>Due Friday · on their For you list</span></div><div class="pd-foot"><button class="pd-btn pd-pri" onclick="pdClose()">Done</button></div>');
  try{ renderPipe(); }catch(e){} chromeSync(true);
}

/* ── weekly audit ── */
var _auWeek=0;   // 0 = this week, 1 = last week …
function auMonday(offset){ var d=new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()-((d.getDay()+6)%7)-7*(offset||0)); return d.getTime(); }
function auStep(n){ _auWeek=Math.max(0,_auWeek+n); renderPipe(); }
var AU_AREAS=[['ub','ideas','UB · Ideas & ranking'],['ub','pipeline','UB · Pipeline'],['ub','inbox','UB · Review queue'],['ub','tasks','UB · Tasks'],['ub','vendors','UB · Suppliers'],
  ['ub','storefronts','UB · Storefronts'],['ub','seasons','UB · Seasonality'],['pl','ideas','PL · Ideas & pipeline'],['pl','data.vendors','PL · Suppliers'],['pl','data.weekTasks','PL · Week plan'],
  ['club','tasks','Shared tasks'],['club','sessions','Session timer']];
var _auHist={};
function auHistory(ws,cb){
  var be=window.plubBackend&&plubBackend(); if(!be||!be.history){ cb(null); return; }
  var key=String(ws); if(_auHist[key]){ cb(_auHist[key]); return; }
  be.history(new Date(ws).toISOString()).then(function(rows){ _auHist[key]=rows||[]; cb(_auHist[key]); }).catch(function(){ cb(null); });
}
function renderAudit(){
  var u=CLUB.user(); if(!u){ document.getElementById('pipe').innerHTML=''; return; }
  var jack=u.role==='owner', ws=auMonday(_auWeek), we=ws+7*FY_DAY, now=Date.now();
  var sum=CLUB.summarise(ws,we), people=CLUB.users().filter(function(x){ return jack||x.id===u.id; });
  var days=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  var label=_auWeek===0?'This week':_auWeek===1?'Last week':'Week of '+new Date(ws).toLocaleDateString('en-GB',{day:'numeric',month:'short'});
  var cardsH=people.map(function(p){
    var s=sum[p.id]||{acts:[],mins:0,byType:{}};
    var sess=CLUB.sessionsFor(p.id,ws,we);
    var perDay=days.map(function(_,i){ var a=ws+i*FY_DAY, b=a+FY_DAY;
      var ts=s.acts.map(function(x){ return new Date(x.at).getTime(); }).concat(sess.map(function(x){ return new Date(x.started_at).getTime(); })).filter(function(t){ return t>=a&&t<b; }).sort();
      return {n:ts.length,first:ts[0],last:ts[ts.length-1],future:a>now};
    });
    var active=perDay.filter(function(d){ return d.n; }).length;
    var hm=function(t){ var d=new Date(t); return ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2); };
    var dayH='<div class="au-days">'+perDay.map(function(d,i){ return '<div class="au-day'+(d.n?' on':'')+(d.future?' fut':'')+(i>4?' we':'')+'" title="'+(d.n?hm(d.first)+'–'+hm(d.last)+' · '+d.n+' things':'nothing')+'"><b>'+days[i]+'</b><i>'+(d.n?hm(d.first)+'<br>'+hm(d.last):'—')+'</i></div>'; }).join('')+'</div>';
    var tot=s.mins||0, types=Object.keys(s.byType||{}).sort(function(a,b){ return s.byType[b]-s.byType[a]; });
    var typeH=types.length?types.map(function(k){ var m=s.byType[k], pc=tot?Math.round(m/tot*100):0;
      return '<div class="au-type"><span>'+esc(CLUB.wtLabel(k)||k||'Unlabelled')+(CLUB.wtCounts(k)?'':' <em>not KPI</em>')+'</span><div class="au-bar"><s style="width:'+pc+'%"></s></div><b>'+fmtH(m/60)+'</b></div>'; }).join('')
      :'<div class="fy-empty">No sessions timed.</div>';
    var notes=sess.filter(function(x){ return x.note||x.notes; }).slice(-4).map(function(x){ return '<div class="au-note">“'+esc(x.note||x.notes)+'” <span>'+esc(CLUB.wtLabel(x.work_type)||'')+'</span></div>'; }).join('');
    var nums=[['Ideas added',s.ideas_added],['Into pipeline',s.entered],['Moved forward',s.moved],['Tasks done',s.tasks_done],['Suppliers',s.suppliers],['Samples',s.samples],['Launched',s.launched],['Dropped',s.dropped]];
    return '<div class="ov-card au-card"><div class="au-ph"><span class="au-av" style="--av:'+(p.role==='owner'?'#A78BFF':'#00E5A0')+'">'+esc(p.display_name[0])+'</span><b>'+esc(p.display_name)+'</b>'
      +'<em>'+active+' day'+(active===1?'':'s')+' active · '+fmtH(tot/60)+' timed</em></div>'
      +dayH
      +'<div class="au-nums">'+nums.map(function(n){ return '<div class="'+(n[1]?'':'z')+'"><b>'+(n[1]||0)+'</b><span>'+n[0]+'</span></div>'; }).join('')+'</div>'
      +'<div class="fy-h sm">Where the time went</div>'+typeH
      +(notes?'<div class="fy-h sm">What they said they did</div>'+notes:'')
      +'</div>';
  }).join('');
  var acts=[]; people.forEach(function(p){ ((sum[p.id]||{}).acts||[]).forEach(function(a){ if(fyShow(a)) acts.push(a); }); });
  acts.sort(function(a,b){ return new Date(b.at)-new Date(a.at); });
  var byDay={}; acts.forEach(function(a){ var k=new Date(a.at).toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'short'}); (byDay[k]=byDay[k]||[]).push(a); });
  var tl=Object.keys(byDay).map(function(k){ return '<div class="au-dh">'+k+'<span>'+byDay[k].length+'</span></div>'+byDay[k].map(function(a){ return fyActLine(a,jack); }).join(''); }).join('')||'<div class="fy-empty">Nothing recorded this week.</div>';
  document.getElementById('pipe').innerHTML='<div class="ov-main"><div class="pane ov-pane au-pane">'
    +'<div class="page-hd"><div><div class="eyebrow">'+(jack?'Who used PLUB, how, and why':'Your week')+'</div><div class="page-title">'+(jack?'Weekly audit':'My week')+'</div>'
    +'<div class="page-sub">'+new Date(ws).toLocaleDateString('en-GB',{day:'numeric',month:'short'})+' – '+new Date(we-FY_DAY).toLocaleDateString('en-GB',{day:'numeric',month:'short'})+(window.PLUB_ONLINE?'':' · this laptop only until PLUB is online')+'</div></div>'
    +'<div class="au-nav"><button onclick="auStep(1)">‹</button><span>'+label+'</span><button onclick="auStep(-1)"'+(_auWeek===0?' disabled':'')+'>›</button></div></div>'
    +'<div class="au-grid">'+cardsH+'</div>'
    +'<div class="au-two"><div class="ov-card au-card"><div class="fy-h">Parts of PLUB used this week</div><div id="auAreas"><div class="fy-empty">'+(window.PLUB_ONLINE?'Loading…':'Shows once PLUB is online — it reads the cloud’s change history.')+'</div></div></div>'
    +'<div class="ov-card au-card"><div class="fy-h">Not touched in 4 weeks</div><div id="auUnused"><div class="fy-empty">'+(window.PLUB_ONLINE?'Loading…':'Shows once PLUB is online.')+'</div></div></div></div>'
    +'<div class="ov-card au-card"><div class="fy-h">Timeline</div>'+tl+'</div>'
    +'</div></div>';
  if(window.PLUB_ONLINE){
    var mem=(window.plubMembers&&plubMembers())||{}, nm=function(uid){ return (mem[uid]&&mem[uid].name)||'?'; };
    auHistory(ws,function(rows){
      var el=document.getElementById('auAreas'); if(!el) return;
      if(!rows){ el.innerHTML='<div class="fy-empty">Couldn’t read the history just now.</div>'; return; }
      rows=rows.filter(function(r){ var t=new Date(r.at).getTime(); return t<we && (jack || nm(r.by).toLowerCase()===u.id); });
      var counts={}; rows.forEach(function(r){ if(r.coll==='_order'||r.coll==='_doc') return; var k=r.app+'|'+r.coll, w=nm(r.by); counts[k]=counts[k]||{}; counts[k][w]=(counts[k][w]||0)+1; });
      var list=AU_AREAS.filter(function(a){ return counts[a[0]+'|'+a[1]]; }).map(function(a){ var c=counts[a[0]+'|'+a[1]]; var tot=Object.keys(c).reduce(function(x,k){ return x+c[k]; },0);
        return '<div class="au-area"><span>'+a[2]+'</span><b>'+tot+'</b><em>'+Object.keys(c).map(function(k){ return esc(k)+' '+c[k]; }).join(' · ')+'</em></div>'; }).join('');
      el.innerHTML=list||'<div class="fy-empty">No changes saved this week.</div>';
    });
    auHistory(now-28*FY_DAY,function(rows){
      var el=document.getElementById('auUnused'); if(!el) return;
      if(!rows){ el.innerHTML='<div class="fy-empty">Couldn’t read the history just now.</div>'; return; }
      var seen={}; rows.forEach(function(r){ seen[r.app+'|'+r.coll]=1; });
      var unused=AU_AREAS.filter(function(a){ return !seen[a[0]+'|'+a[1]]; });
      el.innerHTML=unused.length?unused.map(function(a){ return '<div class="au-area dim"><span>'+a[2]+'</span><em>nothing saved in 28 days</em></div>'; }).join('')+'<p class="au-hint">Kept on purpose — just worth knowing what isn’t being used.</p>'
        :'<div class="fy-empty">Every part of PLUB was used in the last 4 weeks.</div>';
    });
  }
}
</script>
